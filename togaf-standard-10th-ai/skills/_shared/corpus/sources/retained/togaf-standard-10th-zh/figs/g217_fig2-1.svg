<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="760" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">架构描述的“充分性 × 正式度”矩阵</text>
<line x1="90" y1="250" x2="700" y2="250" stroke="#555"/><line x1="90" y1="250" x2="90" y2="60" stroke="#555"/>
<text x="640" y="275" font-size="10.5">正式度/完整性 →</text><text x="30" y="160" font-size="10.5" transform="rotate(-90 30 160)">充分性 →</text>
<rect x="100" y="70" width="270" height="80" fill="#f6c9c0" stroke="#b07a55"/><text x="235" y="105" text-anchor="middle" font-size="11">复杂但无文档</text><text x="235" y="125" text-anchor="middle" font-size="10">架构不足</text>
<rect x="390" y="160" width="290" height="80" fill="#fbe9b6" stroke="#b09040"/><text x="535" y="195" text-anchor="middle" font-size="11">对每个想法都要求架构</text><text x="535" y="215" text-anchor="middle" font-size="10">架构过度</text>
<rect x="390" y="70" width="290" height="80" fill="#d7e8d3" stroke="#5f8f5f"/><text x="535" y="105" text-anchor="middle" font-size="11">“刚好足够、恰好及时”</text><text x="535" y="125" text-anchor="middle" font-size="10">目标区间</text>
<text x="20" y="290" font-size="10.5" fill="#666">架构师应判断正式度与完整性，避免“无架构”与“过度架构”两个极端。</text>
</svg>
