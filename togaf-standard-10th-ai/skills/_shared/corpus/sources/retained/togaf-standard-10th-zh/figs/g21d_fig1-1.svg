<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="420" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">政府参考模型（GRM）的 11 个部门</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="55" width="250" height="50" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="165" y="86">国际事务与贸易</text>
<rect x="320" y="55" width="250" height="50" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="445" y="86">国防与安全</text>
<rect x="600" y="55" width="250" height="50" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="725" y="86">一般政府与地方服务</text>
<rect x="40" y="125" width="250" height="50" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="165" y="156">青少年与教育</text>
<rect x="320" y="125" width="250" height="50" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="445" y="156">健康与社区福祉</text>
<rect x="600" y="125" width="250" height="50" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="725" y="156">司法、治安与内政</text>
<rect x="40" y="195" width="250" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="165" y="226">财政</text>
<rect x="320" y="195" width="250" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="445" y="226">增长、住房与环境</text>
<rect x="600" y="195" width="250" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="725" y="226">政策、绩效、人口与创新</text>
<rect x="40" y="265" width="250" height="50" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="165" y="296">共享服务</text>
<rect x="320" y="265" width="250" height="50" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="445" y="296">交通与运营</text>
</g>
<text x="20" y="360" font-size="10.5" fill="#666">GRM 是公共部门的穷尽且互斥参考模型，可用于开箱即用、扩展或按组织特性定制。</text>
<text x="20" y="385" font-size="10.5" fill="#666">每个部门下按“功能（Function）—服务（Service）—说明”三层组织，形成可复用的能力目录。</text>
</svg>
