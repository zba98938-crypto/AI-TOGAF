<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>

  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E8296"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#35608C"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1F3864"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1F3864">图 3-11　在不同层面度量信息系统的环境影响</text>
  <text x="24" y="57" font-size="12.5" fill="#5A6B7B">按业务用途、软件与应用、基础设施与网络三个层面组织指标，经 CO2 当量框架折算为对应层级的碳足迹。</text>

  <!-- 第一层：业务用途 -->
  <rect x="24" y="98" width="830" height="130" rx="12" fill="#F4F6F8" stroke="#DCE3EA"/>
  <text x="439" y="123" font-size="15" font-weight="bold" fill="#33465B" text-anchor="middle">业务用途</text>
  <rect x="84" y="136" width="340" height="76" rx="8" fill="#E3EAF2" stroke="#7E93A8" stroke-width="1.4"/>
  <text x="254" y="167" font-size="12.5" fill="#1F3864" text-anchor="middle">按用途/业务管理的</text>
  <text x="254" y="189" font-size="12.5" fill="#1F3864" text-anchor="middle">基础设施指标</text>
  <rect x="454" y="136" width="340" height="76" rx="8" fill="#E3EAF2" stroke="#7E93A8" stroke-width="1.4"/>
  <text x="624" y="167" font-size="12.5" fill="#1F3864" text-anchor="middle">按用途/业务管理的</text>
  <text x="624" y="189" font-size="12.5" fill="#1F3864" text-anchor="middle">应用指标</text>

  <!-- 第二层：软件与应用 -->
  <rect x="24" y="240" width="830" height="130" rx="12" fill="#F4F6F8" stroke="#DCE3EA"/>
  <text x="439" y="265" font-size="15" font-weight="bold" fill="#33465B" text-anchor="middle">软件与应用</text>
  <rect x="42" y="278" width="188" height="80" rx="8" fill="#C9D9E8" stroke="#4E7396" stroke-width="1.4"/>
  <text x="136" y="309" font-size="12" fill="#17334F" text-anchor="middle">按应用/软件的</text>
  <text x="136" y="330" font-size="12" fill="#17334F" text-anchor="middle">基础设施指标</text>

  <rect x="244" y="278" width="188" height="80" rx="8" fill="#C9D9E8" stroke="#4E7396" stroke-width="1.4"/>
  <text x="338" y="323" font-size="12" fill="#17334F" text-anchor="middle">使用的应用/软件数量</text>

  <rect x="446" y="278" width="188" height="80" rx="8" fill="#C9D9E8" stroke="#4E7396" stroke-width="1.4"/>
  <text x="540" y="309" font-size="12" fill="#17334F" text-anchor="middle">内部应用使用的</text>
  <text x="540" y="330" font-size="12" fill="#17334F" text-anchor="middle">不同库数量</text>

  <rect x="648" y="278" width="188" height="80" rx="8" fill="#C9D9E8" stroke="#4E7396" stroke-width="1.4"/>
  <text x="742" y="303" font-size="12" fill="#17334F" text-anchor="middle">应用的使用频率/时长，</text>
  <text x="742" y="324" font-size="12" fill="#17334F" text-anchor="middle">或应用功能的</text>
  <text x="742" y="345" font-size="12" fill="#17334F" text-anchor="middle">更多细节</text>

  <!-- 第三层：基础设施与网络 -->
  <rect x="24" y="382" width="830" height="130" rx="12" fill="#F4F6F8" stroke="#DCE3EA"/>
  <text x="439" y="407" font-size="15" font-weight="bold" fill="#33465B" text-anchor="middle">基础设施与网络</text>
  <rect x="42" y="420" width="188" height="80" rx="8" fill="#1F3864" stroke="#1F3864"/>
  <text x="136" y="451" font-size="12" fill="#FFFFFF" text-anchor="middle">与设备制造相关的</text>
  <text x="136" y="472" font-size="12" fill="#FFFFFF" text-anchor="middle">碳排放</text>

  <rect x="244" y="420" width="188" height="80" rx="8" fill="#1F3864" stroke="#1F3864"/>
  <text x="338" y="466" font-size="12" fill="#FFFFFF" text-anchor="middle">能耗</text>

  <rect x="446" y="420" width="188" height="80" rx="8" fill="#1F3864" stroke="#1F3864"/>
  <text x="540" y="466" font-size="12" fill="#FFFFFF" text-anchor="middle">存储数据量</text>

  <rect x="648" y="420" width="188" height="80" rx="8" fill="#1F3864" stroke="#1F3864"/>
  <text x="742" y="466" font-size="12" fill="#FFFFFF" text-anchor="middle">内外部传输的数据量</text>

  <!-- CO2 当量框架 -->
  <rect x="860" y="60" width="136" height="480" rx="8" fill="#F2F5F8" stroke="#C6D0DA"/>
  <text x="928" y="92" font-size="13.5" font-weight="bold" fill="#44546A" text-anchor="middle">CO2 当量</text>
  <text x="928" y="112" font-size="13.5" font-weight="bold" fill="#44546A" text-anchor="middle">框架</text>

  <!-- 碳足迹 -->
  <rect x="1006" y="60" width="170" height="480" rx="8" fill="#7C8894"/>
  <text x="1091" y="88" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">碳足迹</text>

  <path d="M854 163 H1014" stroke="#6E8296" stroke-width="3" marker-end="url(#arr1)"/>
  <path d="M854 305 H1014" stroke="#35608C" stroke-width="3" marker-end="url(#arr2)"/>
  <path d="M854 447 H1014" stroke="#1F3864" stroke-width="3" marker-end="url(#arr3)"/>

  <rect x="1020" y="100" width="142" height="126" rx="8" fill="#E3EAF2" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <text x="1091" y="140" font-size="12" fill="#1F3864" text-anchor="middle">按用途和/或</text>
  <text x="1091" y="162" font-size="12" fill="#1F3864" text-anchor="middle">业务管理的</text>
  <text x="1091" y="184" font-size="12" fill="#1F3864" text-anchor="middle">碳足迹</text>

  <rect x="1020" y="242" width="142" height="124" rx="8" fill="#C9D9E8" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <text x="1091" y="298" font-size="12" fill="#17334F" text-anchor="middle">按应用/软件的</text>
  <text x="1091" y="320" font-size="12" fill="#17334F" text-anchor="middle">碳足迹</text>

  <rect x="1020" y="386" width="142" height="140" rx="8" fill="#1F3864" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <text x="1091" y="436" font-size="12" fill="#FFFFFF" text-anchor="middle">按设备/材料、</text>
  <text x="1091" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">按相关基础设施</text>
  <text x="1091" y="480" font-size="12" fill="#FFFFFF" text-anchor="middle">总体的碳足迹</text>

  <text x="24" y="573" font-size="11.5" fill="#6B7A88">来源：The Shift Project Lean-ICT 工作组。三层指标经同一 CO2 当量框架换算，形成对应层级的碳足迹。</text>
</svg>
