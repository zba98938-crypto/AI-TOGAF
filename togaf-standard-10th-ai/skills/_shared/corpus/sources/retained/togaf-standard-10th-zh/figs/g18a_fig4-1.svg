<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="260" fill="#fff"/>
<defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#345"/></marker></defs>
<g font-size="12" text-anchor="middle">
<rect x="20" y="70" width="180" height="90" rx="8" fill="#e8eef7" stroke="#5b7aa8"/><text x="110" y="100" font-weight="bold">战略</text><text x="110" y="120" font-size="10.5">行业结构、竞争力量</text><text x="110" y="138" font-size="10.5">愿景与目标</text>
<rect x="260" y="70" width="200" height="90" rx="8" fill="#dfe8dc" stroke="#5f8f5f"/><text x="360" y="100" font-weight="bold">业务模型</text><text x="360" y="120" font-size="10.5">价值主张、客户、收入</text><text x="360" y="138" font-size="10.5">成本、资源、伙伴</text>
<rect x="520" y="70" width="220" height="90" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="630" y="100" font-weight="bold">业务架构</text><text x="630" y="120" font-size="10.5">能力、价值流、组织</text><text x="630" y="138" font-size="10.5">信息地图</text>
<rect x="780" y="70" width="100" height="90" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="830" y="108" font-weight="bold">执行</text><text x="830" y="128" font-size="10.5">路线图</text>
</g>
<g stroke="#345" stroke-width="1.4" fill="none" marker-end="url(#x)">
<path d="M200,115 H260"/><path d="M460,115 H520"/><path d="M740,115 H780"/>
</g>
<text x="20" y="210" font-size="11" fill="#666">战略决定业务模型；业务架构把业务模型分解为可执行的视角；架构路线图承接落地。</text>
</svg>
