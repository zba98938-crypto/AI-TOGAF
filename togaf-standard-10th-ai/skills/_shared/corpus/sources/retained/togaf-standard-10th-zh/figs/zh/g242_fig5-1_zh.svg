<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="1340" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1F3864">图 5-1　数字可持续性参考模型（详细版）</text>
  <text x="24" y="58" font-size="12.5" fill="#5A6B7B">“部署可持续信息系统政策”的详细业务功能模型：七个功能组，共三十六项业务功能。</text>

  <!-- 外层 -->
  <rect x="20" y="76" width="1160" height="1212" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
  <text x="36" y="102" font-size="15" font-weight="bold" fill="#1F3864">部署可持续信息系统政策</text>

  <!-- 战略 -->
  <rect x="34" y="112" width="1132" height="126" rx="6" fill="#F1F5F9" stroke="#8FA3B5" stroke-width="1.2"/>
  <text x="600" y="134" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">制定并推展可持续信息系统战略</text>
  <g fill="#FFFFFF" stroke="#B9C7D3">
    <rect x="54" y="144" width="172" height="76" rx="4"/>
    <rect x="238" y="144" width="172" height="76" rx="4"/>
    <rect x="422" y="144" width="172" height="76" rx="4"/>
    <rect x="606" y="144" width="172" height="76" rx="4"/>
    <rect x="790" y="144" width="172" height="76" rx="4"/>
    <rect x="974" y="144" width="172" height="76" rx="4"/>
  </g>
  <g font-size="12" fill="#26313D" text-anchor="middle">
    <text x="140" y="186">将风险正式化</text>
    <text x="324" y="186">从高管层任命发起人</text>
    <text x="508" y="176">对齐 CSR、业务</text>
    <text x="508" y="196">与 ICT 部门</text>
    <text x="692" y="186">设定总体与职能级目标</text>
    <text x="876" y="186">检查业务模式</text>
    <text x="1060" y="186">构建并启动转型计划</text>
  </g>

  <!-- 生态互动 -->
  <rect x="34" y="254" width="300" height="852" rx="6" fill="#F1F5F9" stroke="#8FA3B5" stroke-width="1.2"/>
  <text x="184" y="280" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">与客户、提供方、伙伴及主管部门互动，</text>
  <text x="184" y="300" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">共同实现可持续的解决方案与服务</text>
  <g fill="#FFFFFF" stroke="#B9C7D3">
    <rect x="44" y="322" width="280" height="110" rx="4"/>
    <rect x="44" y="452" width="280" height="110" rx="4"/>
    <rect x="44" y="582" width="280" height="110" rx="4"/>
    <rect x="44" y="712" width="280" height="110" rx="4"/>
    <rect x="44" y="842" width="280" height="110" rx="4"/>
    <rect x="44" y="972" width="280" height="110" rx="4"/>
  </g>
  <g font-size="12.5" fill="#26313D" text-anchor="middle">
    <text x="184" y="370">要求服务提供方提供</text>
    <text x="184" y="392">端到端环境足迹透明度</text>
    <text x="184" y="500">调整招标与合同的</text>
    <text x="184" y="522">选择标准</text>
    <text x="184" y="641">定义采购战略</text>
    <text x="184" y="760">遵守并超越主管部门</text>
    <text x="184" y="782">要求的监管环境报告</text>
    <text x="184" y="890">让客户参与数字</text>
    <text x="184" y="912">可持续目标</text>
    <text x="184" y="1020">影响市场，通过贡献</text>
    <text x="184" y="1042">公开文章积累知识</text>
  </g>

  <!-- 架构并构建 -->
  <rect x="350" y="254" width="584" height="388" rx="6" fill="#F1F5F9" stroke="#8FA3B5" stroke-width="1.2"/>
  <text x="642" y="278" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">架构并构建可持续信息系统</text>
  <rect x="362" y="292" width="560" height="36" rx="4" fill="#2F5597"/>
  <text x="642" y="315" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">陈述可持续信息系统的愿景</text>

  <rect x="362" y="338" width="110" height="268" rx="4" fill="#E4ECF3" stroke="#8FA3B5"/>
  <g font-size="10.5" fill="#26313D" text-anchor="middle">
    <text x="417" y="440">以基于用途与</text>
    <text x="417" y="458">基于基础设施</text>
    <text x="417" y="476">的双重架构</text>
    <text x="417" y="494">方法驱动转型</text>
  </g>

  <g fill="#FFFFFF" stroke="#B9C7D3">
    <rect x="482" y="338" width="286" height="58" rx="4"/>
    <rect x="482" y="406" width="286" height="58" rx="4"/>
    <rect x="482" y="474" width="286" height="58" rx="4"/>
    <rect x="482" y="542" width="286" height="58" rx="4"/>
  </g>
  <g font-size="13" fill="#26313D" text-anchor="middle">
    <text x="625" y="373">重塑业务架构</text>
    <text x="625" y="441">重塑应用架构</text>
    <text x="625" y="509">重塑数据架构以减少数据量</text>
    <text x="625" y="577">重塑技术架构</text>
  </g>

  <rect x="780" y="338" width="142" height="114" rx="4" fill="#FFFFFF" stroke="#B9C7D3"/>
  <text x="851" y="390" font-size="12.5" fill="#26313D" text-anchor="middle">面向可持续性的</text>
  <text x="851" y="410" font-size="12.5" fill="#26313D" text-anchor="middle">敏捷方法</text>
  <rect x="780" y="464" width="142" height="114" rx="4" fill="#FFFFFF" stroke="#B9C7D3"/>
  <text x="851" y="526" font-size="12.5" fill="#26313D" text-anchor="middle">可持续软件开发</text>

  <!-- 运营 -->
  <rect x="350" y="654" width="584" height="188" rx="6" fill="#F1F5F9" stroke="#8FA3B5" stroke-width="1.2"/>
  <text x="642" y="678" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">运营可持续信息系统</text>
  <g fill="#FFFFFF" stroke="#B9C7D3">
    <rect x="362" y="692" width="132" height="122" rx="4"/>
    <rect x="504" y="692" width="132" height="122" rx="4"/>
    <rect x="646" y="692" width="132" height="122" rx="4"/>
    <rect x="788" y="692" width="132" height="122" rx="4"/>
  </g>
  <g font-size="11.5" fill="#26313D" text-anchor="middle">
    <text x="428" y="758">管理数字设备清单</text>
    <text x="570" y="740">支持延长数字设备</text>
    <text x="570" y="758">使用期限</text>
    <text x="712" y="748">监控数字消费</text>
    <text x="854" y="740">应电网运营方要求</text>
    <text x="854" y="758">对数据中心</text>
    <text x="854" y="776">可中断削峰</text>
  </g>

  <!-- 文化 -->
  <rect x="350" y="854" width="584" height="252" rx="6" fill="#F1F5F9" stroke="#8FA3B5" stroke-width="1.2"/>
  <text x="642" y="878" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">发展可持续数字文化</text>
  <g fill="#FFFFFF" stroke="#B9C7D3">
    <rect x="362" y="892" width="274" height="80" rx="4"/>
    <rect x="648" y="892" width="274" height="80" rx="4"/>
    <rect x="362" y="986" width="274" height="80" rx="4"/>
    <rect x="648" y="986" width="274" height="80" rx="4"/>
  </g>
  <g font-size="12.5" fill="#26313D" text-anchor="middle">
    <text x="499" y="938">组织并管理文化转型</text>
    <text x="785" y="938">鼓励节俭与再生式创新</text>
    <text x="499" y="1032">推展沟通计划</text>
    <text x="785" y="1026">培养数字可持续性意识、</text>
    <text x="785" y="1046">管理技能、培训人员</text>
  </g>

  <!-- 度量 -->
  <rect x="950" y="254" width="216" height="852" rx="6" fill="#F1F5F9" stroke="#8FA3B5" stroke-width="1.2"/>
  <text x="1058" y="280" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">从摇篮到坟墓度量</text>
  <text x="1058" y="300" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">信息系统环境影响</text>
  <g fill="#FFFFFF" stroke="#B9C7D3">
    <rect x="960" y="322" width="196" height="240" rx="4"/>
    <rect x="960" y="582" width="196" height="240" rx="4"/>
    <rect x="960" y="842" width="196" height="240" rx="4"/>
  </g>
  <g font-size="12.5" fill="#26313D" text-anchor="middle">
    <text x="1058" y="426">建立并共享从摇篮到</text>
    <text x="1058" y="448">坟墓的信息系统</text>
    <text x="1058" y="470">碳足迹度量</text>
    <text x="1058" y="694">开展度量信息系统</text>
    <text x="1058" y="716">环境影响的活动</text>
    <text x="1058" y="954">向各利益相关者提供</text>
    <text x="1058" y="976">其环境影响的度量</text>
  </g>

  <!-- 治理 -->
  <rect x="34" y="1118" width="1132" height="150" rx="6" fill="#F1F5F9" stroke="#8FA3B5" stroke-width="1.2"/>
  <text x="600" y="1142" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">治理向可持续信息系统转型</text>
  <g fill="#FFFFFF" stroke="#B9C7D3">
    <rect x="54" y="1156" width="208" height="96" rx="4"/>
    <rect x="274" y="1156" width="208" height="96" rx="4"/>
    <rect x="494" y="1156" width="208" height="96" rx="4"/>
    <rect x="714" y="1156" width="208" height="96" rx="4"/>
    <rect x="934" y="1156" width="208" height="96" rx="4"/>
  </g>
  <g font-size="12" fill="#26313D" text-anchor="middle">
    <text x="158" y="1209">定义治理原则与组织</text>
    <text x="378" y="1209">推动治理委员会运作</text>
    <text x="598" y="1199">确保目标达成，</text>
    <text x="598" y="1219">协调举措与决策</text>
    <text x="818" y="1191">评估“提供可持续</text>
    <text x="818" y="1211">信息系统”能力</text>
    <text x="818" y="1231">的成熟度</text>
    <text x="1038" y="1209">评估可持续想法</text>
  </g>

  <text x="24" y="1320" font-size="11.5" fill="#6B7A88">© The Open Group；来源：The Shift Project Lean-ICT 工作组。各业务功能的完整说明见表 5-1。</text>
</svg>
