<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="470" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">业务模型画布（Business Model Canvas）九个构建块</text>
<g stroke="#5b7aa8" stroke-width="1" fill="#fbfcfe">
<rect x="20" y="45" width="150" height="250"/><rect x="170" y="45" width="150" height="120"/><rect x="170" y="165" width="150" height="130"/>
<rect x="320" y="45" width="180" height="250"/><rect x="500" y="45" width="150" height="120"/><rect x="500" y="165" width="150" height="130"/>
<rect x="650" y="45" width="160" height="250"/>
<rect x="20" y="295" width="420" height="100"/><rect x="440" y="295" width="370" height="100"/>
</g>
<g font-size="11.5" fill="#222">
<text x="32" y="68" font-weight="bold">关键合作伙伴</text><text x="32" y="86" font-size="10.5">供应商与伙伴网络</text>
<text x="182" y="68" font-weight="bold">关键活动</text><text x="182" y="86" font-size="10.5">使模型运转的关键事情</text>
<text x="182" y="188" font-weight="bold">关键资源</text><text x="182" y="206" font-size="10.5">所需最重要资产</text>
<text x="332" y="68" font-weight="bold">价值主张</text><text x="332" y="86" font-size="10.5">为客户创造价值的产品与服务</text>
<text x="512" y="68" font-weight="bold">客户关系</text><text x="512" y="86" font-size="10.5">与客户群建立的关系类型</text>
<text x="512" y="188" font-weight="bold">渠道</text><text x="512" y="206" font-size="10.5">沟通与触达客户的途径</text>
<text x="662" y="68" font-weight="bold">客户细分</text><text x="662" y="86" font-size="10.5">企业希望触达和服务的群体</text>
<text x="32" y="318" font-weight="bold">成本结构</text><text x="32" y="338" font-size="10.5">运营业务模型产生的全部成本</text>
<text x="452" y="318" font-weight="bold">收入来源</text><text x="452" y="338" font-size="10.5">从各客户细分获得的收入</text>
</g>
<text x="20" y="440" font-size="10.5" fill="#666">右侧为价值/收入侧，左侧为成本侧；画布强调一页纸、可协作、可迭代。</text>
</svg>
