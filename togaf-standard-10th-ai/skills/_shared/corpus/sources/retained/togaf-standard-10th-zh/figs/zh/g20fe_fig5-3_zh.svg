<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <title>图 5-3　商业模式画布（BMC）模板（中文重绘）</title>

  <text x="40" y="42" font-size="21" font-weight="bold" fill="#1F3864">商业模式画布（BMC）模板</text>
  <text x="40" y="64" font-size="12" fill="#5B6B7E">用九个构建块描述企业的价值创造、交付与获取方式。</text>

  <g stroke="#2F4A5E" stroke-width="1.4" fill="#FCFDFE">
    <!-- 第一列 -->
    <rect x="40" y="88" width="210" height="418"/>
    <!-- 第二列 -->
    <rect x="250" y="88" width="220" height="236"/>
    <rect x="250" y="324" width="220" height="182"/>
    <!-- 第三列 -->
    <rect x="470" y="88" width="290" height="418"/>
    <!-- 第四列 -->
    <rect x="760" y="88" width="200" height="236"/>
    <rect x="760" y="324" width="200" height="182"/>
    <!-- 第五列 -->
    <rect x="960" y="88" width="200" height="418"/>
    <!-- 底行 -->
    <rect x="40" y="506" width="560" height="210"/>
    <rect x="600" y="506" width="560" height="210"/>
  </g>

  <g font-size="15.5" fill="#1F3864" font-weight="bold">
    <text x="58" y="118">关键合作伙伴</text>
    <text x="268" y="118">关键活动</text>
    <text x="268" y="354">关键资源</text>
    <text x="488" y="118">价值主张</text>
    <text x="778" y="118">客户关系</text>
    <text x="778" y="354">渠道</text>
    <text x="978" y="118">客户细分</text>
    <text x="58" y="536">成本结构</text>
    <text x="618" y="536">收入来源</text>
  </g>

  <!-- 底行说明 -->
  <g font-size="11" fill="#8A97A6">
    <text x="58" y="742">结构据英文原图重绘：左列为合作伙伴，中部为活动、资源、价值主张，右列为客户关系、渠道与客户细分，底部为成本与收入。</text>
  </g>
</svg>
