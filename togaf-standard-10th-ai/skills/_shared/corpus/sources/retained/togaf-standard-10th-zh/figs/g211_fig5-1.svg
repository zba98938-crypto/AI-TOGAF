<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="340" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">ABC 公司业务能力成熟度热力图</text>
<g font-size="11" text-anchor="middle">
<rect x="30" y="50" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="120" y="75">业务规划</text>
<rect x="220" y="50" width="180" height="40" fill="#f6c9c0" stroke="#bbb"/><text x="310" y="75">市场规划</text>
<rect x="410" y="50" width="180" height="40" fill="#f6c9c0" stroke="#bbb"/><text x="500" y="75">政府关系管理</text>
<rect x="600" y="50" width="180" height="40" fill="#f6c9c0" stroke="#bbb"/><text x="690" y="75">人力资源管理</text>
<rect x="30" y="100" width="180" height="40" fill="#fbe9b6" stroke="#bbb"/><text x="120" y="125">合作伙伴管理</text>
<rect x="220" y="100" width="180" height="40" fill="#fbe9b6" stroke="#bbb"/><text x="310" y="125">客户管理</text>
<rect x="410" y="100" width="180" height="40" fill="#fbe9b6" stroke="#bbb"/><text x="500" y="125">培训管理</text>
<rect x="600" y="100" width="180" height="40" fill="#c9c2e8" stroke="#bbb"/><text x="690" y="125">代理商管理（新建）</text>
<rect x="30" y="150" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="120" y="175">账户管理</text>
<rect x="220" y="150" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="310" y="175">渠道管理</text>
<rect x="410" y="150" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="500" y="175">财务管理</text>
<rect x="600" y="150" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="690" y="175">信息管理</text>
<rect x="30" y="200" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="120" y="225">资本管理</text>
<rect x="220" y="200" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="310" y="225">政策管理</text>
<rect x="410" y="200" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="500" y="225">产品管理</text>
<rect x="600" y="200" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="690" y="225">合规管理</text>
<rect x="30" y="250" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="120" y="275">资产管理</text>
<rect x="220" y="250" width="180" height="40" fill="#d7e8d3" stroke="#bbb"/><text x="310" y="275">运营管理</text>
</g>
<g font-size="11" fill="#444">
<text x="800" y="60">图例</text>
<rect x="800" y="70" width="60" height="18" fill="#d7e8d3" stroke="#bbb"/><text x="810" y="84">绿色：达标</text>
<rect x="800" y="96" width="60" height="18" fill="#fbe9b6" stroke="#bbb"/><text x="810" y="110">黄色：差一级</text>
<rect x="800" y="122" width="60" height="18" fill="#f6c9c0" stroke="#bbb"/><text x="810" y="136">红色：差≥2级</text>
<rect x="800" y="148" width="60" height="18" fill="#c9c2e8" stroke="#bbb"/><text x="810" y="162">紫色：尚不存在</text>
</g>
<text x="20" y="320" font-size="11" fill="#666">需立即关注：市场规划、政府关系管理、人力资源管理；其次：合作伙伴、客户、培训管理。</text>
</svg>
