<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">业务能力映射到价值流阶段（示意）</text>
<g font-size="10.5" text-anchor="middle">
<rect x="40" y="60" width="140" height="45" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="110" y="88">阶段 1</text>
<rect x="200" y="60" width="140" height="45" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="270" y="88">阶段 2</text>
<rect x="360" y="60" width="140" height="45" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="430" y="88">阶段 3</text>
<rect x="520" y="60" width="140" height="45" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="590" y="88">阶段 4</text>
<rect x="40" y="160" width="140" height="45" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="110" y="188">能力 A</text>
<rect x="200" y="160" width="140" height="45" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="270" y="188">能力 B</text>
<rect x="360" y="160" width="140" height="45" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="430" y="188">能力 C</text>
<rect x="520" y="160" width="140" height="45" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="590" y="188">能力 D</text>
</g>
<g stroke="#888" stroke-width="1" fill="none">
<path d="M110,105 V160"/><path d="M270,105 V160"/><path d="M430,105 V160"/><path d="M590,105 V160"/>
<path d="M270,105 L430,160"/><path d="M430,105 L590,160"/>
</g>
<text x="20" y="250" font-size="10.5" fill="#666">每个阶段可由一项或多项能力使能；交叉映射识别关键能力与差距，驱动能力增量与投资。</text>
</svg>
