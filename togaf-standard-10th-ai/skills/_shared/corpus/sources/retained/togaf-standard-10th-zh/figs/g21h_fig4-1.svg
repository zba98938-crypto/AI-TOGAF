<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="360" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">DBRM 详细视图（要素间关系）</text>
<g font-size="10.5" text-anchor="middle">
<rect x="30" y="60" width="180" height="55" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="120" y="84">客户聚焦</text><text x="120" y="102" font-size="10">客户旅程/体验</text>
<rect x="30" y="130" width="180" height="55" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="120" y="154">数字企业</text><text x="120" y="172" font-size="10">数字产品/渠道</text>
<rect x="240" y="60" width="180" height="55" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="330" y="84">战略语境</text><text x="330" y="102" font-size="10">外部环境/监管</text>
<rect x="240" y="130" width="180" height="55" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="330" y="154">业务动机</text><text x="330" y="172" font-size="10">目标/目的/原则</text>
<rect x="240" y="200" width="180" height="55" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="330" y="224">业务服务与产品</text><text x="330" y="242" font-size="10">价值主张</text>
<rect x="450" y="60" width="190" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="545" y="84">生态与业务模型</text><text x="545" y="102" font-size="10">伙伴/价值交换</text>
<rect x="450" y="130" width="190" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="545" y="154">运营模式</text><text x="545" y="172" font-size="10">组织/治理/资源</text>
<rect x="450" y="200" width="190" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="545" y="224">业务能力模型</text><text x="545" y="242" font-size="10">能力目录/成熟度</text>
<rect x="670" y="60" width="180" height="55" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="760" y="84">业务运营环境</text><text x="760" y="102" font-size="10">流程/系统/资源</text>
<rect x="670" y="130" width="180" height="55" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="760" y="154">数字使能</text><text x="760" y="172" font-size="10">平台/数据/技术</text>
</g>
<g stroke="#888" stroke-width="1" fill="none">
<path d="M210,90 H240"/><path d="M210,155 H240"/><path d="M420,90 H450"/><path d="M420,155 H450"/><path d="M420,225 H450"/>
<path d="M640,90 H670"/><path d="M640,155 H670"/><path d="M640,225 H670"/>
</g>
<text x="20" y="305" font-size="10.5" fill="#666">数字域（由外而内）→ 战略域（为什么）→ 结构域（是什么）→ 运营域（怎么做），逐层传导并反馈。</text>
<text x="20" y="330" font-size="10.5" fill="#666">每个要素内部再细分（如客户旅程、能力层级、平台服务），可按需裁剪。</text>
</svg>
