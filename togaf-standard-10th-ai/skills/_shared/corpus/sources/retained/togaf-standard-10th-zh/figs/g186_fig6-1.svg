<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="340" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">以 ADM 支持四种目的的“走查”重点</text>
<g font-size="10.5" text-anchor="middle">
<rect x="30" y="55" width="190" height="220" rx="8" fill="#fdf3d8" stroke="#b09040"/><text x="125" y="80" font-weight="bold">支持战略</text>
<text x="125" y="105">理解语境</text><text x="125" y="127">评估企业</text><text x="125" y="149">确定目标态方法</text><text x="125" y="171">确认变革属性</text><text x="125" y="193">价值主张</text><text x="125" y="215">识别并排序工作包</text><text x="125" y="237">完成愿景与目标架构</text>
<rect x="235" y="55" width="190" height="220" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="330" y="80" font-weight="bold">支持组合</text>
<text x="330" y="105">按主题分组工作包</text><text x="330" y="127">平衡机会与可行性</text><text x="330" y="149">进入预算</text><text x="330" y="171">内部参与</text><text x="330" y="193">目标是否达成</text><text x="330" y="215">建立交付信心</text><text x="330" y="237">处理“野生”请求</text>
<rect x="440" y="55" width="195" height="220" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="537" y="80" font-weight="bold">支持项目</text>
<text x="537" y="105">确定依赖</text><text x="537" y="127">干系人与关键角色</text><text x="537" y="149">视角与需求</text><text x="537" y="171">与“邻居”沟通</text><text x="537" y="193">交付与验收能力评估</text><text x="537" y="215">平衡选项与供应商</text><text x="537" y="237">确定范围与预算</text>
<rect x="650" y="55" width="200" height="220" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="750" y="80" font-weight="bold">支持解决方案交付</text>
<text x="750" y="105">界定范围</text><text x="750" y="127">功能纯度与创新</text><text x="750" y="149">移交与收尾</text><text x="750" y="171">对齐实施者</text><text x="750" y="193">指导交付</text><text x="750" y="215">实现解决方案</text><text x="750" y="237">治理与合规</text>
</g>
</svg>
