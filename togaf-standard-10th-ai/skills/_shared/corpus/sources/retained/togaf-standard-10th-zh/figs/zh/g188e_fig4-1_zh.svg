<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1470" viewBox="0 0 1200 1470" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5A6A"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#7A8B9B"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E86C1"/>
    </marker>
  </defs>
  <rect width="1200" height="1470" fill="#FFFFFF"/>
  <text x="40" y="32" font-size="19" font-weight="bold" fill="#1F4E79">图 4-1　TOGAF ADM 与 PRINCE2 映射（高层）</text>
  <text x="40" y="54" font-size="12" fill="#5A6B7B">阶段 A 的建立项目与启动、发起流程对应；阶段 B–F 作为工作交付阶段循环管理</text>

  <!-- 左：ADM -->
  <rect x="20" y="62" width="250" height="760" fill="#FAFBFC" stroke="#C3CED8"/>
  <rect x="20" y="62" width="250" height="34" fill="#1F4E79"/>
  <text x="145" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ADM（阶段 A）</text>

  <g font-size="11.5" text-anchor="middle" fill="#1F3448">
    <rect x="40" y="108" width="210" height="44" rx="3" fill="#DCE9F5" stroke="#4A7EA8"/>
    <text x="145" y="135">建立项目</text>

    <rect x="40" y="270" width="210" height="48" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="145" y="290">识别业务目标与</text>
    <text x="145" y="307">业务驱动因素</text>

    <rect x="40" y="338" width="210" height="48" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="145" y="358">评审架构原则</text>
    <text x="145" y="375">（含业务原则）</text>

    <rect x="40" y="406" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="145" y="431">定义范围</text>

    <rect x="40" y="466" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="145" y="491">定义约束</text>

    <rect x="40" y="526" width="210" height="52" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="145" y="544">识别利益相关者、关注点、</text>
    <text x="145" y="562">业务需求与架构愿景</text>

    <rect x="40" y="714" width="210" height="52" rx="3" fill="#DCE9F5" stroke="#4A7EA8"/>
    <text x="145" y="736">编制架构工作说明书</text>
    <text x="145" y="754">并获得批准</text>
  </g>
  <text x="145" y="632" text-anchor="middle" font-size="9.5" fill="#7A8B9B">评估能力、评估转型就绪度</text>
  <text x="145" y="648" text-anchor="middle" font-size="9.5" fill="#7A8B9B">等步骤详见 4.2 详细映射</text>

  <!-- 中上：PRINCE2 项目启动 -->
  <rect x="320" y="62" width="380" height="330" fill="#FAFBFC" stroke="#C3CED8"/>
  <rect x="320" y="62" width="380" height="34" fill="#1F4E79"/>
  <text x="510" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">PRINCE2（项目启动）</text>

  <g font-size="11.5" text-anchor="middle" fill="#1F3448">
    <rect x="340" y="108" width="210" height="46" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="127">任命项目执行发起人</text>
    <text x="445" y="144">与项目经理</text>

    <rect x="340" y="166" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="191">设计项目管理团队</text>

    <rect x="340" y="218" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="243">编制概要商业论证</text>

    <rect x="340" y="270" width="210" height="46" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="289">选择项目方法并</text>
    <text x="445" y="306">汇编项目任务书</text>

    <rect x="340" y="336" width="210" height="40" rx="3" fill="#DCE9F5" stroke="#4A7EA8"/>
    <text x="445" y="361">规划发起阶段</text>
  </g>

  <rect x="730" y="334" width="160" height="48" rx="3" fill="#FFFFFF" stroke="#4A5A6A"/>
  <text x="810" y="354" text-anchor="middle" font-size="11.5" fill="#1F3448">阶段计划</text>
  <text x="810" y="372" text-anchor="middle" font-size="11" fill="#5A6B7B">（发起）</text>

  <!-- 中下：PRINCE2 发起 -->
  <rect x="320" y="412" width="380" height="410" fill="#FAFBFC" stroke="#C3CED8"/>
  <rect x="320" y="412" width="380" height="34" fill="#1F4E79"/>
  <text x="510" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">PRINCE2（发起）</text>

  <g font-size="11.5" text-anchor="middle" fill="#1F3448">
    <rect x="340" y="458" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="483">编制管理策略</text>

    <rect x="340" y="548" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="573">项目控制</text>

    <rect x="340" y="600" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="625">创建项目计划</text>

    <rect x="340" y="652" width="210" height="40" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="445" y="677">细化商业论证</text>

    <rect x="340" y="724" width="210" height="40" rx="3" fill="#DCE9F5" stroke="#4A7EA8"/>
    <text x="445" y="749">汇编项目启动文档</text>
  </g>

  <rect x="730" y="446" width="200" height="72" rx="3" fill="#FFFFFF" stroke="#4A5A6A"/>
  <text x="830" y="466" text-anchor="middle" font-size="10.5" fill="#1F3448">编制：风险管理策略、</text>
  <text x="830" y="484" text-anchor="middle" font-size="10.5" fill="#1F3448">配置管理策略、质量管理策略、</text>
  <text x="830" y="502" text-anchor="middle" font-size="10.5" fill="#1F3448">沟通管理策略</text>

  <rect x="770" y="722" width="120" height="44" rx="3" fill="#FFFFFF" stroke="#4A5A6A"/>
  <text x="830" y="749" text-anchor="middle" font-size="11.5" fill="#1F3448">移交</text>

  <!-- 阶段边界 -->
  <rect x="470" y="880" width="350" height="260" fill="#FAFBFC" stroke="#C3CED8"/>
  <rect x="470" y="880" width="350" height="34" fill="#1F4E79"/>
  <text x="645" y="903" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">PRINCE2（管理阶段边界）</text>

  <g font-size="11.5" text-anchor="middle" fill="#1F3448">
    <rect x="500" y="926" width="290" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="645" y="946">规划下一阶段</text>
    <rect x="500" y="968" width="290" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="645" y="988">更新项目计划</text>
    <rect x="500" y="1010" width="290" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="645" y="1030">更新商业论证</text>
    <rect x="500" y="1064" width="290" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="645" y="1084">报告阶段结束</text>
    <rect x="500" y="1100" width="290" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="645" y="1120">编制例外计划</text>
  </g>

  <!-- 项目收尾 -->
  <rect x="470" y="1190" width="300" height="200" fill="#FAFBFC" stroke="#C3CED8"/>
  <rect x="470" y="1190" width="300" height="34" fill="#1F4E79"/>
  <text x="620" y="1213" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">PRINCE2（项目收尾）</text>

  <g font-size="11.5" text-anchor="middle" fill="#1F3448">
    <rect x="500" y="1236" width="240" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="620" y="1256">准备收尾</text>
    <rect x="500" y="1276" width="240" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="620" y="1296">产品移交</text>
    <rect x="500" y="1316" width="240" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="620" y="1336">评估项目</text>
    <rect x="500" y="1352" width="240" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="620" y="1372">建议收尾</text>
  </g>

  <!-- ADM B-F -->
  <circle cx="140" cy="1010" r="56" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.5"/>
  <text x="140" y="1005" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F3448">ADM 阶段</text>
  <text x="140" y="1025" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F3448">B–F</text>

  <!-- 箭头：主流程 -->
  <g stroke="#4A5A6A" stroke-width="1.7" fill="none">
    <path d="M250,130 H340" marker-end="url(#a1)"/>
    <path d="M445,154 V166" marker-end="url(#a1)"/>
    <path d="M445,206 V218" marker-end="url(#a1)"/>
    <path d="M445,258 V270" marker-end="url(#a1)"/>
    <path d="M445,316 V336" marker-end="url(#a1)"/>
    <path d="M550,356 H730" marker-end="url(#a1)"/>
    <path d="M445,376 V412" marker-end="url(#a1)"/>
    <path d="M340,356 H300 V294 H250" marker-end="url(#a1)"/>
    <path d="M145,318 V338" marker-end="url(#a1)"/>
    <path d="M145,386 V406" marker-end="url(#a1)"/>
    <path d="M145,446 V466" marker-end="url(#a1)"/>
    <path d="M145,506 V526" marker-end="url(#a1)"/>
    <path d="M250,552 H280 V568 H340" marker-end="url(#a1)"/>
    <path d="M250,540 H296 V620 H340" marker-end="url(#a1)"/>
    <path d="M550,478 H730" marker-end="url(#a1)"/>
    <path d="M445,498 V548" marker-end="url(#a1)"/>
    <path d="M445,588 V600" marker-end="url(#a1)"/>
    <path d="M445,640 V652" marker-end="url(#a1)"/>
    <path d="M445,692 V724" marker-end="url(#a1)"/>
    <path d="M250,740 H340" marker-end="url(#a1)"/>
    <path d="M550,744 H770" marker-end="url(#a1)"/>
    <path d="M445,764 V850 H645 V880" marker-end="url(#a1)"/>
    <path d="M645,1140 V1190" marker-end="url(#a1)"/>
  </g>

  <!-- 虚线：输入依赖 -->
  <g stroke="#7A8B9B" stroke-width="1.6" fill="none" stroke-dasharray="4 4">
    <path d="M250,426 H290 V568 H340" marker-end="url(#a2)"/>
  </g>
  <text x="296" y="500" font-size="9.5" fill="#5A6B7B">输入</text>

  <!-- 阶段循环曲线 -->
  <g stroke="#2E86C1" stroke-width="2" fill="none">
    <path d="M194,980 C300,930 360,930 452,944" marker-end="url(#a3)"/>
    <path d="M470,1080 C380,1100 300,1080 196,1040" marker-end="url(#a3)"/>
  </g>
  <text x="330" y="1006" font-size="10.5" fill="#2E86C1" transform="rotate(-90 330 1006)">控制阶段</text>

  <!-- 详细指南 -->
  <rect x="1000" y="62" width="180" height="1330" fill="#FAFBFC" stroke="#C3CED8"/>
  <rect x="1000" y="62" width="180" height="34" fill="#5A6B7B"/>
  <text x="1090" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">详细指南</text>

  <g font-size="12" text-anchor="middle" fill="#FFFFFF">
    <rect x="1016" y="106" width="148" height="276" fill="#1B1F24"/>
    <text x="1090" y="230" font-size="15" font-weight="bold">3.1</text>
    <text x="1090" y="252">启动架构项目</text>

    <rect x="1016" y="404" width="148" height="296" fill="#1B1F24"/>
    <text x="1090" y="536" font-size="15" font-weight="bold">3.2</text>
    <text x="1090" y="558">架构项目规划</text>

    <rect x="1016" y="848" width="148" height="64" fill="#1B1F24"/>
    <text x="1090" y="874" font-size="14" font-weight="bold">3.3</text>
    <text x="1090" y="894">阶段规划</text>

    <rect x="1016" y="928" width="148" height="96" fill="#1B1F24"/>
    <text x="1090" y="962" font-size="14" font-weight="bold">3.4</text>
    <text x="1090" y="982">执行、监控与</text>
    <text x="1090" y="1002">控制阶段</text>

    <rect x="1016" y="1040" width="148" height="64" fill="#1B1F24"/>
    <text x="1090" y="1066" font-size="14" font-weight="bold">3.5</text>
    <text x="1090" y="1086">阶段收尾</text>

    <rect x="1016" y="1210" width="148" height="150" fill="#1B1F24"/>
    <text x="1090" y="1278" font-size="14" font-weight="bold">3.6</text>
    <text x="1090" y="1298">架构项目收尾</text>
  </g>

  <!-- 指导项目 / 控制阶段箭头 -->
  <path d="M974,96 V1380" stroke="#2E86C1" stroke-width="4" fill="none" marker-end="url(#a3)"/>
  <text x="960" y="690" font-size="11" fill="#2E86C1" transform="rotate(-90 960 690)">指导项目</text>
  <path d="M958,1082 V1140" stroke="#2E86C1" stroke-width="3" fill="none" marker-end="url(#a3)"/>
  <text x="946" y="1120" font-size="9.5" fill="#2E86C1" transform="rotate(-90 946 1120)">控制阶段</text>

  <!-- 图例 -->
  <rect x="20" y="1190" width="420" height="220" rx="4" fill="#FBFCFD" stroke="#C3CED8"/>
  <text x="40" y="1216" font-size="13" font-weight="bold" fill="#1F4E79">图例</text>
  <g font-size="11" fill="#33475B">
    <path d="M40,1240 H90" stroke="#4A5A6A" stroke-width="1.7" marker-end="url(#a1)"/>
    <text x="102" y="1244">流程 / 产品交付</text>
    <path d="M40,1274 H90" stroke="#7A8B9B" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a2)"/>
    <text x="102" y="1278">输入依赖</text>
    <rect x="40" y="1296" width="50" height="22" fill="none" stroke="#C3CED8"/>
    <text x="102" y="1312">过程分组（PRINCE2 阶段 / ADM 阶段）</text>
    <path d="M40,1344 H90" stroke="#2E86C1" stroke-width="4" marker-end="url(#a3)"/>
    <text x="102" y="1348">简化流程组：指导项目 / 控制阶段</text>
    <text x="40" y="1382" font-size="10" fill="#5A6B7B">本图为高层映射，部分任务与流程作了归并；仅示主要交付物。</text>
    <text x="40" y="1400" font-size="10" fill="#5A6B7B">阶段 B–F 作为工作交付阶段，在“管理阶段边界”下循环。</text>
  </g>

  <text x="470" y="1440" font-size="10" fill="#7A8B9B">注：PRINCE2 的“管理产品交付”流程在图外，由阶段 B–F 的执行活动承担。</text>
</svg>
