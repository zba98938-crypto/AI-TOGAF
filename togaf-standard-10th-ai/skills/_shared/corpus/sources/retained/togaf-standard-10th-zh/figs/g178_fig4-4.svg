<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">招聘员工价值流热力图（更新后）</text>
<g font-size="11">
<text x="20" y="80">定义岗位</text><text x="20" y="140">发布职位</text><text x="20" y="200">评估应聘</text><text x="20" y="260">面试候选人</text>
</g>
<g stroke="#bbb" stroke-width="0.8">
<rect x="150" y="60" width="150" height="40" fill="#f6c9c0"/><rect x="300" y="60" width="150" height="40" fill="#fbe9b6"/><rect x="450" y="60" width="150" height="40" fill="#d7e8d3"/><rect x="600" y="60" width="150" height="40" fill="#f7f7f7"/>
<rect x="150" y="120" width="150" height="40" fill="#d7e8d3"/><rect x="300" y="120" width="150" height="40" fill="#fbe9b6"/><rect x="450" y="120" width="150" height="40" fill="#d7e8d3"/><rect x="600" y="120" width="150" height="40" fill="#f7f7f7"/>
<rect x="150" y="180" width="150" height="40" fill="#f6c9c0"/><rect x="300" y="180" width="150" height="40" fill="#d7e8d3"/><rect x="450" y="180" width="150" height="40" fill="#f7f7f7"/><rect x="600" y="180" width="150" height="40" fill="#fbe9b6"/>
<rect x="150" y="240" width="150" height="40" fill="#fbe9b6"/><rect x="300" y="240" width="150" height="40" fill="#d7e8d3"/><rect x="450" y="240" width="150" height="40" fill="#f6c9c0"/><rect x="600" y="240" width="150" height="40" fill="#d7e8d3"/>
</g>
<g font-size="10.5" fill="#333" text-anchor="middle">
<text x="225" y="84">政策发布能力缺失</text><text x="375" y="84">流程不清</text><text x="525" y="84">良好</text>
<text x="675" y="84">—</text>
<text x="225" y="144">良好</text><text x="375" y="144">渠道不足</text><text x="525" y="144">良好</text>
<text x="675" y="144">—</text>
<text x="225" y="204">筛选标准缺失</text><text x="375" y="204">良好</text><text x="675" y="204">协调不足</text>
<text x="225" y="264">面试排期</text><text x="375" y="264">良好</text><text x="525" y="264">入职交接断点</text><text x="675" y="264">良好</text>
</g>
<g font-size="10.5" fill="#555"><text x="20" y="292">红色 = 重大差距；黄色 = 需要调整；绿色 = 运行良好。政策发布被补充为第一个阶段的关键能力。</text></g>
</svg>
