<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="780" height="300" fill="#fff"/>
<text x="20" y="28" font-size="14" font-weight="bold">技能侧重对比（企业架构师 / 分段架构师 / 解决方案架构师）</text>
<g font-size="11">
<text x="20" y="70">业务建模</text><text x="20" y="100">业务流程</text><text x="20" y="130">架构原则与视图</text>
<text x="20" y="160">数据/应用设计</text><text x="20" y="190">技术深度</text><text x="20" y="220">实施与集成</text>
</g>
<g>
<text x="200" y="52" font-size="11" fill="#2e4a7a">企业架构师</text><text x="420" y="52" font-size="11" fill="#3f7a4f">分段架构师</text><text x="620" y="52" font-size="11" fill="#a05a2c">解决方案架构师</text>
<rect x="200" y="60" width="120" height="14" fill="#2e4a7a"/><rect x="420" y="60" width="90" height="14" fill="#3f7a4f"/><rect x="620" y="60" width="40" height="14" fill="#a05a2c"/>
<rect x="200" y="90" width="110" height="14" fill="#2e4a7a"/><rect x="420" y="90" width="100" height="14" fill="#3f7a4f"/><rect x="620" y="90" width="50" height="14" fill="#a05a2c"/>
<rect x="200" y="120" width="130" height="14" fill="#2e4a7a"/><rect x="420" y="120" width="110" height="14" fill="#3f7a4f"/><rect x="620" y="120" width="60" height="14" fill="#a05a2c"/>
<rect x="200" y="150" width="80" height="14" fill="#2e4a7a"/><rect x="420" y="150" width="100" height="14" fill="#3f7a4f"/><rect x="620" y="150" width="110" height="14" fill="#a05a2c"/>
<rect x="200" y="180" width="60" height="14" fill="#2e4a7a"/><rect x="420" y="180" width="80" height="14" fill="#3f7a4f"/><rect x="620" y="180" width="130" height="14" fill="#a05a2c"/>
<rect x="200" y="210" width="70" height="14" fill="#2e4a7a"/><rect x="420" y="210" width="90" height="14" fill="#3f7a4f"/><rect x="620" y="210" width="120" height="14" fill="#a05a2c"/>
</g>
<text x="20" y="270" font-size="10" fill="#777">条形长度示意各角色在相应技能上的典型要求强度；解决方案架构师更偏技术域深度。</text>
</svg>
