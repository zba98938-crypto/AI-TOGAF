<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="330" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">企业变革的三类画像（Change Profiles）</text>
<g font-size="12">
<rect x="30" y="50" width="260" height="220" rx="10" fill="#fdf3d8" stroke="#b09040"/>
<text x="50" y="80" font-weight="bold">快速（Rapid）</text><text x="50" y="102" font-size="10.5">时间驱动 / 短交付</text>
<text x="50" y="132" font-size="10.5">• 简单组件近乎即时实现</text><text x="50" y="152" font-size="10.5">• 扩展原型、RAD</text>
<text x="50" y="172" font-size="10.5">• SBB 先行，ABB 从简</text><text x="50" y="192" font-size="10.5">• 允许失败、快速调整</text>
<text x="50" y="212" font-size="10.5">• 技术/组织债务需可控</text>
<rect x="310" y="50" width="260" height="220" rx="10" fill="#e9f2e9" stroke="#5f8f5f"/>
<text x="330" y="80" font-weight="bold">功能（Functional）</text><text x="330" y="102" font-size="10.5">可实现能力驱动 / 迭代</text>
<text x="330" y="132" font-size="10.5">• 针对有界功能快速迭代</text><text x="330" y="152" font-size="10.5">• JAD、DSDM、敏捷</text>
<text x="330" y="172" font-size="10.5">• 先行为后技术细节</text><text x="330" y="192" font-size="10.5">• MVP→MMP 演进</text>
<text x="330" y="212" font-size="10.5">• 平衡失败快与一次做对</text>
<rect x="590" y="50" width="260" height="220" rx="10" fill="#eef3f8" stroke="#5b7aa8"/>
<text x="610" y="80" font-weight="bold">稳健（Robust）</text><text x="610" y="102" font-size="10.5">风险与架构驱动 / 长周期</text>
<text x="610" y="132" font-size="10.5">• 复杂、高风险、大规模</text><text x="610" y="152" font-size="10.5">• COBIT、SABSA、Prince2、MSP</text>
<text x="610" y="172" font-size="10.5">• ABB 先行，充分论证</text><text x="610" y="192" font-size="10.5">• 严格合规与互操作</text>
<text x="610" y="212" font-size="10.5">• 全面保证活动与“一次做对”</text>
</g>
<text x="20" y="305" font-size="10.5" fill="#666">同一企业、同一变革中往往三种画像并存；架构师应与产品/项目/变革负责人协同动态选择。</text>
</svg>
