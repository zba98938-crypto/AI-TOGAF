<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">开发业务场景的阶段与步骤</text>
<g font-size="11.5" text-anchor="middle">
<rect x="30" y="55" width="240" height="60" rx="8" fill="#fdf3d8" stroke="#b09040"/><text x="150" y="80" font-weight="bold">阶段 1：前提形成</text><text x="150" y="100" font-size="10">命题、隐含问题、目标利益相关者</text>
<rect x="320" y="55" width="240" height="60" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="440" y="80" font-weight="bold">阶段 2：初步验证</text><text x="440" y="100" font-size="10">面谈利益相关者，形成草稿</text>
<rect x="610" y="55" width="240" height="60" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="730" y="80" font-weight="bold">阶段 3：细化</text><text x="730" y="100" font-size="10">达成业务需求与前进路径共识</text>
</g>
<g stroke="#555" stroke-width="1.2" fill="none"><path d="M270,85 H320"/><path d="M560,85 H610"/></g>
<g font-size="10.5" fill="#333">
<text x="30" y="160" font-weight="bold">每个阶段重复五个步骤：</text>
<text x="30" y="185">1. 规划（Planning）：确定人员、资源、约束与时间表</text>
<text x="30" y="208">2. 收集（Gathering）：调研、问卷、工作坊，获取一手信息</text>
<text x="30" y="231">3. 分析（Analyzing）：归一化、建模、矩阵关联关键要素，导出需求</text>
<text x="30" y="254">4. 文档化（Documenting）：形成可读文档与模型</text>
<text x="30" y="277">5. 评审（Reviewing）：向发起人反馈，取得认同或停止</text>
</g>
</svg>
