<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">架构层级、角色与域的关系</text>
<g font-size="11.5" text-anchor="middle">
<rect x="30" y="55" width="180" height="60" rx="8" fill="#e8eef7" stroke="#5b7aa8"/><text x="120" y="80">战略架构</text><text x="120" y="99" font-size="10">企业架构师</text>
<rect x="250" y="55" width="180" height="60" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="340" y="80">分段架构</text><text x="340" y="99" font-size="10">分段架构师</text>
<rect x="470" y="55" width="180" height="60" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="560" y="80">能力架构</text><text x="560" y="99" font-size="10">解决方案架构师</text>
<rect x="690" y="55" width="150" height="60" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="765" y="80">实现</text><text x="765" y="99" font-size="10">专家/实施团队</text>
<rect x="30" y="170" width="180" height="50" rx="8" fill="#fff" stroke="#5b7aa8"/><text x="120" y="200">企业范围路线图</text>
<rect x="250" y="170" width="180" height="50" rx="8" fill="#fff" stroke="#5f8f5f"/><text x="340" y="200">组合/项目群路线图</text>
<rect x="470" y="170" width="180" height="50" rx="8" fill="#fff" stroke="#b07a55"/><text x="560" y="200">组件/解决方案规格</text>
<rect x="690" y="170" width="150" height="50" rx="8" fill="#fff" stroke="#806a9e"/><text x="765" y="200">构建/部署/运营</text>
</g>
<g stroke="#888" stroke-width="1.1" fill="none"><path d="M120,115 V170"/><path d="M340,115 V170"/><path d="M560,115 V170"/><path d="M765,115 V170"/></g>
<text x="20" y="270" font-size="10.5" fill="#666">架构角色在更高层架构约束下整合专家活动，使最终解决方案与服务满足语境与概念。</text>
</svg>
