<rect x="330" y="260" width="220" height="50" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="440" y="282" font-weight="bold">解决方案架构师</text><text x="440" y="300" font-size="10.5">Solution Architect</text>
