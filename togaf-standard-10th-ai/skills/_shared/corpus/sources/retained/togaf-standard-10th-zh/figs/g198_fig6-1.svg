<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Hiragino Sans GB, sans-serif">
<rect width="780" height="360" fill="#fff"/>
<g font-size="13">
<rect x="20" y="20" width="740" height="60" rx="6" fill="#e8eef7" stroke="#5b7aa8"/>
<text x="40" y="46" font-weight="bold">企业级架构（Enterprise Architecture）</text>
<text x="40" y="66" font-size="11">跨越整个企业的架构全景与技术参考模型</text>
</g>
<g font-size="12">
<rect x="20" y="100" width="230" height="90" rx="6" fill="#e6f2e6" stroke="#5f8f5f"/>
<text x="36" y="124" font-weight="bold">分段架构：财务</text>
<text x="36" y="146" font-size="11">面向特定业务问题的</text><text x="36" y="164" font-size="11">企业级业务解决方案</text>
<rect x="270" y="100" width="230" height="90" rx="6" fill="#e6f2e6" stroke="#5f8f5f"/>
<text x="286" y="124" font-weight="bold">分段架构：人力资源</text>
<text x="286" y="146" font-size="11">复用其他架构师产出，</text><text x="286" y="164" font-size="11">接入整体架构全景</text>
<rect x="520" y="100" width="240" height="90" rx="6" fill="#e6f2e6" stroke="#5f8f5f"/>
<text x="536" y="124" font-weight="bold">分段架构：销售</text>
<text x="536" y="146" font-size="11">领域内企业级</text><text x="536" y="164" font-size="11">业务解决方案</text>
</g>
<g font-size="12">
<rect x="20" y="220" width="180" height="110" rx="6" fill="#f7ece4" stroke="#b07a55"/>
<text x="36" y="244" font-weight="bold">解决方案架构 A</text>
<text x="36" y="266" font-size="11">系统/子系统层面</text><text x="36" y="284" font-size="11">如：企业数据仓库</text><text x="36" y="302" font-size="11">安全、集成等组件</text>
<rect x="220" y="220" width="180" height="110" rx="6" fill="#f7ece4" stroke="#b07a55"/>
<text x="236" y="244" font-weight="bold">解决方案架构 B</text>
<text x="236" y="266" font-size="11">应用与数据域为主</text><text x="236" y="284" font-size="11">技术选型与配置</text>
<text x="236" y="302" font-size="11">交付可实施组件</text>
<rect x="420" y="220" width="180" height="110" rx="6" fill="#f7ece4" stroke="#b07a55"/>
<text x="436" y="244" font-weight="bold">解决方案架构 C</text>
<text x="436" y="266" font-size="11">支撑业务能力</text><text x="436" y="284" font-size="11">满足业务环境约束</text>
</g>
<g stroke="#8a97a8" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
<path d="M135,80 V100"/><path d="M385,80 V100"/><path d="M640,80 V100"/>
<path d="M135,190 V220"/><path d="M385,190 V220"/><path d="M640,190 V220"/>
</g>
<text x="620" y="350" font-size="10" fill="#777">虚线：架构决策的逐层传导</text>
</svg>
