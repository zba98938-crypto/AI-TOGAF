<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <pattern id="backlogHatch" width="9" height="7" patternUnits="userSpaceOnUse">
      <rect width="9" height="7" fill="#ffffff"/>
      <line x1="0" y1="6" x2="9" y2="6" stroke="#31506A" stroke-width="1.4"/>
    </pattern>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9AD4"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <title>图 4-5　架构层级与迭代节奏（中文重绘）</title>

  <text x="40" y="38" font-size="21" font-weight="bold" fill="#1F3A4D">架构层级与迭代节奏</text>
  <text x="40" y="60" font-size="12" fill="#5B6B7E">越靠下层越敏捷、越细化；越靠上层，迭代与发布周期越长。</text>

  <!-- 青色背景：迭代与交付区 -->
  <rect x="380" y="90" width="740" height="530" fill="#0D9AD4"/>

  <!-- 金字塔 -->
  <polygon points="380,110 452,285 308,285" fill="#E8A33D"/>
  <polygon points="308,285 452,285 532,455 228,455" fill="#8FA6B8"/>
  <polygon points="228,455 532,455 600,620 160,620" fill="#C9C9C9"/>

  <g text-anchor="middle" font-weight="bold">
    <text x="380" y="200" font-size="17" fill="#2B1C07">企业层</text>
    <text x="380" y="375" font-size="17" fill="#ffffff">分段层</text>
    <text x="380" y="545" font-size="17" fill="#22303A">能力/产品层</text>
  </g>

  <!-- 左侧：更敏捷、更细化 -->
  <line x1="42" y1="128" x2="42" y2="612" stroke="#0D9AD4" stroke-width="12" stroke-linecap="round"/>
  <polygon points="27,606 57,606 42,636" fill="#0D9AD4"/>
  <text x="22" y="372" transform="rotate(-90 22 372)" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A4D">更敏捷、更细化</text>

  <!-- 右侧：更长的迭代与发布周期 -->
  <line x1="1158" y1="612" x2="1158" y2="128" stroke="#0D9AD4" stroke-width="12" stroke-linecap="round"/>
  <polygon points="1143,134 1173,134 1158,104" fill="#0D9AD4"/>
  <text x="1182" y="372" transform="rotate(-90 1182 372)" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A4D">迭代与发布周期更长</text>

  <!-- 企业层 -->
  <g>
    <text x="583" y="152" text-anchor="middle" font-size="13" fill="#ffffff">待办列表</text>
    <rect x="560" y="165" width="46" height="92" fill="url(#backlogHatch)" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M610 190 C632 194 646 200 660 210" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <path d="M678 202 A30,30 0 0 1 734,202" fill="none" stroke="#ffffff" stroke-width="2.6" marker-end="url(#arrowWhite)"/>
    <path d="M734 226 A30,30 0 0 1 678,226" fill="none" stroke="#ffffff" stroke-width="2.6" marker-end="url(#arrowWhite)"/>
    <text x="706" y="220" text-anchor="middle" font-size="15" fill="#ffffff">迭代</text>
    <path d="M758 214 H796" fill="none" stroke="#ffffff" stroke-width="2.2" marker-end="url(#arrowWhite)"/>
    <rect x="806" y="176" width="150" height="62" rx="4" fill="#2F9E58"/>
    <text x="881" y="214" text-anchor="middle" font-size="15" fill="#ffffff">交付物</text>
    <path d="M850 238 C790 278 700 300 646 318" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <text x="758" y="276" text-anchor="middle" font-size="12" fill="#ffffff">指导</text>
  </g>

  <!-- 分段层 -->
  <g>
    <text x="583" y="332" text-anchor="middle" font-size="13" fill="#ffffff">待办列表</text>
    <rect x="560" y="345" width="46" height="92" fill="url(#backlogHatch)" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M610 370 C632 374 646 380 660 390" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <path d="M678 382 A30,30 0 0 1 734,382" fill="none" stroke="#ffffff" stroke-width="2.6" marker-end="url(#arrowWhite)"/>
    <path d="M734 406 A30,30 0 0 1 678,406" fill="none" stroke="#ffffff" stroke-width="2.6" marker-end="url(#arrowWhite)"/>
    <text x="706" y="400" text-anchor="middle" font-size="15" fill="#ffffff">迭代</text>
    <path d="M758 394 H796" fill="none" stroke="#ffffff" stroke-width="2.2" marker-end="url(#arrowWhite)"/>
    <rect x="806" y="356" width="150" height="62" rx="4" fill="#2F9E58"/>
    <text x="881" y="394" text-anchor="middle" font-size="15" fill="#ffffff">交付物</text>
    <path d="M850 418 C790 458 700 480 646 498" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <text x="758" y="456" text-anchor="middle" font-size="12" fill="#ffffff">指导</text>
  </g>

  <!-- 能力/产品层 -->
  <g>
    <text x="623" y="502" text-anchor="middle" font-size="13" fill="#ffffff">待办列表</text>
    <rect x="600" y="515" width="46" height="92" fill="url(#backlogHatch)" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M650 540 C672 544 686 550 700 560" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <path d="M718 552 A30,30 0 0 1 774,552" fill="none" stroke="#ffffff" stroke-width="2.6" marker-end="url(#arrowWhite)"/>
    <path d="M774 576 A30,30 0 0 1 718,576" fill="none" stroke="#ffffff" stroke-width="2.6" marker-end="url(#arrowWhite)"/>
    <text x="746" y="570" text-anchor="middle" font-size="15" fill="#ffffff">迭代</text>
    <path d="M798 564 H836" fill="none" stroke="#ffffff" stroke-width="2.2" marker-end="url(#arrowWhite)"/>
    <rect x="846" y="526" width="150" height="62" rx="4" fill="#2F9E58"/>
    <text x="921" y="564" text-anchor="middle" font-size="15" fill="#ffffff">交付物</text>
    <path d="M921 588 V666" fill="none" stroke="#ffffff" stroke-width="2.4" marker-end="url(#arrowWhite)"/>
  </g>

  <!-- 产品开发/工程线 -->
  <rect x="830" y="676" width="300" height="66" rx="3" fill="#0D9AD4" opacity="0.45"/>
  <rect x="818" y="670" width="300" height="66" rx="3" fill="#0D9AD4" stroke="#ffffff" stroke-width="1"/>
  <text x="968" y="709" text-anchor="middle" font-size="15" fill="#ffffff">产品开发/工程线</text>

  <text x="40" y="748" font-size="10.5" fill="#8A8A8A">© The Open Group</text>
</svg>
