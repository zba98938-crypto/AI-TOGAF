<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">ADM 层级与敏捷交付概念的映射</text>
<g font-size="10.5">
<rect x="30" y="55" width="250" height="90" rx="8" fill="#fdf3d8" stroke="#b09040"/><text x="155" y="80" text-anchor="middle" font-weight="bold">战略层</text><text x="45" y="103">重点：预备（能力）与 A/B</text><text x="45" y="123">敏捷对应：战略主题、产品组合待办顶层</text>
<rect x="300" y="55" width="260" height="90" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="430" y="80" text-anchor="middle" font-weight="bold">分段层</text><text x="315" y="103">重点：按组织单元划分行动方案</text><text x="315" y="123">敏捷对应：Epic、特性、跨团队依赖</text>
<rect x="580" y="55" width="270" height="90" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="715" y="80" text-anchor="middle" font-weight="bold">能力层</text><text x="595" y="103">重点：C/D 细化与 E/F 交付</text><text x="595" y="123">敏捷对应：用户故事、冲刺、CI/CD</text>
</g>
<text x="30" y="190" font-size="10.5" fill="#333">每个层级都可循环经历 A–G，但重点不同；层与层之间通过待办列表与反馈环衔接。</text>
<text x="30" y="220" font-size="10.5" fill="#333">团队可跨层集成（业务、技术、解决方案、构建、交付），在连贯冲刺或分层冲刺中推进。</text>
<text x="30" y="255" font-size="10.5" fill="#666">映射随企业复杂度与敏捷实施方式调整，不存在唯一正确编排。</text>
</svg>
