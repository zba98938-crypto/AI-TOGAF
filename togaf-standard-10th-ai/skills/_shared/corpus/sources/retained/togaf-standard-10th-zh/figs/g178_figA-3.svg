<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="260" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">精益价值流（示意）</text>
<g font-size="11" text-anchor="middle">
<rect x="30" y="70" width="120" height="50" fill="#fff" stroke="#333"/><text x="90" y="92">工序 1</text><text x="90" y="108">加工时间 2′</text>
<rect x="190" y="70" width="120" height="50" fill="#fff" stroke="#333"/><text x="250" y="92">工序 2</text><text x="250" y="108">加工时间 5′</text>
<rect x="350" y="70" width="120" height="50" fill="#fff" stroke="#333"/><text x="410" y="92">工序 3</text><text x="410" y="108">加工时间 3′</text>
<rect x="510" y="70" width="120" height="50" fill="#fff" stroke="#333"/><text x="570" y="92">工序 4</text><text x="570" y="108">加工时间 4′</text>
<rect x="670" y="70" width="140" height="50" fill="#e8edf5" stroke="#333"/><text x="740" y="92">交付客户</text><text x="740" y="108">总周期 20′</text>
</g>
<g stroke="#333" stroke-width="1.2" fill="none">
<path d="M150,95 H190"/><path d="M310,95 H350"/><path d="M470,95 H510"/><path d="M630,95 H670"/>
</g>
<g font-size="10.5" fill="#333" text-anchor="middle">
<text x="170" y="60">等待 1′</text><text x="330" y="60">等待 2′</text><text x="490" y="60">等待 1′</text><text x="650" y="60">等待 2′</text>
</g>
<text x="20" y="180" font-size="11" fill="#666">指标：加工时间、响应时间、一次合格率；目的是识别并消除浪费。</text>
<text x="20" y="210" font-size="11" fill="#666">适用于流程优化，而非端到端价值创造与能力映射。</text>
</svg>
