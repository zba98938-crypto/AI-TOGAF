<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5A6A"/>
    </marker>
    <marker id="d2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#7A8B9B"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <text x="40" y="30" font-size="19" font-weight="bold" fill="#1F4E79">图 3-3　阶段 F 交付物及其流向</text>
  <text x="40" y="51" font-size="12" fill="#5A6B7B">架构项目收尾：最终交付物、实施移交与后续周期触发</text>

  <!-- 阶段 F -->
  <circle cx="72" cy="118" r="32" fill="#DCE9F5" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="72" y="126" text-anchor="middle" font-size="20" font-weight="bold" fill="#12395C">F</text>
  <text x="72" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">阶段 F</text>

  <!-- 分组框 -->
  <rect x="182" y="62" width="344" height="472" fill="none" stroke="#7A8B9B" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="354" y="80" text-anchor="middle" font-size="11.5" fill="#4A5A6A">TOGAF ADM 阶段 B–F</text>

  <!-- 主干与分支 -->
  <g stroke="#4A5A6A" stroke-width="1.6" fill="none">
    <path d="M104,118 H160"/>
    <path d="M160,118 V656"/>
    <path d="M160,111 H196" marker-end="url(#d1)"/>
    <path d="M160,187 H196" marker-end="url(#d1)"/>
    <path d="M160,263 H196" marker-end="url(#d1)"/>
    <path d="M160,339 H196" marker-end="url(#d1)"/>
    <path d="M160,415 H196" marker-end="url(#d1)"/>
    <path d="M160,491 H196" marker-end="url(#d1)"/>
    <path d="M160,581 H196" marker-end="url(#d1)"/>
    <path d="M160,657 H196" marker-end="url(#d1)"/>
  </g>

  <!-- 交付物 -->
  <g font-size="13" text-anchor="middle" fill="#1F3448">
    <rect x="196" y="84" width="300" height="56" rx="4" fill="#E8F1F8" stroke="#4A7EA8" stroke-width="1.4"/>
    <text x="346" y="117">最终架构定义文档</text>

    <rect x="196" y="160" width="300" height="56" rx="4" fill="#E8F1F8" stroke="#4A7EA8" stroke-width="1.4"/>
    <text x="346" y="193">最终架构路线图</text>

    <rect x="196" y="236" width="300" height="56" rx="4" fill="#E8F1F8" stroke="#4A7EA8" stroke-width="1.4"/>
    <text x="346" y="269">实施治理模型</text>

    <rect x="196" y="312" width="300" height="56" rx="4" fill="#DCE9F5" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="346" y="345">实施与迁移计划（详细）</text>

    <rect x="196" y="388" width="300" height="56" rx="4" fill="#E8F1F8" stroke="#4A7EA8" stroke-width="1.4"/>
    <text x="346" y="421">最终架构需求规格说明书</text>

    <rect x="196" y="464" width="300" height="56" rx="4" fill="#E8F1F8" stroke="#4A7EA8" stroke-width="1.4"/>
    <text x="346" y="497">可复用架构构建块</text>

    <rect x="196" y="552" width="300" height="56" rx="4" fill="#F4F7FA" stroke="#8A9BB0" stroke-width="1.4"/>
    <text x="346" y="576">新一轮 ADM 周期的</text>
    <text x="346" y="594">架构工作请求（如有）</text>

    <rect x="196" y="628" width="300" height="56" rx="4" fill="#F4F7FA" stroke="#8A9BB0" stroke-width="1.4"/>
    <text x="346" y="652">由经验教训产生的</text>
    <text x="346" y="670">架构能力变更请求</text>
  </g>

  <!-- 最终过渡架构（聚合） -->
  <g stroke="#4A5A6A" stroke-width="1.6" fill="none">
    <path d="M496,112 H570" marker-end="url(#d1)"/>
  </g>
  <path d="M540,102 L550,112 L540,122 L530,112 Z" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.4"/>
  <rect x="570" y="84" width="230" height="56" rx="4" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.4"/>
  <text x="685" y="117" text-anchor="middle" font-size="13" fill="#1F3448">最终过渡架构</text>

  <!-- 实施与迁移计划组成 -->
  <g stroke="#4A5A6A" stroke-width="1.6" fill="none">
    <path d="M496,340 H530"/>
    <path d="M550,340 H558"/>
    <path d="M558,318 V478"/>
    <path d="M558,318 H570" marker-end="url(#d1)"/>
    <path d="M558,398 H570" marker-end="url(#d1)"/>
    <path d="M558,478 H570" marker-end="url(#d1)"/>
  </g>
  <path d="M540,330 L550,340 L540,350 L530,340 Z" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.4"/>
  <g font-size="12.5" text-anchor="middle" fill="#1F3448">
    <rect x="570" y="292" width="230" height="52" rx="4" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.4"/>
    <text x="685" y="323">实施与迁移战略</text>

    <rect x="570" y="372" width="230" height="52" rx="4" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.4"/>
    <text x="685" y="403">实施的项目与组合分解</text>

    <rect x="570" y="452" width="230" height="52" rx="4" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.4"/>
    <text x="685" y="483">项目章程（可选）</text>
  </g>

  <!-- 实施 -->
  <rect x="940" y="438" width="190" height="78" rx="4" fill="#2E6B96" stroke="#1B4B6B" stroke-width="1.5"/>
  <text x="1035" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">实施</text>
  <text x="1035" y="494" text-anchor="middle" font-size="10.5" fill="#D6E4F0">由实施组织接手</text>
  <path d="M800,478 H940" stroke="#7A8B9B" stroke-width="1.6" fill="none" stroke-dasharray="8 5" marker-end="url(#d2)"/>
  <text x="868" y="468" text-anchor="middle" font-size="10" fill="#4A5A6A">产品交付</text>

  <!-- 后续周期 -->
  <g stroke="#7A8B9B" stroke-width="1.6" fill="none" stroke-dasharray="3 4">
    <path d="M496,580 L566,575" marker-end="url(#d2)"/>
    <path d="M496,656 L582,660" marker-end="url(#d2)"/>
  </g>
  <circle cx="610" cy="574" r="38" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.5"/>
  <text x="610" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3448">A</text>
  <text x="610" y="589" text-anchor="middle" font-size="10.5" fill="#4A5A6A">新周期</text>

  <circle cx="634" cy="662" r="44" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.5"/>
  <text x="634" y="657" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3448">A</text>
  <text x="634" y="676" text-anchor="middle" font-size="10.5" fill="#4A5A6A">新能力周期</text>

  <!-- 图例 -->
  <g>
    <rect x="800" y="552" width="370" height="308" rx="4" fill="#FBFCFD" stroke="#C3CED8"/>
    <text x="820" y="578" font-size="13" font-weight="bold" fill="#1F4E79">图例</text>

    <rect x="820" y="594" width="52" height="24" fill="none" stroke="#7A8B9B" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="884" y="611" font-size="11" fill="#33475B">过程分组框（ADM 阶段 B–F）</text>

    <path d="M820,642 H872" stroke="#7A8B9B" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#d2)"/>
    <text x="884" y="646" font-size="11" fill="#33475B">输入依赖</text>

    <path d="M820,676 H872" stroke="#7A8B9B" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#d2)"/>
    <text x="884" y="680" font-size="11" fill="#33475B">产品交付</text>

    <path d="M836,706 L846,716 L836,726 L826,716 Z" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.3"/>
    <text x="884" y="720" font-size="11" fill="#33475B">聚合（整体—部分）</text>

    <circle cx="836" cy="750" r="10" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="1.3"/>
    <text x="884" y="754" font-size="11" fill="#33475B">ADM 阶段</text>

    <text x="820" y="788" font-size="10.5" fill="#5A6B7B">阶段 F 交付物整体移交实施组织；</text>
    <text x="820" y="806" font-size="10.5" fill="#5A6B7B">架构工作请求启动新一轮 ADM 周期；</text>
    <text x="820" y="824" font-size="10.5" fill="#5A6B7B">经验教训变更请求进入新能力周期。</text>
  </g>
</svg>
