<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="240" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">波特价值链（示意）</text>
<g font-size="12" text-anchor="middle">
<rect x="30" y="60" width="110" height="40" fill="#dfe8f3" stroke="#5b7aa8"/><text x="85" y="85">内部后勤</text>
<rect x="150" y="60" width="110" height="40" fill="#dfe8f3" stroke="#5b7aa8"/><text x="205" y="85">生产运营</text>
<rect x="270" y="60" width="110" height="40" fill="#dfe8f3" stroke="#5b7aa8"/><text x="325" y="85">外部后勤</text>
<rect x="390" y="60" width="110" height="40" fill="#dfe8f3" stroke="#5b7aa8"/><text x="445" y="85">市场营销</text>
<rect x="510" y="60" width="110" height="40" fill="#dfe8f3" stroke="#5b7aa8"/><text x="565" y="85">服务</text>
<rect x="650" y="60" width="170" height="40" fill="#e8edf5" stroke="#5b7aa8"/><text x="735" y="85">利润 / 毛利</text>
<rect x="30" y="120" width="740" height="40" fill="#eef3f8" stroke="#5b7aa8"/><text x="400" y="145">辅助活动：采购、技术开发、人力资源管理、企业基础设施</text>
</g>
<text x="20" y="210" font-size="11" fill="#666">价值链以成本与差异化为中心，提供宏观的经济价值视角；不分解到能力支撑层面。</text>
</svg>
