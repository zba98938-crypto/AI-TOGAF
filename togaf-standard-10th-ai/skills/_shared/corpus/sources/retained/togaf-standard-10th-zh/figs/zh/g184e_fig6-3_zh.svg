<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5A6A"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#FFFFFF"/>

  <text x="40" y="36" font-size="19" font-weight="bold" fill="#1F4E79">图 6-3　ISO 31000 风险管理标准模型</text>
  <text x="40" y="58" font-size="12" fill="#5A6B7B">风险管理过程：沟通与咨询、风险评估、风险应对、监督与评审持续循环</text>

  <!-- 左侧：沟通与咨询 -->
  <rect x="48" y="104" width="188" height="536" rx="16" fill="#F1F5F9" stroke="#8A9BB0" stroke-width="1.5"/>
  <text x="142" y="362" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3448">沟通与咨询</text>
  <text x="142" y="388" text-anchor="middle" font-size="11" fill="#5A6B7B">与所有相关方持续沟通</text>

  <!-- 右侧：监督与评审 -->
  <rect x="964" y="104" width="188" height="536" rx="16" fill="#F1F5F9" stroke="#8A9BB0" stroke-width="1.5"/>
  <text x="1058" y="362" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3448">监督与评审</text>
  <text x="1058" y="388" text-anchor="middle" font-size="11" fill="#5A6B7B">持续监督并定期评审</text>

  <!-- 建立情境 -->
  <rect x="398" y="104" width="404" height="64" rx="12" fill="#EAF3FA" stroke="#4A7EA8" stroke-width="1.6"/>
  <text x="600" y="143" text-anchor="middle" font-size="16" font-weight="bold" fill="#12395C">建立情境</text>

  <!-- 风险评估分组 -->
  <rect x="350" y="192" width="500" height="332" rx="18" fill="#FBFCFD" stroke="#A9B8C6" stroke-width="1.4"/>
  <text x="370" y="218" font-size="13" font-weight="bold" fill="#1F4E79">风险评估</text>

  <rect x="390" y="236" width="420" height="58" rx="10" fill="#EAF3FA" stroke="#4A7EA8" stroke-width="1.5"/>
  <text x="600" y="272" text-anchor="middle" font-size="15" fill="#1F3448">风险识别</text>

  <rect x="390" y="316" width="420" height="58" rx="10" fill="#EAF3FA" stroke="#4A7EA8" stroke-width="1.5"/>
  <text x="600" y="352" text-anchor="middle" font-size="15" fill="#1F3448">风险分析</text>

  <rect x="390" y="396" width="420" height="58" rx="10" fill="#EAF3FA" stroke="#4A7EA8" stroke-width="1.5"/>
  <text x="600" y="432" text-anchor="middle" font-size="15" fill="#1F3448">风险评价</text>

  <!-- 风险应对 -->
  <rect x="398" y="540" width="404" height="64" rx="12" fill="#DCE9F5" stroke="#1F4E79" stroke-width="1.7"/>
  <text x="600" y="579" text-anchor="middle" font-size="16" font-weight="bold" fill="#12395C">风险应对</text>

  <!-- 纵向流程箭头 -->
  <g stroke="#4A5A6A" stroke-width="1.6" fill="none">
    <path d="M600,168 V232" marker-end="url(#a1)"/>
    <path d="M600,294 V312" marker-end="url(#a1)"/>
    <path d="M600,374 V392" marker-end="url(#a1)"/>
    <path d="M600,454 V536" marker-end="url(#a1)"/>
  </g>

  <!-- 横向连接：沟通与咨询 -->
  <g stroke="#6B7C8C" stroke-width="1.4" fill="none">
    <path d="M398,136 H236"/>
    <path d="M390,265 H236"/>
    <path d="M390,345 H236"/>
    <path d="M390,425 H236"/>
    <path d="M398,572 H236"/>
  </g>

  <!-- 横向连接：监督与评审 -->
  <g stroke="#6B7C8C" stroke-width="1.4" fill="none">
    <path d="M802,136 H964"/>
    <path d="M810,265 H964"/>
    <path d="M810,345 H964"/>
    <path d="M810,425 H964"/>
    <path d="M802,572 H964"/>
  </g>

  <!-- 反馈回路：监督与评审 → 建立情境 -->
  <path d="M1058,104 V74 H600 V98" stroke="#4A5A6A" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>

  <!-- 反馈回路：风险应对 → 监督与评审 -->
  <path d="M600,604 V704 H1058 V646" stroke="#4A5A6A" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>

  <text x="760" y="68" text-anchor="middle" font-size="10.5" fill="#5A6B7B">评审结果反馈，重新建立情境</text>
  <text x="830" y="722" text-anchor="middle" font-size="10.5" fill="#5A6B7B">风险应对结果进入监督与评审</text>

  <!-- 注 -->
  <text x="40" y="748" font-size="11" fill="#5A6B7B">注：沟通与咨询、监督与评审贯穿风险管理全过程；风险评估包含识别、分析、评价三个子过程。</text>
  <text x="1160" y="748" text-anchor="end" font-size="10" fill="#8A9BB0">© The Open Group</text>
</svg>
