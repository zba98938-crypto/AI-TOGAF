<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="1200" fill="#ffffff"/>
  <title>图 5-4　C-MDM 系统功能（中文重绘）</title>

  <!-- 外框与标题 -->
  <rect x="20" y="20" width="1160" height="1140" rx="10" fill="#F7F8FA" stroke="#9AA5B1" stroke-width="1.4"/>
  <text x="600" y="52" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3864">C-MDM 系统功能</text>

  <!-- 左侧：参考数据管理 -->
  <rect x="34" y="76" width="200" height="920" rx="7" fill="#EFEFF1" stroke="#B9C0C7"/>
  <text x="48" y="106" font-size="13" font-weight="bold" fill="#1F3864">参考数据管理</text>
  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.3">
    <rect x="48" y="268" width="172" height="66" rx="7"/>
    <rect x="48" y="398" width="172" height="66" rx="7"/>
    <rect x="48" y="528" width="172" height="66" rx="7"/>
    <rect x="48" y="658" width="172" height="66" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#10233F">
    <text x="134" y="306">输入属性转码</text>
    <text x="134" y="436">管理参考列表</text>
    <text x="134" y="566">管理客户键映射</text>
    <text x="134" y="696">输出属性转码</text>
  </g>

  <!-- 采集 -->
  <rect x="246" y="76" width="684" height="224" rx="8" fill="#F2F3F5" stroke="#B9C0C7"/>
  <text x="588" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">采集——用户界面或服务</text>

  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.3">
    <rect x="258" y="114" width="150" height="76" rx="7"/>
    <rect x="420" y="114" width="150" height="76" rx="7"/>
    <rect x="582" y="106" width="336" height="92" rx="7"/>
    <rect x="596" y="146" width="150" height="42" rx="6"/>
    <rect x="758" y="146" width="150" height="42" rx="6"/>
    <rect x="258" y="200" width="660" height="36" rx="7"/>
    <rect x="258" y="244" width="660" height="36" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#10233F">
    <text x="333" y="156">创建主数据</text>
    <text x="495" y="156">更新主数据</text>
    <text x="750" y="128" font-size="10">管理主实体与其他业务对象之间的链接</text>
    <text x="671" y="172" font-size="9.8">管理关系</text>
    <text x="833" y="172" font-size="9.8">管理群组与层级</text>
    <text x="588" y="223" font-size="10.5">导入数据集/批量采集</text>
    <text x="588" y="267" font-size="10.5">以技术与业务元数据增强数据</text>
  </g>

  <!-- 质量管理 -->
  <rect x="246" y="312" width="684" height="432" rx="8" fill="#F2F3F5" stroke="#B9C0C7"/>
  <text x="588" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">质量管理</text>

  <rect x="258" y="350" width="660" height="36" rx="7" fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.3"/>
  <text x="588" y="373" text-anchor="middle" font-size="10.5" fill="#10233F">管理业务校验与工作流</text>

  <rect x="258" y="398" width="660" height="126" rx="7" fill="#F2F3F5" stroke="#B9C0C7"/>
  <text x="588" y="418" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F3864">管理与应用属性值质量规则</text>
  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.2">
    <rect x="270" y="428" width="200" height="80" rx="6"/>
    <rect x="484" y="428" width="206" height="80" rx="6"/>
    <rect x="700" y="428" width="206" height="80" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="9.6" fill="#10233F">
    <text x="370" y="460">管理语法、格式</text>
    <text x="370" y="476">与规范化规则</text>
    <text x="587" y="460">管理一致性与</text>
    <text x="587" y="476">业务规则</text>
    <text x="803" y="456">管理准确性</text>
    <text x="803" y="472">（准确性评分、</text>
    <text x="803" y="488">外部数据）</text>
  </g>

  <rect x="258" y="534" width="660" height="196" rx="7" fill="#F2F3F5" stroke="#B9C0C7"/>
  <text x="588" y="554" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F3864">管理唯一性规则</text>
  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.2">
    <rect x="268" y="564" width="118" height="92" rx="6"/>
    <rect x="394" y="564" width="118" height="92" rx="6"/>
    <rect x="520" y="564" width="118" height="92" rx="6"/>
    <rect x="646" y="564" width="118" height="92" rx="6"/>
    <rect x="772" y="564" width="118" height="92" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="9" fill="#10233F">
    <text x="327" y="598">确定性流程</text>
    <text x="327" y="614">去重</text>
    <text x="453" y="598">概率/统计</text>
    <text x="453" y="614">流程去重</text>
    <text x="579" y="598">推荐合并</text>
    <text x="579" y="614">以供仲裁</text>
    <text x="705" y="598">人工合并</text>
    <text x="705" y="614">仲裁</text>
    <text x="831" y="606">取消合并</text>
  </g>
  <rect x="258" y="660" width="660" height="36" rx="7" fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.3"/>
  <text x="588" y="683" text-anchor="middle" font-size="10.5" fill="#10233F">生成唯一主数据技术键</text>

  <!-- 数据隐私管理 -->
  <rect x="246" y="756" width="684" height="100" rx="8" fill="#F2F3F5" stroke="#B9C0C7"/>
  <text x="588" y="780" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">数据隐私管理</text>
  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.2">
    <rect x="258" y="792" width="205" height="50" rx="7"/>
    <rect x="475" y="792" width="210" height="50" rx="7"/>
    <rect x="697" y="792" width="195" height="50" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#10233F">
    <text x="360" y="822">人工删除</text>
    <text x="580" y="822">按规则自动删除</text>
    <text x="794" y="822">掩码</text>
  </g>

  <!-- 分发 -->
  <rect x="246" y="868" width="684" height="132" rx="8" fill="#F2F3F5" stroke="#B9C0C7"/>
  <text x="588" y="892" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">分发——用户界面或服务</text>
  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.2">
    <rect x="258" y="902" width="130" height="38" rx="7"/>
    <rect x="400" y="902" width="130" height="38" rx="7"/>
    <rect x="542" y="902" width="140" height="38" rx="7"/>
    <rect x="694" y="902" width="224" height="38" rx="7"/>
    <rect x="258" y="950" width="660" height="36" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="10.2" fill="#10233F">
    <text x="323" y="926">搜索</text>
    <text x="465" y="926">读取数据</text>
    <text x="612" y="926">抽取数据</text>
    <text x="806" y="926" font-size="9.6">推送事件：创建、更新、删除、合并</text>
    <text x="588" y="973" font-size="9.8">按人类或系统消费者角色呈现数据可见性与取值</text>
  </g>

  <!-- 右侧：仪表盘与报表 -->
  <rect x="942" y="76" width="224" height="924" rx="7" fill="#EFEFF1" stroke="#B9C0C7"/>
  <text x="1054" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">仪表盘与报表</text>
  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.3">
    <rect x="956" y="250" width="196" height="96" rx="7"/>
    <rect x="956" y="430" width="196" height="96" rx="7"/>
    <rect x="956" y="610" width="196" height="96" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#10233F">
    <text x="1054" y="288">生成审计数据</text>
    <text x="1054" y="308">演进报表</text>
    <text x="1054" y="468">生成数据质量</text>
    <text x="1054" y="488">仪表盘</text>
    <text x="1054" y="648">生成用途</text>
    <text x="1054" y="668">仪表盘</text>
  </g>

  <!-- 管理 -->
  <rect x="34" y="1012" width="1132" height="108" rx="8" fill="#F2F3F5" stroke="#B9C0C7"/>
  <text x="600" y="1038" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">管理</text>
  <g fill="#79C3E8" stroke="#2F4A5E" stroke-width="1.2">
    <rect x="48" y="1052" width="200" height="52" rx="7"/>
    <rect x="262" y="1052" width="230" height="52" rx="7"/>
    <rect x="506" y="1052" width="180" height="52" rx="7"/>
    <rect x="700" y="1052" width="130" height="52" rx="7"/>
    <rect x="844" y="1052" width="170" height="52" rx="7"/>
    <rect x="1028" y="1052" width="120" height="52" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="10.2" fill="#10233F">
    <text x="148" y="1078">设计主数据模型</text>
    <text x="377" y="1074" font-size="9.6">管理数据历史化</text>
    <text x="377" y="1090" font-size="9.6">与版本规则</text>
    <text x="596" y="1078">全数据库版本管理</text>
    <text x="765" y="1078">管理角色</text>
    <text x="929" y="1078">管理访问权限</text>
    <text x="1088" y="1078">管理日志</text>
  </g>

  <text x="34" y="1148" font-size="9.5" fill="#5B6B7E">结构据英文原图重绘：左侧为参考数据管理，中部自上而下为采集、质量管理、数据隐私管理与分发，右侧为仪表盘与报表，底部为管理功能。</text>
</svg>
