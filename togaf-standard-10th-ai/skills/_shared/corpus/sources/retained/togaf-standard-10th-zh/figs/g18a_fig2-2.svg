<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="820" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">四框框架（Four-Box Framework）</text>
<g font-size="12">
<rect x="40" y="50" width="340" height="110" fill="#dce6f2" stroke="#5b7aa8"/><text x="60" y="76" font-weight="bold">客户价值主张</text><text x="60" y="98" font-size="11">帮助客户完成重要任务的产品/服务</text><text x="60" y="116" font-size="11">解决客户痛点或创造收益</text>
<rect x="400" y="50" width="340" height="110" fill="#dfe8dc" stroke="#5f8f5f"/><text x="420" y="76" font-weight="bold">利润公式</text><text x="420" y="98" font-size="11">价值主张如何赚钱：收入模型、</text><text x="420" y="116" font-size="11">成本结构、利润率与资源周转</text>
<rect x="40" y="180" width="340" height="110" fill="#f7efe4" stroke="#b07a55"/><text x="60" y="206" font-weight="bold">关键资源</text><text x="60" y="228" font-size="11">交付价值主张所需的人员、技术、</text><text x="60" y="246" font-size="11">设备、信息、渠道、伙伴与品牌</text>
<rect x="400" y="180" width="340" height="110" fill="#f2ecf7" stroke="#806a9e"/><text x="420" y="206" font-weight="bold">关键流程</text><text x="420" y="228" font-size="11">反复执行以交付价值的运营与管理</text><text x="420" y="246" font-size="11">流程、指标与规范</text>
</g>
</svg>
