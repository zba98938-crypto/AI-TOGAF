<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="330" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">ADM 过程层级示例（多级 ADM 循环）</text>
<g font-size="11">
<rect x="30" y="50" width="820" height="60" rx="8" fill="#e8eef7" stroke="#5b7aa8"/><text x="50" y="76" font-weight="bold">战略层 ADM 循环</text><text x="50" y="96" font-size="10">阶段 A/B：战略主题、价值流、路线图；产出分段待办</text>
<rect x="60" y="130" width="360" height="60" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="80" y="156" font-weight="bold">分段 ADM 循环 1</text><text x="80" y="176" font-size="10">Epic、特性、KPI；可与循环 2 并行</text>
<rect x="450" y="130" width="360" height="60" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="470" y="156" font-weight="bold">分段 ADM 循环 2</text><text x="470" y="176" font-size="10">按需细化 B/C/D，形成交付 backlog</text>
<rect x="80" y="215" width="300" height="60" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="100" y="241" font-weight="bold">能力 ADM 循环（冲刺）</text><text x="100" y="261" font-size="10">用户故事、API 规格、CI/CD 输入</text>
<rect x="410" y="215" width="300" height="60" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="430" y="241" font-weight="bold">能力 ADM 循环（并行）</text><text x="430" y="261" font-size="10">跨团队横切规格（如 API 管理）</text>
</g>
<g stroke="#888" stroke-width="1.1" stroke-dasharray="4 3" fill="none"><path d="M240,190 V215"/><path d="M630,190 V215"/><path d="M440,110 V130"/><path d="M240,190 Q420,150 630,190" /></g>
<text x="20" y="315" font-size="10.5" fill="#666">各层可并行推进；下层经验反馈上层，形成持续演进。</text>
</svg>
