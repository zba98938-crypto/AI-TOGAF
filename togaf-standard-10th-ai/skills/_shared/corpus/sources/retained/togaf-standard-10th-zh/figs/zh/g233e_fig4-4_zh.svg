<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Hiragino Sans GB, sans-serif">
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="bold" fill="#1f3a4d">简化零售概念数据模型</text>

  <!-- 关联线 -->
  <g stroke="#2f4a5e" stroke-width="1.5" fill="none">
    <!-- 员工 - 零售购买 -->
    <line x1="540" y1="160" x2="540" y2="250"/>
    <!-- 客户 - 零售购买 -->
    <line x1="240" y1="360" x2="440" y2="360"/>
    <!-- 支付 - 零售购买 -->
    <line x1="240" y1="500" x2="440" y2="500"/>
    <!-- 零售购买 - 门店 -->
    <line x1="640" y1="360" x2="790" y2="360"/>
    <!-- 门店 - 仓库 -->
    <line x1="970" y1="360" x2="1030" y2="360"/>
    <!-- 零售购买 - 购买中的产品 -->
    <line x1="640" y1="500" x2="760" y2="500"/>
    <!-- 购买中的产品 - 产品 -->
    <line x1="950" y1="500" x2="1020" y2="500"/>
    <!-- 零售购买 - 激励 -->
    <line x1="540" y1="560" x2="540" y2="620"/>
    <!-- 支付 - 支付类型 -->
    <line x1="140" y1="540" x2="140" y2="620"/>
    <!-- 员工自关联 -->
    <path d="M640,120 H674 Q690,120 690,104 V71 Q690,55 674,55 H576 Q560,55 560,71 V80"/>
  </g>

  <!-- 基数标记：1（竖线） -->
  <g stroke="#2f4a5e" stroke-width="1.8">
    <line x1="540" y1="170" x2="540" y2="186"/>
    <line x1="268" y1="350" x2="268" y2="370"/>
    <line x1="268" y1="490" x2="268" y2="510"/>
    <line x1="662" y1="350" x2="662" y2="370"/>
    <line x1="662" y1="490" x2="662" y2="510"/>
    <line x1="1022" y1="350" x2="1022" y2="370"/>
    <line x1="1012" y1="490" x2="1012" y2="510"/>
    <line x1="540" y1="604" x2="540" y2="618"/>
    <line x1="140" y1="606" x2="140" y2="620"/>
  </g>

  <!-- 基数标记：0..*（圆圈 + 鸦爪） -->
  <g stroke="#2f4a5e" stroke-width="1.5" fill="#ffffff">
    <!-- 零售购买端（员工） -->
    <path d="M540,236 L530,248 M540,236 L540,248 M540,236 L550,248" fill="none"/>
    <circle cx="540" cy="228" r="6"/>
    <!-- 零售购买端（客户） -->
    <path d="M426,360 L438,350 M426,360 L438,360 M426,360 L438,370" fill="none"/>
    <circle cx="418" cy="360" r="6"/>
    <!-- 零售购买端（支付） -->
    <path d="M426,500 L438,490 M426,500 L438,500 M426,500 L438,510" fill="none"/>
    <circle cx="418" cy="500" r="6"/>
    <!-- 门店端（零售购买） -->
    <path d="M776,360 L788,350 M776,360 L788,360 M776,360 L788,370" fill="none"/>
    <circle cx="768" cy="360" r="6"/>
    <!-- 门店端（仓库） -->
    <path d="M982,360 L970,350 M982,360 L970,360 M982,360 L970,370" fill="none"/>
    <circle cx="990" cy="360" r="6"/>
    <!-- 购买中的产品端 -->
    <path d="M748,500 L760,490 M748,500 L760,500 M748,500 L760,510" fill="none"/>
    <circle cx="740" cy="500" r="6"/>
    <!-- 购买中的产品端（产品） -->
    <path d="M962,500 L950,490 M962,500 L950,500 M962,500 L950,510" fill="none"/>
    <circle cx="970" cy="500" r="6"/>
    <!-- 零售购买端（激励） -->
    <path d="M540,572 L530,560 M540,572 L540,560 M540,572 L550,560" fill="none"/>
    <circle cx="540" cy="580" r="6"/>
    <!-- 支付端（支付类型） -->
    <path d="M140,552 L130,540 M140,552 L140,540 M140,552 L150,540" fill="none"/>
    <circle cx="140" cy="560" r="6"/>
  </g>

  <!-- 实体 -->
  <g stroke="#2f4a5e" stroke-width="1.8" fill="#fbfcfd">
    <rect x="440" y="80" width="200" height="80" rx="10"/>
    <rect x="440" y="250" width="200" height="310" rx="10"/>
    <rect x="40" y="320" width="200" height="80" rx="10"/>
    <rect x="40" y="460" width="200" height="80" rx="10"/>
    <rect x="40" y="620" width="200" height="70" rx="10"/>
    <rect x="790" y="320" width="180" height="80" rx="10"/>
    <rect x="1030" y="320" width="150" height="80" rx="10"/>
    <rect x="760" y="460" width="190" height="80" rx="10"/>
    <rect x="1020" y="460" width="160" height="80" rx="10"/>
    <rect x="440" y="620" width="200" height="70" rx="10"/>
  </g>

  <g font-size="15" fill="#1f3a4d" text-anchor="middle">
    <text x="540" y="124">员工</text>
    <text x="540" y="411">零售购买</text>
    <text x="140" y="364">客户</text>
    <text x="140" y="504">支付</text>
    <text x="140" y="661">支付类型</text>
    <text x="880" y="364">门店</text>
    <text x="1105" y="364">仓库</text>
    <text x="855" y="504">购买中的产品</text>
    <text x="1100" y="504">产品</text>
    <text x="540" y="661">激励</text>
  </g>

  <!-- 图例 -->
  <g stroke="#2f4a5e" stroke-width="1.4" fill="none">
    <line x1="44" y1="736" x2="132" y2="736"/>
    <line x1="56" y1="727" x2="56" y2="745"/>
    <path d="M104,736 L116,726 M104,736 L116,736 M104,736 L116,746"/>
    <circle cx="96" cy="736" r="6" fill="#ffffff"/>
  </g>
  <text x="146" y="741" font-size="12" fill="#33475b">关联基数：| 表示 1（一），○&lt; 表示 0..*（多）</text>
</svg>
