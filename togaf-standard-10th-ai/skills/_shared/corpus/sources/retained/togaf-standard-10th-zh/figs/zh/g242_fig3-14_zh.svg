  <!-- 第三部分：减排手段 -->
  <rect x="30" y="582" width="1140" height="36" fill="#E7EBEF"/>
  <text x="600" y="606" font-size="14" font-weight="bold" fill="#26313D" text-anchor="middle">为最小化 IT 环境影响，目标架构研究了以下手段：</text>

  <rect x="30" y="632" width="216" height="130" fill="#2F5597"/>
  <text x="138" y="692" font-size="12" fill="#FFFFFF" text-anchor="middle">在软件或数据科学开发中</text>
  <text x="138" y="713" font-size="12" fill="#FFFFFF" text-anchor="middle">考虑环境影响</text>

  <rect x="260" y="632" width="216" height="130" fill="#2F5597"/>
  <text x="368" y="682" font-size="12" fill="#FFFFFF" text-anchor="middle">提升技术设备的能效与</text>
  <text x="368" y="703" font-size="12" fill="#FFFFFF" text-anchor="middle">碳足迹表现，并延长</text>
  <text x="368" y="724" font-size="12" fill="#FFFFFF" text-anchor="middle">设备使用寿命</text>

  <rect x="490" y="632" width="216" height="130" fill="#2F5597"/>
  <text x="598" y="682" font-size="12" fill="#FFFFFF" text-anchor="middle">在选择解决方案提供方的</text>
  <text x="598" y="703" font-size="12" fill="#FFFFFF" text-anchor="middle">流程（RFI、RFP……）中</text>
  <text x="598" y="724" font-size="12" fill="#FFFFFF" text-anchor="middle">纳入环境标准</text>

  <rect x="720" y="632" width="216" height="130" fill="#2F5597"/>
  <text x="828" y="692" font-size="12" fill="#FFFFFF" text-anchor="middle">确保随时间推移最小化</text>
  <text x="828" y="713" font-size="12" fill="#FFFFFF" text-anchor="middle">数据量增长（数据最小化）</text>

  <rect x="950" y="632" width="216" height="130" fill="#2F5597"/>
  <text x="1058" y="682" font-size="12" fill="#FFFFFF" text-anchor="middle">向最终用户提供功能，</text>
  <text x="1058" y="703" font-size="12" fill="#FFFFFF" text-anchor="middle">帮助其在 IT 使用中</text>
  <text x="1058" y="724" font-size="12" fill="#FFFFFF" text-anchor="middle">采取低碳行为</text>

