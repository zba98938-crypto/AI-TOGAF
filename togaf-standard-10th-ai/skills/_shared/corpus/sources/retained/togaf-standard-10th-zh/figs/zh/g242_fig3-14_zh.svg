  <text x="990" y="364" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">增加</text>
  <rect x="1055" y="345" width="100" height="26" fill="#FFFFFF" stroke="#1F3864"/>
  <text x="1105" y="364" font-size="13" fill="#1F3864" text-anchor="middle" dominant-baseline="middle">减少</text>

  <!-- 表格 -->
