  <text x="30" y="54" font-size="30" font-weight="bold" fill="#1F3864">支撑组织气候转型</text>
  <text x="30" y="88" font-size="20" fill="#2F5597">IT 贡献</text>

  <!-- 第一部分：业务正向影响 -->
  <rect x="30" y="108" width="1140" height="32" fill="#E7EBEF"/>
  <text x="600" y="129" font-size="14" font-weight="bold" fill="#26313D" text-anchor="middle">环境业务正向影响——目标架构将帮助业务：</text>

  <!-- 卡片 1 -->
  <rect x="30" y="152" width="366" height="168" fill="#8A949F"/>
  <text x="213" y="171" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">度量环境影响</text>
  <rect x="48" y="196" width="110" height="30" fill="#1F3864"/>
  <text x="103" y="216" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">是</text>
  <rect x="170" y="196" width="110" height="30" fill="#FFFFFF" stroke="#1F3864"/>
  <text x="225" y="216" font-size="13" fill="#1F3864" text-anchor="middle">否</text>
  <rect x="44" y="238" width="338" height="66" fill="#F7F9FB" stroke="#8FA3B5" stroke-dasharray="4 3"/>
  <text x="213" y="264" font-size="12" fill="#33465B" text-anchor="middle">若是，说明如何实现</text>
  <text x="213" y="285" font-size="12" fill="#33465B" text-anchor="middle">（为此新增的功能）</text>

  <!-- 卡片 2 -->
  <rect x="417" y="152" width="366" height="168" fill="#8A949F"/>
  <text x="600" y="171" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">降低业务环境影响</text>
  <rect x="435" y="196" width="110" height="30" fill="#1F3864"/>
  <text x="490" y="216" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">是</text>
  <rect x="557" y="196" width="110" height="30" fill="#FFFFFF" stroke="#1F3864"/>
  <text x="612" y="216" font-size="13" fill="#1F3864" text-anchor="middle">否</text>
  <rect x="431" y="238" width="338" height="66" fill="#F7F9FB" stroke="#8FA3B5" stroke-dasharray="4 3"/>
  <text x="600" y="264" font-size="12" fill="#33465B" text-anchor="middle">若是，说明如何实现，</text>
  <text x="600" y="285" font-size="12" fill="#33465B" text-anchor="middle">并评估目标减排带来的收益</text>

  <!-- 卡片 3 -->
  <rect x="804" y="152" width="366" height="168" fill="#8A949F"/>
  <text x="987" y="171" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">就环境与气候变化培训业务</text>
  <rect x="822" y="196" width="110" height="30" fill="#1F3864"/>
  <text x="877" y="216" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">是</text>
  <rect x="944" y="196" width="110" height="30" fill="#FFFFFF" stroke="#1F3864"/>
  <text x="999" y="216" font-size="13" fill="#1F3864" text-anchor="middle">否</text>
  <rect x="818" y="238" width="338" height="66" fill="#F7F9FB" stroke="#8FA3B5" stroke-dasharray="4 3"/>
  <text x="987" y="264" font-size="12" fill="#33465B" text-anchor="middle">若是，说明如何实现，</text>
  <text x="987" y="285" font-size="12" fill="#33465B" text-anchor="middle">并评估目标减排带来的收益</text>

