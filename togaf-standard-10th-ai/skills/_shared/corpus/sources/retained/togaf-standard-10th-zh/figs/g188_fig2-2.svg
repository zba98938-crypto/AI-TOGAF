<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">架构项目生命周期</text>
<g font-size="10.5" text-anchor="middle">
<rect x="30" y="60" width="130" height="60" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="95" y="84">项目启动</text><text x="95" y="102">Executive/PM/团队</text>
<rect x="175" y="60" width="130" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="240" y="84">项目规划</text><text x="240" y="102">范围与方法</text>
<rect x="320" y="60" width="130" height="60" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="385" y="84">阶段规划</text><text x="385" y="102">下一阶段计划</text>
<rect x="465" y="60" width="140" height="60" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="535" y="84">执行/监控/控制</text><text x="535" y="102">ADM B–F 活动</text>
<rect x="620" y="60" width="110" height="60" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="675" y="84">阶段收尾</text><text x="675" y="102">评审与移交</text>
<rect x="745" y="60" width="110" height="60" rx="6" fill="#f2ecf7" stroke="#806a9e"/><text x="800" y="84">项目收尾</text><text x="800" y="102">交付与经验</text>
</g>
<g stroke="#555" stroke-width="1.2" fill="none"><path d="M160,90 H175"/><path d="M305,90 H320"/><path d="M450,90 H465"/><path d="M605,90 H620"/><path d="M730,90 H745"/></g>
<g font-size="10.5" fill="#333">
<text x="30" y="170">关键实践：</text>
<text x="30" y="195">• 任命执行发起人（Executive）与项目经理，明确权责</text>
<text x="30" y="218">• 汲取以往经验教训，形成经验登记册</text>
<text x="30" y="241">• 编制概要商业论证，选择项目方法（资源、计划、方法、框架）</text>
<text x="30" y="264">• 设计并任命项目管理团队（治理、PM 支持、交付团队）</text>
<text x="30" y="287">• 汇编项目任务书，定义管理方法；分阶段规划并滚动细化</text>
</g>
</svg>
