<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">ISO 31000:2009 风险管理过程（示意）</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="60" width="150" height="46" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="115" y="80">建立语境</text><text x="115" y="96" font-size="10">Context</text>
<rect x="220" y="60" width="150" height="46" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="295" y="80">风险识别</text><text x="295" y="96" font-size="10">Identification</text>
<rect x="400" y="60" width="150" height="46" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="475" y="80">风险分析</text><text x="475" y="96" font-size="10">Analysis</text>
<rect x="580" y="60" width="150" height="46" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="655" y="80">风险评价</text><text x="655" y="96" font-size="10">Evaluation</text>
<rect x="760" y="60" width="100" height="46" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="810" y="80">风险处置</text><text x="810" y="96" font-size="10">Treatment</text>
<rect x="40" y="150" width="820" height="40" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="450" y="175">沟通与协商（贯穿全过程）</text>
<rect x="40" y="205" width="820" height="40" rx="6" fill="#f2ecf7" stroke="#806a9e"/><text x="450" y="230">监督与评审（持续进行）</text>
</g>
<g stroke="#555" stroke-width="1.2" fill="none"><path d="M190,83 H220"/><path d="M370,83 H400"/><path d="M550,83 H580"/><path d="M730,83 H760"/></g>
<text x="20" y="290" font-size="10.5" fill="#666">风险管理应深植于所有业务活动，是持续的生命周期而非孤立活动；核心是“管理到预期目标”。</text>
</svg>
