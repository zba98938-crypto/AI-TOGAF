<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="340" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">业务场景的五个要素</text>
<g font-size="11.5" text-anchor="middle">
<rect x="330" y="45" width="220" height="60" rx="8" fill="#fdf3d8" stroke="#b09040"/><text x="440" y="72" font-weight="bold">问题</text><text x="440" y="92" font-size="10">真实业务问题与排序</text>
<rect x="40" y="140" width="180" height="70" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="130" y="166" font-weight="bold">业务与技术环境</text><text x="130" y="186" font-size="10">价值流、业务能力</text><text x="130" y="202" font-size="10">利益相关方</text>
<rect x="250" y="140" width="180" height="70" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="340" y="166" font-weight="bold">期望成果</text><text x="340" y="186" font-size="10">SMART 结果</text><text x="340" y="202" font-size="10">业务价值</text>
<rect x="460" y="140" width="180" height="70" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="550" y="166" font-weight="bold">人的参与者</text><text x="550" y="186" font-size="10">角色与职责</text><text x="550" y="202" font-size="10">在业务模型中的位置</text>
<rect x="670" y="140" width="180" height="70" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="760" y="166" font-weight="bold">计算机参与者</text><text x="760" y="186" font-size="10">计算元素与接口</text><text x="760" y="202" font-size="10">在技术模型中的位置</text>
</g>
<g stroke="#888" stroke-width="1.1" fill="none"><path d="M400,105 L160,140"/><path d="M430,105 L360,140"/><path d="M470,105 L540,140"/><path d="M500,105 L740,140"/></g>
<text x="20" y="280" font-size="10.5" fill="#666">六个步骤：识别并排序问题 → 识别环境 → 定义期望成果 → 识别人 → 识别计算机元素 → 检验适用性并按需细化。</text>
<text x="20" y="305" font-size="10.5" fill="#666">迭代直到“理解足以支持决策”，既避免遗漏要素导致解决方案不完整，也避免不必要的反复。</text>
</svg>
