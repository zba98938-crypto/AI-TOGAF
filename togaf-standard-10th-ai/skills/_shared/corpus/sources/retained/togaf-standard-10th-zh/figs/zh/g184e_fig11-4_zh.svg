<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <rect width="1200" height="660" fill="#FFFFFF"/>

