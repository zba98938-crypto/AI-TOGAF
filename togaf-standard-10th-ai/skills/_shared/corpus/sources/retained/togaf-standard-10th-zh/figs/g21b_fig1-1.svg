<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">组织能力的通用描述（六类能力）</text>
<g font-size="11" text-anchor="middle">
<rect x="30" y="55" width="130" height="50" rx="5" fill="#eef3f8" stroke="#5b7aa8"/><text x="95" y="76">核心业务</text><text x="95" y="92" font-size="10">价值链主活动</text>
<rect x="170" y="55" width="130" height="50" rx="5" fill="#eef3f8" stroke="#5b7aa8"/><text x="235" y="76">互动</text><text x="235" y="92" font-size="10">客户/伙伴渠道</text>
<rect x="310" y="55" width="150" height="50" rx="5" fill="#e9f2e9" stroke="#5f8f5f"/><text x="385" y="76">数据管理支撑</text><text x="385" y="92" font-size="10">MDM/元数据/BI/集成</text>
<rect x="470" y="55" width="120" height="50" rx="5" fill="#fdf3d8" stroke="#b09040"/><text x="530" y="76">业务支撑</text><text x="530" y="92" font-size="10">HR/财务/采购</text>
<rect x="600" y="55" width="120" height="50" rx="5" fill="#f7efe4" stroke="#b07a55"/><text x="660" y="76">技术支撑</text><text x="660" y="92" font-size="10">平台/基础设施</text>
<rect x="730" y="55" width="120" height="50" rx="5" fill="#f2ecf7" stroke="#806a9e"/><text x="790" y="76">治理</text><text x="790" y="92" font-size="10">战略/架构/风险</text>
</g>
<g stroke="#888" stroke-width="1.1" fill="none"><path d="M160,80 H170"/><path d="M300,80 H310"/><path d="M460,80 H470"/><path d="M590,80 H600"/><path d="M720,80 H730"/></g>
<text x="20" y="160" font-size="10.5" fill="#666">数据管理支撑是跨业务共享的能力底座：元数据管理、BI 与分析、主数据管理、集成与互操作。</text>
<text x="20" y="190" font-size="10.5" fill="#666">C-MDM 属于主数据管理，聚焦客户数据，为各业务线提供统一、可信、可复用的客户主数据。</text>
<text x="20" y="230" font-size="10.5" fill="#666">客户可以是自然人（买家/受益人/潜在客户），也可以是组织（政府、企业、组织单元、非正式团体等）。</text>
</svg>
