<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="790" fill="#ffffff"/>

  <defs>
    <marker id="downGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4CAF50"/>
    </marker>
    <marker id="upOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#E08A2E"/>
    </marker>
    <marker id="triRightBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2E6DA4"/>
    </marker>
    <marker id="triLeftBlue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#2E6DA4"/>
    </marker>
    <marker id="triRightGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5A6B7B"/>
    </marker>
    <marker id="triLeftGray" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <!-- 对用途的约束 -->
  <text x="600" y="40" font-size="17" font-weight="bold" fill="#3E8E5B" text-anchor="middle">对用途的约束</text>
  <text x="600" y="66" font-size="13.5" fill="#33465B" text-anchor="middle">以配额或专属用户组限制高消耗功能，</text>
  <text x="600" y="88" font-size="13.5" fill="#33465B" text-anchor="middle">例如流媒体、移动网络、大容量存储等。</text>
  <line x1="600" y1="103" x2="600" y2="203" stroke="#4CAF50" stroke-width="3.5" marker-end="url(#downGreen)"/>

  <!-- 迭代边界 -->
  <rect x="350" y="140" width="500" height="520" rx="70" fill="none" stroke="#B9C7D4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="380" y="165" width="440" height="470" rx="60" fill="none" stroke="#B9C7D4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="410" y="190" width="380" height="420" rx="50" fill="#FCFDFE" stroke="#B9C7D4" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- 内部图示：云、网络、数据库、终端、网络设备 -->
  <g>
    <!-- 云 -->
    <g fill="#E9EEF3" stroke="#6E8296" stroke-width="1.6">
      <ellipse cx="498" cy="300" rx="29" ry="18"/>
      <ellipse cx="528" cy="286" rx="34" ry="24"/>
      <ellipse cx="558" cy="301" rx="26" ry="17"/>
      <rect x="498" y="288" width="60" height="29" rx="14"/>
    </g>
    <!-- 网络球 -->
    <circle cx="505" cy="372" r="40" fill="#DCEAF5" stroke="#4E7396" stroke-width="2"/>
    <ellipse cx="505" cy="372" rx="17" ry="40" fill="none" stroke="#4E7396" stroke-width="1.3"/>
    <line x1="465" y1="372" x2="545" y2="372" stroke="#4E7396" stroke-width="1.3"/>
    <circle cx="493" cy="352" r="3" fill="#2E6DA4"/>
    <circle cx="523" cy="362" r="3" fill="#2E6DA4"/>
    <circle cx="505" cy="392" r="3" fill="#2E6DA4"/>
    <!-- 数据库 -->
    <g stroke="#B85A1B" stroke-width="1.6">
      <rect x="565" y="330" width="86" height="112" fill="#F08A3C"/>
      <ellipse cx="608" cy="330" rx="43" ry="14" fill="#F5A05B"/>
      <ellipse cx="608" cy="330" rx="43" ry="14" fill="none"/>
      <ellipse cx="608" cy="366" rx="43" ry="14" fill="#F5A05B"/>
      <ellipse cx="608" cy="366" rx="43" ry="14" fill="none"/>
      <ellipse cx="608" cy="402" rx="43" ry="14" fill="#F5A05B"/>
      <ellipse cx="608" cy="402" rx="43" ry="14" fill="none"/>
      <ellipse cx="608" cy="442" rx="43" ry="14" fill="#F5A05B"/>
      <ellipse cx="608" cy="442" rx="43" ry="14" fill="none"/>
    </g>
    <!-- 显示器 -->
    <g>
      <rect x="662" y="378" width="118" height="86" rx="5" fill="#FFFFFF" stroke="#17334F" stroke-width="2"/>
      <rect x="674" y="390" width="94" height="62" rx="2" fill="#E9F1F7" stroke="#8FA3B8" stroke-width="1"/>
      <rect x="710" y="464" width="22" height="12" fill="#FFFFFF" stroke="#17334F" stroke-width="1.6"/>
      <line x1="688" y1="476" x2="754" y2="476" stroke="#17334F" stroke-width="2"/>
    </g>
    <!-- 网络设备 -->
    <g>
      <rect x="540" y="465" width="110" height="58" rx="7" fill="#4E8FBF" stroke="#17334F" stroke-width="1.8"/>
      <line x1="548" y1="489" x2="642" y2="489" stroke="#D6E6F2" stroke-width="1"/>
      <circle cx="558" cy="478" r="3.5" fill="#F2E85C"/>
      <circle cx="578" cy="478" r="3.5" fill="#F2E85C"/>
      <rect x="552" y="498" width="26" height="12" rx="2" fill="#2E5F86"/>
      <rect x="590" y="498" width="26" height="12" rx="2" fill="#2E5F86"/>
    </g>
    <g fill="#8FA3B8" font-size="15" font-weight="bold">
      <text x="568" y="272">+</text>
      <text x="700" y="335">+</text>
      <text x="680" y="490">+</text>
      <text x="472" y="445">+</text>
    </g>
  </g>

  <!-- 迭代标注 -->
  <g stroke="#8FA3B8" stroke-width="1">
    <line x1="850" y1="535" x2="885" y2="545"/>
    <line x1="820" y1="570" x2="885" y2="580"/>
    <line x1="790" y1="605" x2="885" y2="615"/>
  </g>
  <g font-size="13" fill="#5A6B7B">
    <text x="892" y="550">迭代 3</text>
    <text x="892" y="585">迭代 2</text>
    <text x="892" y="620">迭代 1</text>
  </g>

  <!-- 对应用与开发的约束 -->
  <text x="180" y="345" font-size="16" font-weight="bold" fill="#2E6DA4" text-anchor="middle">对应用与开发的约束</text>
  <text x="180" y="372" font-size="13" fill="#33465B" text-anchor="middle">优化能耗；借助开源库避免软件过时；</text>
  <text x="180" y="394" font-size="13" fill="#33465B" text-anchor="middle">限制高影响库/框架的使用，</text>
  <text x="180" y="416" font-size="13" fill="#33465B" text-anchor="middle">优先选择低能耗库/框架。</text>
  <line x1="332" y1="445" x2="405" y2="445" stroke="#2E6DA4" stroke-width="2.2" marker-end="url(#triRightBlue)"/>

  <!-- 对数据的约束 -->
  <text x="1010" y="345" font-size="16" font-weight="bold" fill="#5A6B7B" text-anchor="middle">对数据的约束</text>
  <text x="1010" y="372" font-size="13" fill="#33465B" text-anchor="middle">在企业、业务线、应用、用户等</text>
  <text x="1010" y="394" font-size="13" fill="#33465B" text-anchor="middle">不同层级设置数据量配额。</text>
  <line x1="850" y1="445" x2="792" y2="445" stroke="#5A6B7B" stroke-width="2.2" marker-end="url(#triLeftGray)"/>

  <!-- 对基础设施的约束 -->
  <text x="600" y="682" font-size="17" font-weight="bold" fill="#D9732D" text-anchor="middle">对基础设施的约束</text>
  <text x="600" y="708" font-size="13.5" fill="#33465B" text-anchor="middle">采购设备时纳入环境标准；</text>
  <text x="600" y="730" font-size="13.5" fill="#33465B" text-anchor="middle">限制服务器数量与虚拟机数量。</text>
  <line x1="600" y1="660" x2="600" y2="616" stroke="#E08A2E" stroke-width="3.5" marker-end="url(#upOrange)"/>
</svg>
