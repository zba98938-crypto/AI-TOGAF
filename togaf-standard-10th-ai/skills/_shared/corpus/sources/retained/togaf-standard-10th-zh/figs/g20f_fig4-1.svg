<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">架构全景的分级分类模型</text>
<g font-size="12" text-anchor="middle">
<rect x="180" y="45" width="500" height="55" rx="6" fill="#e8eef7" stroke="#5b7aa8"/><text x="430" y="68" font-weight="bold">企业战略架构</text><text x="430" y="88" font-size="10.5">高层全局视图，确立语境，防止意外后果</text>
<rect x="180" y="115" width="500" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="430" y="138" font-weight="bold">分段架构</text><text x="430" y="158" font-size="10.5">组合/项目群/产品层方向，按功能自然边界划分</text>
<rect x="180" y="185" width="500" height="55" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="430" y="208" font-weight="bold">能力架构</text><text x="430" y="228" font-size="10.5">业务能力增量的详细描述，可直接交给开发团队</text>
</g>
<g stroke="#888" stroke-width="1.2" fill="none"><path d="M160,72 H100 V212 H180"/><path d="M700,212 H760 V72 H680"/></g>
<text x="88" y="140" font-size="10" fill="#666" transform="rotate(-90 88 140)">自上而下：语境与约束</text>
<text x="772" y="140" font-size="10" fill="#666" transform="rotate(90 772 140)">自下而上：反馈与演进</text>
<text x="20" y="285" font-size="10.5" fill="#666">三个层级与业务/数据/应用/技术四个架构域正交：各域在每个层级都可能存在。</text>
</svg>
