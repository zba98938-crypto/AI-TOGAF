<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">安全作为横切关注点</text>
<g font-size="11.5" text-anchor="middle">
<rect x="30" y="60" width="150" height="60" fill="#eef3f8" stroke="#5b7aa8"/><text x="105" y="95">业务架构</text>
<rect x="200" y="60" width="150" height="60" fill="#eef3f8" stroke="#5b7aa8"/><text x="275" y="95">数据架构</text>
<rect x="370" y="60" width="150" height="60" fill="#eef3f8" stroke="#5b7aa8"/><text x="445" y="95">应用架构</text>
<rect x="540" y="60" width="150" height="60" fill="#eef3f8" stroke="#5b7aa8"/><text x="615" y="95">技术架构</text>
<rect x="710" y="60" width="120" height="60" fill="#eef3f8" stroke="#5b7aa8"/><text x="770" y="95">交付运营</text>
</g>
<rect x="30" y="160" width="800" height="50" rx="10" fill="#fdf3d8" stroke="#b09040"/>
<text x="430" y="190" font-size="12" text-anchor="middle">安全架构：安全 + 隐私 + 运营风险视角（视图、视角、制品）</text>
<g stroke="#b09040" stroke-width="1.2" stroke-dasharray="4 3"><path d="M105,160 V120"/><path d="M275,160 V120"/><path d="M445,160 V120"/><path d="M615,160 V120"/><path d="M770,160 V120"/></g>
<text x="20" y="260" font-size="10.5" fill="#666">安全不是独立数据集，而是贯穿各架构域的连贯视角集合；需在系统工程全生命周期尽早介入。</text>
</svg>
