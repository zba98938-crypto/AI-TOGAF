<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="420" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">DBRM 的四个域与十个核心要素</text>
<g font-size="11.5">
<rect x="30" y="50" width="200" height="330" rx="10" fill="#eef3f8" stroke="#5b7aa8"/>
<text x="130" y="78" text-anchor="middle" font-weight="bold">数字域（Digital）</text>
<rect x="50" y="95" width="160" height="60" rx="6" fill="#fff" stroke="#7a9ac0"/><text x="130" y="120" text-anchor="middle">客户聚焦</text><text x="130" y="138" text-anchor="middle" font-size="10">Customer Focus</text>
<rect x="50" y="170" width="160" height="60" rx="6" fill="#fff" stroke="#7a9ac0"/><text x="130" y="195" text-anchor="middle">数字企业</text><text x="130" y="213" text-anchor="middle" font-size="10">Digital Enterprise</text>
<rect x="250" y="50" width="220" height="330" rx="10" fill="#fdf3d8" stroke="#b09040"/>
<text x="360" y="78" text-anchor="middle" font-weight="bold">战略域（Strategy）</text>
<rect x="270" y="95" width="180" height="56" rx="6" fill="#fff" stroke="#c8a45a"/><text x="360" y="118" text-anchor="middle">战略语境</text><text x="360" y="136" text-anchor="middle" font-size="10">Strategic Context</text>
<rect x="270" y="165" width="180" height="56" rx="6" fill="#fff" stroke="#c8a45a"/><text x="360" y="188" text-anchor="middle">业务动机</text><text x="360" y="206" text-anchor="middle" font-size="10">Business Motivation</text>
<rect x="270" y="235" width="180" height="56" rx="6" fill="#fff" stroke="#c8a45a"/><text x="360" y="258" text-anchor="middle">业务服务与产品</text><text x="360" y="276" text-anchor="middle" font-size="10">Business Services &amp; Products</text>
<rect x="490" y="50" width="200" height="330" rx="10" fill="#e9f2e9" stroke="#5f8f5f"/>
<text x="590" y="78" text-anchor="middle" font-weight="bold">结构域（Structural）</text>
<rect x="510" y="95" width="160" height="56" rx="6" fill="#fff" stroke="#7aa07a"/><text x="590" y="118" text-anchor="middle">生态与业务模型</text><text x="590" y="136" text-anchor="middle" font-size="10">Ecosystem &amp; Business Model</text>
<rect x="510" y="165" width="160" height="56" rx="6" fill="#fff" stroke="#7aa07a"/><text x="590" y="188" text-anchor="middle">运营模式</text><text x="590" y="206" text-anchor="middle" font-size="10">Operating Model</text>
<rect x="510" y="235" width="160" height="56" rx="6" fill="#fff" stroke="#7aa07a"/><text x="590" y="258" text-anchor="middle">业务能力模型</text><text x="590" y="276" text-anchor="middle" font-size="10">Business Capability Model</text>
<rect x="710" y="50" width="170" height="330" rx="10" fill="#f7efe4" stroke="#b07a55"/>
<text x="795" y="78" text-anchor="middle" font-weight="bold">运营域（Operational）</text>
<rect x="728" y="95" width="134" height="76" rx="6" fill="#fff" stroke="#c08a68"/><text x="795" y="122" text-anchor="middle">业务运营环境</text><text x="795" y="140" text-anchor="middle" font-size="10">Business Operating</text><text x="795" y="154" text-anchor="middle" font-size="10">Environment</text>
<rect x="728" y="185" width="134" height="76" rx="6" fill="#fff" stroke="#c08a68"/><text x="795" y="212" text-anchor="middle">数字使能</text><text x="795" y="230" text-anchor="middle" font-size="10">Digital Enablement</text>
</g>
<text x="20" y="405" font-size="10.5" fill="#666">数字域=由外而内；战略域=为什么；结构域=是什么；运营域=怎么做。</text>
</svg>
