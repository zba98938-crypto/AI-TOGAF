<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="780" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">业务模型立方体（六面示意）</text>
<g stroke="#5b7aa8" stroke-width="1.4" fill="#eef3f8">
<path d="M200,80 L420,50 L640,80 L420,110 Z"/>
<path d="M200,80 L200,200 L420,230 L420,110 Z"/>
<path d="M640,80 L640,200 L420,230 L420,110 Z"/>
</g>
<g font-size="11.5" text-anchor="middle" fill="#222">
<text x="420" y="82">价值主张（顶面）</text>
<text x="300" y="160">客户 / 渠道</text>
<text x="540" y="160">资源 / 伙伴</text>
<text x="420" y="250">成本 / 收入</text>
</g>
<text x="20" y="285" font-size="11" fill="#666">立方体用六个面表达业务模型的不同维度，强调多维组合与动态演化。</text>
</svg>
