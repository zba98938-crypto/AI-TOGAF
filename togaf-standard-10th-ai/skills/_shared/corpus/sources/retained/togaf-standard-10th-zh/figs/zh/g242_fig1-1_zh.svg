<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="48" font-size="26" font-weight="bold" fill="#17334F" text-anchor="middle">全球年度产生的数据量</text>
  <text x="600" y="76" font-size="14" fill="#5A6B7B" text-anchor="middle">2010–2025 年 · 单位：泽字节（ZB）</text>

  <!-- 网格与坐标轴 -->
  <g stroke="#E1E7ED" stroke-width="1">
    <line x1="150" y1="140" x2="1145" y2="140"/>
    <line x1="150" y1="255" x2="1145" y2="255"/>
    <line x1="150" y1="370" x2="1145" y2="370"/>
    <line x1="150" y1="485" x2="1145" y2="485"/>
  </g>
  <line x1="150" y1="600" x2="1145" y2="600" stroke="#8FA3B8" stroke-width="1.5"/>
  <line x1="150" y1="140" x2="150" y2="600" stroke="#8FA3B8" stroke-width="1.5"/>

  <!-- 纵轴刻度 -->
  <g font-size="13" fill="#5A6B7B" text-anchor="end">
    <text x="136" y="605">0</text>
    <text x="136" y="490">50</text>
    <text x="136" y="375">100</text>
    <text x="136" y="260">150</text>
    <text x="136" y="145">200</text>
  </g>

  <text x="48" y="370" font-size="15" fill="#17334F" text-anchor="middle" transform="rotate(-90 48 370)">数据产生量（泽字节，ZB）</text>

  <!-- 柱状图：2010–2025，柱高按英文原图比例还原 -->
  <g fill="#3B6AD4">
    <rect x="160" y="595.4" width="42" height="4.6"/>
    <rect x="222" y="588.5" width="42" height="11.5"/>
    <rect x="285" y="585.1" width="42" height="14.9"/>
    <rect x="347" y="579.3" width="42" height="20.7"/>
    <rect x="409" y="571.3" width="42" height="28.7"/>
    <rect x="471" y="564.4" width="42" height="35.6"/>
    <rect x="533" y="558.6" width="42" height="41.4"/>
    <rect x="595" y="540.2" width="42" height="59.8"/>
    <rect x="657" y="524.1" width="42" height="75.9"/>
    <rect x="720" y="505.7" width="42" height="94.3"/>
    <rect x="782" y="452.8" width="42" height="147.2"/>
    <rect x="844" y="418.3" width="42" height="181.7"/>
    <rect x="906" y="376.9" width="42" height="223.1"/>
    <rect x="968" y="324" width="42" height="276"/>
    <rect x="1030" y="261.9" width="42" height="338.1"/>
    <rect x="1092" y="183.7" width="42" height="416.3"/>
  </g>

  <!-- 2025 年 181 ZB 标注 -->
  <rect x="1068" y="155" width="96" height="28" rx="5" fill="#FFFFFF" stroke="#C9D6E4"/>
  <text x="1116" y="175" font-size="15" font-weight="bold" fill="#17334F" text-anchor="middle">181 ZB</text>

  <!-- 横轴年份 -->
  <g font-size="12.5" fill="#5A6B7B" text-anchor="end">
    <text x="187" y="625" transform="rotate(-45 187 625)">2010</text>
    <text x="249" y="625" transform="rotate(-45 249 625)">2011</text>
    <text x="312" y="625" transform="rotate(-45 312 625)">2012</text>
    <text x="374" y="625" transform="rotate(-45 374 625)">2013</text>
    <text x="436" y="625" transform="rotate(-45 436 625)">2014</text>
    <text x="498" y="625" transform="rotate(-45 498 625)">2015</text>
    <text x="560" y="625" transform="rotate(-45 560 625)">2016</text>
    <text x="622" y="625" transform="rotate(-45 622 625)">2017</text>
    <text x="684" y="625" transform="rotate(-45 684 625)">2018*</text>
    <text x="747" y="625" transform="rotate(-45 747 625)">2019*</text>
    <text x="809" y="625" transform="rotate(-45 809 625)">2020*</text>
    <text x="871" y="625" transform="rotate(-45 871 625)">2021*</text>
    <text x="933" y="625" transform="rotate(-45 933 625)">2022*</text>
    <text x="995" y="625" transform="rotate(-45 995 625)">2023*</text>
    <text x="1057" y="625" transform="rotate(-45 1057 625)">2024*</text>
    <text x="1119" y="625" transform="rotate(-45 1119 625)">2025*</text>
  </g>

  <text x="647" y="714" font-size="15" fill="#17334F" text-anchor="middle">年份</text>
</svg>
