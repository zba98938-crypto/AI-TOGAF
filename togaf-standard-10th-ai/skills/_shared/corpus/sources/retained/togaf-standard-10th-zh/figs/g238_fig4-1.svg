<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="500" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">利益相关者借助 BI 与分析能力追求的目标（17 项）</text>
<g font-size="11">
<g fill="#eef3f8" stroke="#5b7aa8">
<rect x="30" y="50" width="270" height="34"/><rect x="310" y="50" width="270" height="34"/><rect x="590" y="50" width="280" height="34"/>
<rect x="30" y="92" width="270" height="34"/><rect x="310" y="92" width="270" height="34"/><rect x="590" y="92" width="280" height="34"/>
<rect x="30" y="134" width="270" height="34"/><rect x="310" y="134" width="270" height="34"/><rect x="590" y="134" width="280" height="34"/>
<rect x="30" y="176" width="270" height="34"/><rect x="310" y="176" width="270" height="34"/><rect x="590" y="176" width="280" height="34"/>
<rect x="30" y="218" width="270" height="34"/><rect x="310" y="218" width="270" height="34"/><rect x="590" y="218" width="280" height="34"/>
<rect x="30" y="260" width="270" height="34"/><rect x="310" y="260" width="270" height="34"/>
</g>
<g fill="#222">
<text x="42" y="72">1 合规（隐私、偿付能力 II 等）</text><text x="322" y="72">2 安全：数据分级与加密</text><text x="602" y="72">3 安全：防泄露</text>
<text x="42" y="114">4 安全：身份与访问管理</text><text x="322" y="114">5 安全：基础设施基线</text><text x="602" y="114">6 数据质量受控</text>
<text x="42" y="156">7 数据民主化使用</text><text x="322" y="156">8 保证服务质量</text><text x="602" y="156">9 提升客户/伙伴满意度</text>
<text x="42" y="198">10 提升运营效率</text><text x="322" y="198">11 利用创新机会</text><text x="602" y="198">12 降低总拥有成本</text>
<text x="42" y="240">13 缩短用例上市时间</text><text x="322" y="240">14 数据作为资产（含元数据）</text><text x="602" y="240">15 借助新数据能力创造业务价值</text>
<text x="42" y="282">16 系统间互操作</text><text x="322" y="282">17 支撑数字与数据创新</text>
</g>
<text x="20" y="340" font-size="10.5" fill="#666">每项目标均有对应 KPI（如隐私标记数据集数量、数据泄露次数、NPS、每用户成本、API 数量等）。</text>
<text x="20" y="370" font-size="10.5" fill="#666">目标通过利益相关者（CDO、数据管理者、架构师、业务用户等）与能力功能之间的实现关系达成。</text>
</g>
</svg>
