<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">C-MDM 的三种集成风格</text>
<g font-size="10.5" text-anchor="middle">
<rect x="30" y="55" width="260" height="180" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="160" y="80" font-weight="bold">整合式（下游 MDM）</text>
<text x="160" y="108">各系统保留自己的数据</text><text x="160" y="130">更新推送至 MDM 中心整合</text><text x="160" y="152">不影响运营系统，最易实施</text><text x="160" y="174">无单一事实来源，难以提升质量</text>
<rect x="310" y="55" width="260" height="180" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="440" y="80" font-weight="bold">协作式</text>
<text x="440" y="108">各系统保留自己的数据</text><text x="440" y="130">MDM 整合后把新版本真相</text><text x="440" y="152">按客户 ID 同步回各系统</text><text x="440" y="174">可高水平控制质量与治理</text>
<rect x="590" y="55" width="260" height="180" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="720" y="80" font-weight="bold">集中式</text>
<text x="720" y="108">仅 MDM 存储主数据</text><text x="720" y="130">所有系统从 MDM 获取</text><text x="720" y="152">更新与创建经 MDM 发起</text><text x="720" y="174">最简、最高效，但迁移成本高</text>
</g>
</svg>
