<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="330" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">C-MDM 能力的功能构成</text>
<g font-size="11" text-anchor="middle">
<rect x="350" y="50" width="180" height="50" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="440" y="80">客户主数据管理</text>
<rect x="30" y="140" width="150" height="60" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="105" y="165">数据获取</text><text x="105" y="183" font-size="10">采集/接口/批量</text>
<rect x="200" y="140" width="150" height="60" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="275" y="165">数据质量</text><text x="275" y="183" font-size="10">清洗/匹配/去重</text>
<rect x="370" y="140" width="150" height="60" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="445" y="165">数据治理</text><text x="445" y="183" font-size="10">stewardship/规则</text>
<rect x="540" y="140" width="150" height="60" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="615" y="165">数据服务</text><text x="615" y="183" font-size="10">API/分发/订阅</text>
<rect x="710" y="140" width="140" height="60" rx="6" fill="#f2ecf7" stroke="#806a9e"/><text x="780" y="165">安全与合规</text><text x="780" y="183" font-size="10">访问/隐私/审计</text>
<rect x="200" y="240" width="150" height="55" rx="6" fill="#fff" stroke="#888"/><text x="275" y="263">度量与价值</text><text x="275" y="280" font-size="10">质量指标/业务价值</text>
<rect x="370" y="240" width="150" height="55" rx="6" fill="#fff" stroke="#888"/><text x="445" y="263">参考数据</text><text x="445" y="280" font-size="10">代码表/值列表</text>
<rect x="540" y="240" width="150" height="55" rx="6" fill="#fff" stroke="#888"/><text x="615" y="263">客户关系</text><text x="615" y="280" font-size="10">层级/关联/合并</text>
</g>
<g stroke="#888" stroke-width="1" fill="none"><path d="M440,100 V120"/><path d="M105,110 H780 V140"/><path d="M440,120 V140"/><path d="M275,200 V240"/><path d="M445,200 V240"/><path d="M615,200 V240"/></g>
<text x="20" y="320" font-size="10.5" fill="#666">内核客户数据：标识键、个人识别数据、联系方式、偏好与同意、客户关系；须业务线无关、独立解耦。</text>
</svg>
