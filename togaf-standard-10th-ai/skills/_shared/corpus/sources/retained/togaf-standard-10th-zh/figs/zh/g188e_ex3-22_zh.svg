<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <defs>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#6B7C8C"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FFFFFF"/>
  <text x="40" y="32" font-size="19" font-weight="bold" fill="#1F4E79">示例 3-22　项目 A 的工作分解结构（WBS）</text>
  <text x="40" y="54" font-size="12" fill="#5A6B7B">按交付物分解：项目 → 分支工作包 → 可交付成果</text>

  <!-- 连线 -->
  <g stroke="#6B7C8C" stroke-width="1.5" fill="none">
    <path d="M600,132 V160"/>
    <path d="M145,160 H1057"/>
    <path d="M145,160 V180" marker-end="url(#aw)"/>
    <path d="M373,160 V180" marker-end="url(#aw)"/>
    <path d="M601,160 V180" marker-end="url(#aw)"/>
    <path d="M829,160 V180" marker-end="url(#aw)"/>
    <path d="M1057,160 V180" marker-end="url(#aw)"/>
    <path d="M145,246 V543"/>
    <path d="M373,246 V543"/>
    <path d="M601,246 V453"/>
    <path d="M829,246 V543"/>
    <path d="M1057,246 V543"/>
    <path d="M145,323 H40" marker-end="url(#aw)"/>
    <path d="M145,433 H40" marker-end="url(#aw)"/>
    <path d="M145,543 H40" marker-end="url(#aw)"/>
    <path d="M373,323 H268" marker-end="url(#aw)"/>
    <path d="M373,433 H268" marker-end="url(#aw)"/>
    <path d="M373,543 H268" marker-end="url(#aw)"/>
    <path d="M601,323 H496" marker-end="url(#aw)"/>
    <path d="M601,433 H496" marker-end="url(#aw)"/>
    <path d="M829,323 H724" marker-end="url(#aw)"/>
    <path d="M829,433 H724" marker-end="url(#aw)"/>
    <path d="M829,543 H724" marker-end="url(#aw)"/>
    <path d="M1057,323 H952" marker-end="url(#aw)"/>
    <path d="M1057,433 H952" marker-end="url(#aw)"/>
    <path d="M1057,543 H952" marker-end="url(#aw)"/>
  </g>

  <!-- 根节点 -->
  <rect x="400" y="64" width="400" height="68" rx="4" fill="#5A6B7B" stroke="#3E4E5C" stroke-width="1.5"/>
  <text x="600" y="93" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#FFFFFF">评估当前应用组合</text>
  <text x="600" y="115" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#FFFFFF">并提出改进选项</text>

  <!-- 分支标题 -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <rect x="40" y="180" width="210" height="66" rx="3" fill="#5A6B7B" stroke="#3E4E5C"/>
    <text x="145" y="209">项目管理</text>
    <text x="145" y="229" font-size="10.5" font-weight="normal" fill="#E6EBF0">规划 / 监控 / 报告</text>

    <rect x="268" y="180" width="210" height="66" rx="3" fill="#5A6B7B" stroke="#3E4E5C"/>
    <text x="373" y="205">应用间的关系</text>
    <text x="373" y="225">与数据流</text>

    <rect x="496" y="180" width="210" height="66" rx="3" fill="#5A6B7B" stroke="#3E4E5C"/>
    <text x="601" y="209">映射应用能力</text>
    <text x="601" y="229" font-size="10.5" font-weight="normal" fill="#E6EBF0">重叠与缺口分析</text>

    <rect x="724" y="180" width="210" height="66" rx="3" fill="#5A6B7B" stroke="#3E4E5C"/>
    <text x="829" y="209">关键观察</text>
    <text x="829" y="229" font-size="10.5" font-weight="normal" fill="#E6EBF0">约束、关系、能力</text>

    <rect x="952" y="180" width="210" height="66" rx="3" fill="#5A6B7B" stroke="#3E4E5C"/>
    <text x="1057" y="209">改进建议</text>
    <text x="1057" y="229" font-size="10.5" font-weight="normal" fill="#E6EBF0">举措、优先级、路线图</text>
  </g>

  <!-- 交付物 -->
  <g font-size="12.5" text-anchor="middle" fill="#1F3448">
    <rect x="40" y="280" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="145" y="318">规划</text>
    <text x="145" y="338" font-size="10.5" fill="#5A6B7B">项目计划与进度</text>

    <rect x="40" y="390" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="145" y="428">监控与控制</text>
    <text x="145" y="448" font-size="10.5" fill="#5A6B7B">状态、变更、纠偏</text>

    <rect x="40" y="500" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="145" y="538">报告与行政</text>
    <text x="145" y="558" font-size="10.5" fill="#5A6B7B">汇报、归档、治理</text>

    <rect x="268" y="280" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="373" y="318">确认应用清单</text>
    <text x="373" y="338" font-size="10.5" fill="#5A6B7B">范围基线</text>

    <rect x="268" y="390" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="373" y="428">分析应用间关系</text>
    <text x="373" y="448" font-size="10.5" fill="#5A6B7B">接口与依赖</text>

    <rect x="268" y="500" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="373" y="538">分析应用间数据流</text>
    <text x="373" y="558" font-size="10.5" fill="#5A6B7B">数据走向与集成</text>

    <rect x="496" y="280" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="601" y="318">识别应用间重叠</text>
    <text x="601" y="338" font-size="10.5" fill="#5A6B7B">重复能力</text>

    <rect x="496" y="390" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="601" y="428">识别应用缺口</text>
    <text x="601" y="448" font-size="10.5" fill="#5A6B7B">能力空白</text>

    <rect x="724" y="280" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="829" y="318">识别关键技术约束</text>
    <text x="829" y="338" font-size="10.5" fill="#5A6B7B">平台、合规、标准</text>

    <rect x="724" y="390" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="829" y="428">应用关系观察</text>
    <text x="829" y="448" font-size="10.5" fill="#5A6B7B">耦合与风险</text>

    <rect x="724" y="500" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="829" y="538">应用能力映射观察</text>
    <text x="829" y="558" font-size="10.5" fill="#5A6B7B">能力覆盖情况</text>

    <rect x="952" y="280" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="1057" y="318">识别改进建议</text>
    <text x="1057" y="338" font-size="10.5" fill="#5A6B7B">选项与依据</text>

    <rect x="952" y="390" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="1057" y="424">识别举措并</text>
    <text x="1057" y="444">排定优先级</text>

    <rect x="952" y="500" width="210" height="86" rx="3" fill="#F4F7FA" stroke="#8A9BB0"/>
    <text x="1057" y="538">编制举措路线图</text>
    <text x="1057" y="558" font-size="10.5" fill="#5A6B7B">时序与依赖</text>
  </g>

  <rect x="40" y="612" width="1120" height="1" fill="#D5DEE7"/>
  <text x="40" y="636" font-size="11" fill="#5A6B7B">注：原图中“映射应用能力”分支仅列 2 项交付物（重叠、缺口），本图按原结构保留。</text>
</svg>
