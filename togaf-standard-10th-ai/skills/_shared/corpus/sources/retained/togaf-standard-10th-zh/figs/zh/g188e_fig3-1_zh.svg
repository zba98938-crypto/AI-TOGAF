<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5A6A"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="19" font-weight="bold" fill="#1F4E79">图 3-1　架构项目管理生命周期</text>
  <text x="40" y="56" font-size="12" fill="#5A6B7B">项目级流程（左）与阶段级循环（右）；阶段循环重复 n 次</text>

  <!-- 左侧：项目级 -->
  <g>
    <rect x="40" y="76" width="360" height="64" rx="4" fill="#DCE9F5" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="220" y="104" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#12395C">架构项目启动</text>
    <text x="220" y="125" text-anchor="middle" font-size="11" fill="#41566B">立项、任命、任务书、启动</text>

    <rect x="40" y="182" width="360" height="64" rx="4" fill="#DCE9F5" stroke="#1F4E79" stroke-width="1.6"/>
    <text x="220" y="210" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#12395C">架构项目规划</text>
    <text x="220" y="231" text-anchor="middle" font-size="11" fill="#41566B">范围、WBS、进度、资源与治理</text>

    <rect x="40" y="330" width="360" height="64" rx="4" fill="#E9EEF3" stroke="#4A5A6A" stroke-width="1.6"/>
    <text x="220" y="358" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#25384A">架构项目收尾</text>
    <text x="220" y="379" text-anchor="middle" font-size="11" fill="#41566B">移交、收尾报告、评估与经验教训</text>
  </g>

  <!-- 右侧：阶段级 -->
  <g>
    <rect x="560" y="76" width="400" height="64" rx="4" fill="#1F4E79" stroke="#12395C" stroke-width="1.4"/>
    <text x="760" y="104" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#FFFFFF">阶段规划</text>
    <text x="760" y="125" text-anchor="middle" font-size="11" fill="#D6E4F0">确定本阶段产品、活动、风险与进度</text>

    <rect x="560" y="182" width="400" height="64" rx="4" fill="#2E6B96" stroke="#1B4B6B" stroke-width="1.4"/>
    <text x="760" y="210" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#FFFFFF">执行、监控与控制阶段</text>
    <text x="760" y="231" text-anchor="middle" font-size="11" fill="#D6E4F0">工作包授权、状态评审、例外与纠偏</text>

    <rect x="560" y="288" width="400" height="64" rx="4" fill="#1F4E79" stroke="#12395C" stroke-width="1.4"/>
    <text x="760" y="316" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#FFFFFF">阶段收尾</text>
    <text x="760" y="337" text-anchor="middle" font-size="11" fill="#D6E4F0">报告阶段结束、获取下一阶段授权</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#4A5A6A" stroke-width="1.8" fill="none">
    <path d="M220,140 V182" marker-end="url(#ar)"/>
    <path d="M400,214 H560" marker-end="url(#ar)"/>
    <path d="M760,140 V182" marker-end="url(#ar)"/>
    <path d="M760,246 V288" marker-end="url(#ar)"/>
    <path d="M560,320 H480 V362 H400" marker-end="url(#ar)"/>
  </g>

  <!-- 阶段循环 -->
  <g stroke="#7A8B9B" stroke-width="1.8" fill="none">
    <path d="M960,320 H1042 V108 H960" marker-end="url(#ar)"/>
  </g>
  <text x="1054" y="218" font-size="17" font-style="italic" fill="#25384A">n</text>
  <text x="1054" y="238" font-size="10.5" fill="#5A6B7B">次</text>

  <!-- 说明 -->
  <rect x="40" y="410" width="1120" height="1" fill="#D5DEE7"/>
  <text x="40" y="432" font-size="11" fill="#5A6B7B">说明：项目启动与项目规划为一次性活动；阶段规划—执行监控—收尾构成循环，直至最后一个阶段结束，再进入项目收尾。</text>
</svg>
