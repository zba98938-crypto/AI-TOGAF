<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="740" fill="#ffffff"/>

  <defs>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3E8E5B"/>
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6A4C93"/>
    </marker>
  </defs>

  <!-- 自上而下方法 -->
  <rect x="30" y="35" width="360" height="590" rx="18" fill="#F5FAF6" stroke="#4CAF50" stroke-width="2"/>
  <text x="210" y="80" font-size="21" font-weight="bold" fill="#3E8E5B" text-anchor="middle">自上而下</text>
  <text x="210" y="110" font-size="16" fill="#3E8E5B" text-anchor="middle">基于业务用途的方法</text>

  <g font-size="13.5" fill="#2F4A3A">
    <circle cx="58" cy="180" r="3.5" fill="#4CAF50"/>
    <text x="72" y="178">从业务出发，理解系统</text>
    <text x="72" y="200">真实的业务用途</text>

    <circle cx="58" cy="248" r="3.5" fill="#4CAF50"/>
    <text x="72" y="246">识别哪些业务用途</text>
    <text x="72" y="268">对数字技术至关重要</text>

    <circle cx="58" cy="330" r="3.5" fill="#4CAF50"/>
    <text x="72" y="326">识别可“数字放弃”的用例模式，</text>
    <text x="72" y="348">写入架构存储库作为标准或原则。</text>
  </g>

  <!-- 自上而下箭头 -->
  <line x1="405" y1="48" x2="405" y2="632" stroke="#4CAF50" stroke-width="7" marker-end="url(#greenArrow)"/>

  <!-- 中间架构层 -->
  <g text-anchor="middle">
    <rect x="430" y="42" width="420" height="150" rx="4" fill="#FFFFFF" stroke="#17334F" stroke-width="1.8"/>
    <text x="640" y="122" font-size="19" font-weight="bold" fill="#17334F">调整业务架构</text>

    <rect x="430" y="212" width="420" height="190" rx="4" fill="#FFFFFF" stroke="#17334F" stroke-width="1.8"/>
    <text x="640" y="288" font-size="19" font-weight="bold" fill="#17334F">调整应用架构</text>
    <text x="640" y="320" font-size="14.5" fill="#33465B">软件选择、开发、数据管理</text>

    <rect x="430" y="422" width="420" height="190" rx="4" fill="#FFFFFF" stroke="#17334F" stroke-width="1.8"/>
    <text x="640" y="498" font-size="19" font-weight="bold" fill="#17334F">调整技术架构</text>
    <text x="640" y="530" font-size="14.5" fill="#33465B">服务器、终端、网络设备</text>
  </g>

  <!-- 自下而上箭头 -->
  <line x1="875" y1="632" x2="875" y2="48" stroke="#6A4C93" stroke-width="7" marker-end="url(#purpleArrow)"/>

  <!-- 自下而上方法 -->
  <rect x="910" y="35" width="260" height="590" rx="18" fill="#F8F5FB" stroke="#6A4C93" stroke-width="2"/>
  <text x="1040" y="80" font-size="21" font-weight="bold" fill="#6A4C93" text-anchor="middle">自下而上</text>
  <text x="1040" y="110" font-size="16" fill="#6A4C93" text-anchor="middle">基于基础设施的方法</text>

  <g font-size="13.5" fill="#3D3350">
    <circle cx="938" cy="180" r="3.5" fill="#6A4C93"/>
    <text x="952" y="178">识别环境影响</text>
    <text x="952" y="200">最大的设备</text>

    <circle cx="938" cy="248" r="3.5" fill="#6A4C93"/>
    <text x="952" y="246">识别可从环境角度</text>
    <text x="952" y="268">淘汰或改进的设备</text>

    <circle cx="938" cy="336" r="3.5" fill="#6A4C93"/>
    <text x="952" y="326">识别设备层面可“数字放弃”</text>
    <text x="952" y="348">或优化的模式，写入架构</text>
    <text x="952" y="370">存储库，作为标准或原则。</text>
  </g>

  <!-- 汇合结果 -->
  <rect x="30" y="655" width="1140" height="52" rx="3" fill="#F2F4F6" stroke="#5A6B7B" stroke-width="1.6"/>
  <text x="600" y="688" font-size="17" font-weight="bold" fill="#17334F" text-anchor="middle">识别数字放弃或优化的模式</text>
</svg>
