<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="460" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">安全与风险核心概念在 TOGAF ADM 中的位置</text>
<g font-size="10.5">
<rect x="20" y="50" width="270" height="360" rx="8" fill="#eef3f8" stroke="#5b7aa8"/>
<text x="40" y="74" font-weight="bold">TOGAF ADM 阶段</text>
<text x="40" y="104">预备：安全原则、风险偏好、业务驱动</text>
<text x="40" y="132">A 愿景：安全蓝图、利益相关者关注</text>
<text x="40" y="160">B 业务架构：安全策略架构、安全域模型、信任框架、风险评估</text>
<text x="40" y="196">C 信息系统架构：安全服务目录、控制目标、数据质量</text>
<text x="40" y="232">D 技术架构：安全标准、安全分类</text>
<text x="40" y="268">E 机会与方案：安全资源计划、安全培训</text>
<text x="40" y="304">F 迁移规划：安全度量、迁移安全要求</text>
<text x="40" y="340">G 实施治理：安全审计、合规审查</text>
<text x="40" y="376">H 变更管理：安全事件、持续监控</text>
<rect x="310" y="50" width="280" height="360" rx="8" fill="#fdf3d8" stroke="#b09040"/>
<text x="330" y="74" font-weight="bold">ISM / ERM 核心概念</text>
<text x="330" y="104">· 业务驱动 / 业务目标</text>
<text x="330" y="130">· 安全原则 / 风险偏好</text>
<text x="330" y="156">· 关键风险领域 / 业务影响分析</text>
<text x="330" y="182">· 业务风险模型 / 风险登记册</text>
<text x="330" y="208">· 安全策略架构</text>
<text x="330" y="234">· 安全域模型 / 信任框架</text>
<text x="330" y="260">· 业务属性画像</text>
<text x="330" y="286">· 控制目标 / 安全目标</text>
<text x="330" y="312">· 安全服务目录</text>
<text x="330" y="338">· 安全分类 / 安全标准</text>
<text x="330" y="364">· 安全审计 / 培训与意识</text>
<rect x="610" y="50" width="270" height="360" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/>
<text x="630" y="74" font-weight="bold">企业安全架构产出</text>
<text x="630" y="104">· 安全蓝图与视图</text>
<text x="630" y="130">· 安全需求与合规映射</text>
<text x="630" y="156">· 风险登记册与处置计划</text>
<text x="630" y="182">· 安全服务目录与标准</text>
<text x="630" y="208">· 控制措施与审计证据</text>
<text x="630" y="234">· 安全度量与 KPI</text>
<text x="630" y="260">· 隐私与数据保护要求</text>
<text x="630" y="286">· 供应链与第三方风险</text>
<text x="630" y="312">· 事件与业务连续性</text>
<text x="630" y="338">· 架构合规性审查记录</text>
</g>
<text x="20" y="440" font-size="10.5" fill="#666">安全是贯穿全架构的横切关注点：每个 ADM 阶段都消费/产出相应安全与风险制品。</text>
</svg>
