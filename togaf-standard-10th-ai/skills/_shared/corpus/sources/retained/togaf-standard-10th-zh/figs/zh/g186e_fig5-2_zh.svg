    <g transform="translate(159,608)"><circle cx="4" cy="4" r="3"/><circle cx="12" cy="4" r="3"/><circle cx="8" cy="12" r="3"/><path d="M6.5 6 L9.5 10 M10 6 L7 10" fill="none"/></g>
    <g transform="translate(159,636)"><circle cx="4" cy="4" r="3"/><circle cx="12" cy="4" r="3"/><circle cx="8" cy="12" r="3"/><path d="M6.5 6 L9.5 10 M10 6 L7 10" fill="none"/></g>
    <g transform="translate(79,664)"><circle cx="4" cy="4" r="3"/><circle cx="12" cy="4" r="3"/><circle cx="8" cy="12" r="3"/><path d="M6.5 6 L9.5 10 M10 6 L7 10" fill="none"/></g>
  </g>

  <!-- 图标：组件 -->
  <g fill="#C0392B">
    <g transform="translate(79,142)"><circle cx="3" cy="3" r="2.6"/><circle cx="11" cy="2" r="2.6"/><circle cx="7" cy="10" r="2.6"/></g>
    <g transform="translate(119,400)"><circle cx="3" cy="3" r="2.6"/><circle cx="11" cy="2" r="2.6"/><circle cx="7" cy="10" r="2.6"/></g>
