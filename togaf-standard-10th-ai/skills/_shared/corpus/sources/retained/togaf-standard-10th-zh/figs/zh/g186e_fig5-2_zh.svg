  <g fill="#E3EEE3" stroke="#2F4B73" stroke-width="1">
    <g transform="translate(79,220)"><rect x="0" y="0" width="14" height="11"/><path d="M2 2 L12 9 M12 2 L2 9" fill="none"/></g>
