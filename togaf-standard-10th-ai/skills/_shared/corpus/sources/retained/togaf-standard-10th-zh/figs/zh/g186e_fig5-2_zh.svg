  </g>
  <!-- 图标：图 -->
  <g fill="#E6EBF6" stroke="#2F4B73" stroke-width="1">
    <g transform="translate(79,248)"><rect x="0" y="0" width="14" height="11"/><circle cx="4" cy="4" r="1.4"/><circle cx="10" cy="7" r="1.4"/><path d="M5 4.6 L9 6.4" fill="none"/></g>
    <g transform="translate(119,506)"><rect x="0" y="0" width="14" height="11"/><circle cx="4" cy="4" r="1.4"/><circle cx="10" cy="7" r="1.4"/><path d="M5 4.6 L9 6.4" fill="none"/></g>
  </g>
