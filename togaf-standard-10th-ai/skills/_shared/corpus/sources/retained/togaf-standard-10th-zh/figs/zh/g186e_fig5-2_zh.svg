  </g>
  <!-- 图标：图表 -->
  <g stroke="#2F4B73" stroke-width="2" stroke-linecap="round">
    <g transform="translate(79,302)"><path d="M1 12 V7 M5 12 V2 M9 12 V5 M13 12 V0"/><path d="M0 12 H14" stroke-width="1"/></g>
    <g transform="translate(119,560)"><path d="M1 12 V7 M5 12 V2 M9 12 V5 M13 12 V0"/><path d="M0 12 H14" stroke-width="1"/></g>
  </g>

  <!-- 文本 -->
  <g font-size="13.5" fill="#22303F">
    <text x="82" y="115" font-weight="bold" fill="#1F3864">奥斯汀工作坊架构</text>
    <text x="117" y="143">组件</text>
    <text x="117" y="171">连接</text>
    <text x="117" y="199">目录</text>
    <text x="117" y="227">矩阵</text>
    <text x="117" y="255">图</text>
    <text x="117" y="283">三维视图</text>
    <text x="117" y="311">图表</text>
    <text x="117" y="339" font-weight="bold" fill="#7A5611">奥斯汀工作坊候选</text>
    <text x="117" y="367" font-weight="bold" fill="#1F3864">奥斯汀工作坊目标</text>
    <text x="157" y="395">组件</text>
    <text x="157" y="423">连接</text>
    <text x="157" y="451">目录</text>
    <text x="157" y="479">矩阵</text>
    <text x="157" y="507">图</text>
    <text x="157" y="535">三维视图</text>
    <text x="157" y="563">图表</text>
    <text x="197" y="591" fill="#1E5F5B">奥斯汀工作坊年度过渡（本年度）</text>
    <text x="197" y="619" fill="#1E5F5B">奥斯汀工作坊年度过渡（下一年度）</text>
    <text x="197" y="647" fill="#1E5F5B">奥斯汀工作坊过渡</text>
    <text x="117" y="675" font-weight="bold" fill="#3B4654">奥斯汀工作坊现状</text>
  </g>

  <!-- 右侧图例 -->
  <rect x="700" y="90" width="460" height="300" rx="8" fill="#F7F9FC" stroke="#C2CDDB"/>
  <text x="722" y="120" font-size="14" font-weight="bold" fill="#1F3864">四种状态</text>
  <g>
    <rect x="722" y="138" width="14" height="14" rx="3" fill="#FDF2DA" stroke="#D9A441"/>
    <text x="746" y="150" font-size="12.5" font-weight="bold" fill="#22303F">候选</text>
    <text x="790" y="150" font-size="11.5" fill="#5B6B7E">EA 团队已开发、尚未批准到足以治理变更</text>
    <rect x="722" y="186" width="14" height="14" rx="3" fill="#E6EEFB" stroke="#3A6EA5"/>
    <text x="746" y="198" font-size="12.5" font-weight="bold" fill="#22303F">目标</text>
    <text x="790" y="198" font-size="11.5" fill="#5B6B7E">利益相关者已批准；治理变更活动的参照</text>
    <rect x="722" y="234" width="14" height="14" rx="3" fill="#E2F1F0" stroke="#2F8F8A"/>
    <text x="746" y="246" font-size="12.5" font-weight="bold" fill="#22303F">过渡</text>
    <text x="790" y="246" font-size="11.5" fill="#5B6B7E">现状与目标之间部分实现的状态</text>
    <rect x="722" y="282" width="14" height="14" rx="3" fill="#ECEFF3" stroke="#6B7785"/>
    <text x="746" y="294" font-size="12.5" font-weight="bold" fill="#22303F">现状</text>
    <text x="790" y="294" font-size="11.5" fill="#5B6B7E">企业今天存在的状态；所有差距分析的基线</text>
    <text x="722" y="350" font-size="11.5" fill="#5B6B7E">每个状态都含七类视角：组件、连接、目录、矩阵、图、三维视图与图表。</text>
    <text x="722" y="370" font-size="11.5" fill="#5B6B7E">“−”表示已展开，“+”表示可展开。</text>
  </g>

  <rect x="700" y="410" width="460" height="170" rx="8" fill="#FDFDFB" stroke="#D5CDBC"/>
  <text x="722" y="440" font-size="14" font-weight="bold" fill="#1F3864">读图提示</text>
  <g fill="#33475B" font-size="11.5">
    <circle cx="726" cy="462" r="2.4" fill="#2F4B73"/>
    <text x="738" y="466">公用现状定期更新，是所有差距分析的基线。</text>
    <circle cx="726" cy="492" r="2.4" fill="#2F4B73"/>
    <text x="738" y="496">架构项目结束时，其架构描述并入合并目标状态。</text>
    <circle cx="726" cy="522" r="2.4" fill="#2F4B73"/>
    <text x="738" y="526">开发中的项目各有独立容器，探索候选不影响他人。</text>
    <text x="722" y="558" font-size="11" fill="#5B6B7E">原图根节点为“奥斯汀工作坊架构”，其下依次为候选、目标与现状。</text>
  </g>
</svg>
