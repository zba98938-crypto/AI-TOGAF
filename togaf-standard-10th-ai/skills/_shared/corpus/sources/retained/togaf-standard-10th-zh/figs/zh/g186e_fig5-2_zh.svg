    <g transform="translate(119,390)"><circle cx="4" cy="4" r="3"/><circle cx="12" cy="4" r="3"/><circle cx="8" cy="12" r="3"/><path d="M6.5 6 L9.5 10 M10 6 L7 10" fill="none"/></g>
