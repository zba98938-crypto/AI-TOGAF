  <g fill="none" stroke="#5B3F8C" stroke-width="1.6">
    <path d="M80 168 L88 174 L80 180 Z" fill="#8E7CC3"/>
    <path d="M120 426 L128 432 L120 438 Z" fill="#8E7CC3"/>
