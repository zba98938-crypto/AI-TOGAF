  <path d="M1002,556 C970,580 950,592 900,596 L450,596 C420,596 416,560 416,500 L416,340 L448,340" fill="none" stroke="#0B7F9E" stroke-width="2.2" marker-end="url(#arwTeal)"/>
  <rect x="560" y="620" width="300" height="84" fill="#E8A33D"/>
  <g text-anchor="middle" font-size="13.5" fill="#2B1C07">
    <text x="710" y="648">新需求</text>
    <text x="710" y="670">变革管理</text>
    <text x="710" y="692">持续治理</text>
  </g>

  <!-- 发布路线图 -->
  <g>
    <polygon points="100,500 140,478 270,478 230,500" fill="#F2A93B"/>
    <polygon points="100,500 230,500 230,535 100,535" fill="#E08A2A"/>
    <polygon points="230,500 270,478 270,513 230,535" fill="#C97A24"/>

    <polygon points="100,552 140,530 270,530 230,552" fill="#2E8FB8"/>
    <polygon points="100,552 230,552 230,587 100,587" fill="#1F7196"/>
    <polygon points="230,552 270,530 270,565 230,587" fill="#175A79"/>

    <polygon points="100,604 140,582 270,582 230,604" fill="#9AA3A8"/>
    <polygon points="100,604 230,604 230,639 100,639" fill="#7D868B"/>
    <polygon points="230,604 270,582 270,617 230,639" fill="#626B70"/>
