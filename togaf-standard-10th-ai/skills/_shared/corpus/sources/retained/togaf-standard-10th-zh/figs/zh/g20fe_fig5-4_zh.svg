    <path d="M282,480 H290 V535 H282"/>
    <path d="M282,532 H290 V587 H282"/>
    <path d="M282,584 H290 V639 H282"/>
  </g>
  <g font-size="12" fill="#33475B">
    <text x="302" y="503">高业务价值</text>
    <text x="302" y="519">关键特性</text>
