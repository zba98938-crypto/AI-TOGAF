  <path d="M762 268 A68,68 0 1 1 838 324" fill="none" stroke="#0D9AD4" stroke-width="4" marker-end="url(#arwBlue)"/>
  <text x="800" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D6F92">两周</text>

  <path d="M886 178 A36,36 0 1 1 954 210" fill="none" stroke="#0D9AD4" stroke-width="3" marker-end="url(#arwBlue)"/>
