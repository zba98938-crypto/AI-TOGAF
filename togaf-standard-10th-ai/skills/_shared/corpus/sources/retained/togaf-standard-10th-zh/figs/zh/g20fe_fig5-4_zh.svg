  <rect width="1200" height="780" fill="#ffffff"/>
  <title>图 5-4　架构支撑产品与冲刺待办列表定义（中文重绘）</title>

  <text x="30" y="36" font-size="21" font-weight="bold" fill="#0B6E8F">架构支撑产品与冲刺待办列表定义</text>

  <!-- 左侧：冲刺交付内容 -->
  <rect x="24" y="60" width="330" height="384" rx="24" fill="#0D9AD4"/>
  <text x="44" y="96" font-size="15.5" font-weight="bold" fill="#ffffff">冲刺——架构迭代</text>
  <text x="44" y="120" font-size="15.5" font-weight="bold" fill="#ffffff">应交付：</text>
  <g font-size="13" fill="#ffffff">
    <text x="42" y="158">-</text><text x="60" y="158">特性</text>
    <text x="42" y="188">-</text><text x="60" y="188">需求</text>
    <text x="42" y="218">-</text><text x="60" y="218">增强</text>
    <text x="42" y="248">-</text><text x="60" y="248">缺陷修复（技术债务）</text>
    <text x="42" y="278">-</text><text x="60" y="278">产品/解决方案知识</text>
    <text x="42" y="308">-</text><text x="60" y="308">相互依赖</text>
    <text x="42" y="338">-</text><text x="60" y="338">对产品待办列表的输入</text>
    <text x="42" y="368">-</text><text x="60" y="368">对用户故事定义</text>
    <text x="60" y="390">（冲刺待办列表）的支持</text>
  </g>

