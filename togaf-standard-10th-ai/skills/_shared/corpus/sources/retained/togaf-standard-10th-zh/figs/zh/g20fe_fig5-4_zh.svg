    <rect x="450" y="142" width="80" height="23" fill="#0D9AD4"/>
    <rect x="450" y="167" width="80" height="23" fill="#ffffff"/>
    <rect x="450" y="192" width="80" height="23" fill="#ffffff"/>
    <rect x="450" y="217" width="80" height="23" fill="#ffffff"/>
    <rect x="450" y="242" width="80" height="23" fill="#ffffff"/>
    <rect x="450" y="267" width="80" height="23" fill="#ffffff"/>
    <rect x="450" y="292" width="80" height="23" fill="#ffffff"/>
    <rect x="450" y="317" width="80" height="23" fill="#ffffff"/>
