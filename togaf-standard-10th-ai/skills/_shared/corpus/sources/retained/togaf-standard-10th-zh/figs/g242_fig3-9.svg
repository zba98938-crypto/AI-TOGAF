<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">GHG Protocol 的范围与价值链排放</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="55" width="180" height="90" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="130" y="82" font-weight="bold">范围 1</text><text x="130" y="104" font-size="10">直接排放</text><text x="130" y="122" font-size="10">制冷剂泄漏、应急发电</text>
<rect x="240" y="55" width="180" height="90" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="330" y="82" font-weight="bold">范围 2</text><text x="330" y="104" font-size="10">购入电力/热/蒸汽</text><text x="330" y="122" font-size="10">数据中心与办公硬件用电</text>
<rect x="440" y="55" width="200" height="90" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="540" y="82" font-weight="bold">范围 3</text><text x="540" y="104" font-size="10">价值链间接排放</text><text x="540" y="122" font-size="10">设备制造、云服务、外包</text>
<rect x="660" y="55" width="190" height="90" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="755" y="82" font-weight="bold">其他影响</text><text x="755" y="104" font-size="10">金属、水、土方、废弃物</text><text x="755" y="122" font-size="10">与范围 3 常高度相关</text>
</g>
<g font-size="10.5" fill="#333">
<text x="40" y="190">ICT 特点：范围 1 占比较小；范围 2 与用电密切相关；范围 3 常超过总足迹的一半。</text>
<text x="40" y="215">度量建议：以 GHG Protocol 为框架；优先供应商实测数据；以量级与趋势为目标；年度基线跟踪。</text>
<text x="40" y="240">指标：kWh、tCO2e、PUE、碳强度、水（m³）、电子废弃物（kg）、设备寿命、回收率。</text>
<text x="40" y="275" font-size="10.5" fill="#666">度量是实施治理与设定科学目标的前提；应尽可能简单，把资源留给减排杠杆。</text>
</g>
</svg>
