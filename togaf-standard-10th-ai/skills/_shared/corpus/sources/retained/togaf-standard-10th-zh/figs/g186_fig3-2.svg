<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">架构项目在 EA 全景中的切片</text>
<g font-size="10.5" text-anchor="middle">
<rect x="60" y="60" width="220" height="180" rx="8" fill="#f7f7f7" stroke="#777"/><text x="170" y="82" font-weight="bold">EA 全景（全部潜在架构）</text>
<text x="170" y="110">广度：领域/组织/举措</text><text x="170" y="135">时间：现状/过渡/目标</text><text x="170" y="160">细节：战略/分段/能力</text><text x="170" y="185">时效：候选/批准/实现</text>
<rect x="330" y="95" width="200" height="110" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="430" y="120" font-weight="bold">架构项目切片</text><text x="430" y="145">特定广度</text><text x="430" y="167">特定规划期</text><text x="430" y="189">特定详细程度</text>
<rect x="580" y="60" width="240" height="80" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="700" y="85" font-weight="bold">更高层架构</text><text x="700" y="107">约束与指导（目标/过渡/现状）</text>
<rect x="580" y="160" width="240" height="80" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="700" y="185" font-weight="bold">产出</text><text x="700" y="207">填充/替换/重申全景内容</text>
</g>
<g stroke="#888" stroke-width="1.1" fill="none"><path d="M280,150 H330"/><path d="M530,120 H580"/><path d="M530,180 H580"/></g>
<text x="20" y="285" font-size="10.5" fill="#666">项目只做“刚好足够”的架构；批准后约束后续所有 EA 开发、变更规划与执行。</text>
</svg>
