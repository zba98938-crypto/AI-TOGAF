<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">架构项目在 TOGAF ADM 中的范围</text>
<circle cx="440" cy="170" r="105" fill="none" stroke="#5b7aa8" stroke-width="1.5" stroke-dasharray="5 4"/>
<g font-size="10.5" text-anchor="middle">
<circle cx="440" cy="65" r="28" fill="#f7f7f7" stroke="#777"/><text x="440" y="69">预备</text>
<circle cx="545" cy="100" r="28" fill="#eef3f8" stroke="#5b7aa8"/><text x="545" y="104">A</text>
<circle cx="595" cy="170" r="28" fill="#eef3f8" stroke="#5b7aa8"/><text x="595" y="174">B</text>
<circle cx="570" cy="240" r="28" fill="#eef3f8" stroke="#5b7aa8"/><text x="570" y="244">C</text>
<circle cx="495" cy="278" r="28" fill="#eef3f8" stroke="#5b7aa8"/><text x="495" y="282">D</text>
<circle cx="390" cy="278" r="28" fill="#eef3f8" stroke="#5b7aa8"/><text x="390" y="282">E</text>
<circle cx="312" cy="240" r="28" fill="#eef3f8" stroke="#5b7aa8"/><text x="312" y="244">F</text>
<circle cx="287" cy="170" r="28" fill="#f7f7f7" stroke="#777"/><text x="287" y="174">G</text>
<circle cx="337" cy="100" r="28" fill="#f7f7f7" stroke="#777"/><text x="337" y="104">H</text>
<rect x="405" y="145" width="70" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="440" y="166" font-size="10">需求</text><text x="440" y="182" font-size="10">管理</text>
</g>
<text x="600" y="200" font-size="11" fill="#2e5a8a">架构项目 = A–F + 需求管理</text>
<text x="600" y="222" font-size="10.5" fill="#666">预备、G、H 在项目范围之外</text>
<text x="20" y="285" font-size="10.5" fill="#666">输入：架构工作请求；输出：架构定义、路线图与实施计划，移交实施后项目结束。</text>
