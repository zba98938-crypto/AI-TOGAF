<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="330" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">四种协作方式（随敏捷成熟度递进）</text>
<g font-size="12">
<rect x="30" y="55" width="190" height="70" rx="8" fill="#e8eef7" stroke="#5b7aa8"/><text x="46" y="80" font-weight="bold">① 企业架构开发敏捷</text><text x="46" y="100" font-size="10.5">架构团队用冲刺交付 EA</text><text x="46" y="116" font-size="10.5">（A–F 切片）</text>
<rect x="240" y="55" width="190" height="70" rx="8" fill="#dfe8dc" stroke="#5f8f5f"/><text x="256" y="80" font-weight="bold">② 解决方案协作</text><text x="256" y="100" font-size="10.5">EA 冲刺 + 解决方案冲刺</text><text x="256" y="116" font-size="10.5">EA 产出 MVA</text>
<rect x="450" y="55" width="190" height="70" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="466" y="80" font-weight="bold">③ 跨开发协作</text><text x="466" y="100" font-size="10.5">业务开发 + EA + 解决方案</text><text x="466" y="116" font-size="10.5">MVBD / MVA 联动</text>
<rect x="660" y="55" width="180" height="70" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="676" y="80" font-weight="bold">④ 跨职能敏捷</text><text x="676" y="100" font-size="10.5">混合自组织团队</text><text x="676" y="116" font-size="10.5">三种能力同队</text>
</g>
<g stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#none)"><path d="M220,90 H240"/><path d="M430,90 H450"/><path d="M640,90 H660"/></g>
<g font-size="10.5" fill="#666">
<text x="30" y="170">敏捷成熟度 →</text>
<text x="30" y="210">• EA 开发敏捷：只有架构团队按冲刺节奏产出架构，实施在架构完成后开始。</text>
<text x="30" y="235">• 解决方案协作：架构与解决方案团队并行冲刺，架构为下一冲刺提供 MVA。</text>
<text x="30" y="260">• 跨开发协作：业务开发也进入冲刺，形成 MVBD→MVA→解决方案的链条。</text>
<text x="30" y="285">• 跨职能敏捷：不再区分专门团队，混合团队同时具备三种能力。</text>
</g>
</svg>
