<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- 顶部：每日站会 -->
  <rect x="465" y="38" width="270" height="76" rx="12" fill="#E8722A"/>
  <text x="600" y="70" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">每日讨论</text>
  <text x="600" y="98" font-size="17" fill="#FFFFFF" text-anchor="middle">「每日站会」</text>

  <!-- 团队图标 -->
  <g fill="none" stroke="#E8722A" stroke-width="2.2">
    <g>
      <circle cx="390" cy="82" r="12"/>
      <path d="M368 118 q22 -30 44 0"/>
      <path d="M382 105 h16 v14 h-16 z"/>
    </g>
    <g>
      <circle cx="810" cy="82" r="12"/>
      <path d="M788 118 q22 -30 44 0"/>
      <path d="M802 102 l16 8"/>
    </g>
    <g>
      <circle cx="500" cy="172" r="12"/>
      <path d="M478 208 q22 -30 44 0"/>
      <path d="M492 195 h16 v14 h-16 z"/>
    </g>
    <g>
      <circle cx="700" cy="172" r="12"/>
      <path d="M678 208 q22 -30 44 0"/>
      <path d="M692 192 l16 8"/>
    </g>
  </g>
  <text x="600" y="228" font-size="14.5" font-weight="bold" fill="#1E9E57" text-anchor="middle">负责达成目标的团队</text>

  <!-- 中央迭代环 -->
  <g>
    <circle cx="600" cy="420" r="140" fill="none" stroke="#123A63" stroke-width="48"/>
    <path d="M600 420 L786 348 L786 492 Z" fill="#FFFFFF"/>
    <circle cx="600" cy="420" r="112" fill="#29B6D8"/>
    <path d="M728 352 L792 420 L728 488 Z" fill="#123A63"/>
    <text x="600" y="405" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">迭代交付</text>
    <text x="600" y="440" font-size="19" fill="#FFFFFF" text-anchor="middle">「冲刺」</text>
  </g>

  <!-- 左侧：产品愿景 -->
  <rect x="30" y="190" width="320" height="76" rx="12" fill="#22B8D6"/>
  <text x="190" y="222" font-size="17" fill="#FFFFFF" text-anchor="middle">产品愿景</text>
  <text x="190" y="250" font-size="16" fill="#FFFFFF" text-anchor="middle">「产品待办列表」</text>
  <text x="42" y="300" font-size="14" font-weight="bold" fill="#17334F">回应的问题：</text>
  <g font-size="13.5" fill="#33465B">
    <text x="58" y="327">• 客户与业务</text>
    <text x="58" y="351">• 质量</text>
    <text x="58" y="375" fill="#1E9E57">• 气候与环境</text>
  </g>

  <!-- 左侧：下一增量 -->
  <rect x="30" y="405" width="320" height="76" rx="12" fill="#22B8D6"/>
  <text x="190" y="437" font-size="17" fill="#FFFFFF" text-anchor="middle">下一增量</text>
  <text x="190" y="465" font-size="16" fill="#FFFFFF" text-anchor="middle">「冲刺待办列表」</text>
  <text x="42" y="513" font-size="14" font-weight="bold" fill="#17334F">排定价值优先级时尊重：</text>
  <g font-size="13.5" fill="#33465B">
    <text x="58" y="540">• 架构需求</text>
    <text x="58" y="564">• 内部质量标准</text>
    <text x="58" y="588" fill="#1E9E57">• 环境需求</text>
  </g>

  <!-- 右侧：持续改进 -->
  <rect x="850" y="190" width="320" height="76" rx="12" fill="#E8722A"/>
  <text x="1010" y="222" font-size="17" fill="#FFFFFF" text-anchor="middle">持续改进</text>
  <text x="1010" y="250" font-size="16" fill="#FFFFFF" text-anchor="middle">「回顾会」</text>
  <text x="862" y="300" font-size="14" font-weight="bold" fill="#17334F">促成集体改进：</text>
  <g font-size="13.5" fill="#33465B">
    <text x="878" y="327">• 交付能力</text>
    <text x="878" y="351">• 集体运作</text>
    <text x="878" y="375" fill="#1E9E57">• 节制目标</text>
  </g>

  <!-- 右侧：增量 -->
  <rect x="850" y="405" width="320" height="76" rx="12" fill="#22B8D6"/>
  <text x="1010" y="437" font-size="17" fill="#FFFFFF" text-anchor="middle">增量</text>
  <text x="1010" y="465" font-size="16" fill="#FFFFFF" text-anchor="middle">「产品」</text>
  <text x="862" y="513" font-size="14" font-weight="bold" fill="#17334F">已通过的验证标准：</text>
  <g font-size="13.5" fill="#33465B">
    <text x="878" y="540">• 业务</text>
    <text x="878" y="564">• 技术</text>
    <text x="878" y="588" fill="#1E9E57">• 环境</text>
  </g>

  <!-- 图例 -->
  <text x="420" y="658" font-size="14" font-weight="bold" fill="#17334F">图例：</text>
  <rect x="485" y="643" width="66" height="24" rx="6" fill="#22B8D6"/>
  <text x="518" y="660" font-size="12.5" fill="#FFFFFF" text-anchor="middle">仪式</text>
  <rect x="568" y="643" width="66" height="24" rx="6" fill="#E8722A"/>
  <text x="601" y="660" font-size="12.5" fill="#FFFFFF" text-anchor="middle">工件</text>
  <text x="420" y="696" font-size="13.5" fill="#1E9E57">绿色：受可持续性目标影响</text>
</svg>
