<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">决策流程集成模型</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="60" width="200" height="90" rx="8" fill="#dce6f2" stroke="#5b7aa8"/><text x="140" y="88" font-weight="bold">EA 能力</text><text x="140" y="110" font-size="10">权衡分析、视图</text><text x="140" y="128" font-size="10">路线图、约束</text>
<rect x="340" y="60" width="200" height="90" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="440" y="88" font-weight="bold">决策流程</text><text x="440" y="110" font-size="10">战略/组合/项目</text><text x="440" y="128" font-size="10">预算与投资</text>
<rect x="640" y="60" width="200" height="90" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="740" y="88" font-weight="bold">执行流程</text><text x="740" y="110" font-size="10">变更/运营</text><text x="740" y="128" font-size="10">项目与交付</text>
<rect x="340" y="200" width="200" height="70" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="440" y="228" font-weight="bold">治理</text><text x="440" y="250" font-size="10">报告、合规、例外</text>
</g>
<g stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#a)">
<path d="M240,90 H340"/><path d="M540,90 H640"/><path d="M440,150 V200"/><path d="M340,235 H240 V150"/><path d="M640,150 V220 H540"/>
</g>
<g font-size="10" fill="#444"><text x="255" y="82">建议+约束</text><text x="555" y="82">方向+约束+建议</text><text x="450" y="180">报告</text></g>
<text x="20" y="305" font-size="10.5" fill="#666">关键：架构工作产品必须在决策之前、执行开始之前提供；报告用于确认执行或触发变更。</text>
</svg>
