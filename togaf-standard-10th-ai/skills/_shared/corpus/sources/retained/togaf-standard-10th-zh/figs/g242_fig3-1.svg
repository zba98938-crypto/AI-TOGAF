<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="380" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">数字可持续性参考模型：信息系统“健身计划”的七个高层业务功能</text>
<g font-size="10.5" text-anchor="middle">
<rect x="30" y="55" width="190" height="70" rx="8" fill="#fdf3d8" stroke="#b09040"/><text x="125" y="82" font-weight="bold">1 可持续 IS 战略</text><text x="125" y="102">采购、合同、生态合作</text>
<rect x="240" y="55" width="190" height="70" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="335" y="82" font-weight="bold">2 与客户/伙伴/主管部门互动</text><text x="335" y="102">采购、合同、生态合作</text>
<rect x="450" y="55" width="200" height="70" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="550" y="82" font-weight="bold">3 架构并构建可持续 IS</text><text x="550" y="102">业务/应用/数据/技术</text>
<rect x="670" y="55" width="200" height="70" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="770" y="82" font-weight="bold">4 运营可持续 IS</text><text x="770" y="102">能效、寿命、容量</text>
<rect x="30" y="145" width="190" height="70" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="125" y="172" font-weight="bold">5 可持续数字文化</text><text x="125" y="192">认知、培训、节制</text>
<rect x="240" y="145" width="190" height="70" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="335" y="172" font-weight="bold">6 度量影响</text><text x="335" y="192">LCA、GHG 范围 1/2/3</text>
<rect x="450" y="145" width="200" height="70" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="550" y="172" font-weight="bold">7 治理转型</text><text x="550" y="192">评审、例外、目标</text>
</g>
<text x="30" y="260" font-size="10.5" fill="#333">前提：高管与员工的认知与承诺；这些功能相互依赖，应作为整体计划推进。</text>
<text x="30" y="285" font-size="10.5" fill="#333">原则：聚焦价值最大的领域；避免“业务不可持续、ICT 只是使其更高效”的系统性陷阱。</text>
<text x="30" y="310" font-size="10.5" fill="#333">适用范围：外包服务、设备制造、所在地电网、许可软件提供方均应纳入视野。</text>
<text x="30" y="345" font-size="10.5" fill="#666">来源：The Shift Project Lean-ICT 工作组。</text>
</svg>
