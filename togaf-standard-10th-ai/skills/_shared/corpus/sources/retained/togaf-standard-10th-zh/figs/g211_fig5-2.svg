<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">能力 × 组织单元 映射（示例）</text>
<g font-size="11">
<text x="220" y="55">销售</text><text x="330" y="55">财务</text><text x="440" y="55">人力资源</text><text x="560" y="55">运营</text><text x="670" y="55">IT</text>
<text x="20" y="90">客户管理</text><text x="20" y="130">财务管理</text><text x="20" y="170">人力资源管理</text><text x="20" y="210">采购管理</text><text x="20" y="250">培训管理</text>
</g>
<g stroke="#bbb" stroke-width="0.8">
<rect x="200" y="65" width="90" height="32" fill="#cfe0d6"/><rect x="290" y="65" width="90" height="32" fill="#f7f7f7"/><rect x="380" y="65" width="110" height="32" fill="#f7f7f7"/><rect x="490" y="65" width="110" height="32" fill="#f7f7f7"/><rect x="600" y="65" width="100" height="32" fill="#f7f7f7"/>
<rect x="200" y="105" width="90" height="32" fill="#f7f7f7"/><rect x="290" y="105" width="90" height="32" fill="#cfe0d6"/><rect x="380" y="105" width="110" height="32" fill="#f7f7f7"/><rect x="490" y="105" width="110" height="32" fill="#f7f7f7"/><rect x="600" y="105" width="100" height="32" fill="#fbe9b6"/>
<rect x="200" y="145" width="90" height="32" fill="#f7f7f7"/><rect x="290" y="145" width="90" height="32" fill="#f7f7f7"/><rect x="380" y="145" width="110" height="32" fill="#cfe0d6"/><rect x="490" y="145" width="110" height="32" fill="#f7f7f7"/><rect x="600" y="145" width="100" height="32" fill="#f7f7f7"/>
<rect x="200" y="185" width="90" height="32" fill="#f7f7f7"/><rect x="290" y="185" width="90" height="32" fill="#fbe9b6"/><rect x="380" y="185" width="110" height="32" fill="#f7f7f7"/><rect x="490" y="185" width="110" height="32" fill="#cfe0d6"/><rect x="600" y="185" width="100" height="32" fill="#f7f7f7"/>
<rect x="200" y="225" width="90" height="32" fill="#f7f7f7"/><rect x="290" y="225" width="90" height="32" fill="#f7f7f7"/><rect x="380" y="225" width="110" height="32" fill="#f7f7f7"/><rect x="490" y="225" width="110" height="32" fill="#fbe9b6"/><rect x="600" y="225" width="100" height="32" fill="#f7f7f7"/>
</g>
<text x="20" y="285" font-size="11" fill="#666">同一能力分布在多个组织单元时，可能存在重复建设或不一致部署（黄色）；绿色为核心承担单元。</text>
</svg>
