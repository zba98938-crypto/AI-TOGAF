<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="Hiragino Sans GB, sans-serif">
<rect width="820" height="260" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">图 3-5：跨职能团队构成的敏捷改进型企业</text>
<g font-size="11" text-anchor="middle">
<rect x="60" y="60" width="280" height="150" rx="12" fill="#eef3f8" stroke="#5b7aa8"/>
<text x="200" y="86" font-weight="bold">跨职能冲刺团队 A</text>
<rect x="80" y="100" width="240" height="30" fill="#f7efe4" stroke="#b07a55"/><text x="200" y="120">业务开发能力</text>
<rect x="80" y="135" width="240" height="30" fill="#e8eef7" stroke="#5b7aa8"/><text x="200" y="155">企业架构能力</text>
<rect x="80" y="170" width="240" height="30" fill="#dfe8dc" stroke="#5f8f5f"/><text x="200" y="190">解决方案开发能力</text>
<rect x="480" y="60" width="280" height="150" rx="12" fill="#eef3f8" stroke="#5b7aa8"/>
<text x="620" y="86" font-weight="bold">跨职能冲刺团队 B</text>
<rect x="500" y="100" width="240" height="30" fill="#f7efe4" stroke="#b07a55"/><text x="620" y="120">业务开发能力</text>
<rect x="500" y="135" width="240" height="30" fill="#e8eef7" stroke="#5b7aa8"/><text x="620" y="155">企业架构能力</text>
<rect x="500" y="170" width="240" height="30" fill="#dfe8dc" stroke="#5f8f5f"/><text x="620" y="190">解决方案开发能力</text>
</g>
<g stroke="#888" stroke-width="1.2"><path d="M340,135 H480" stroke-dasharray="4 3"/></g>
<text x="20" y="240" font-size="10.5" fill="#666">每个团队都具备三种能力，不再设专门的业务开发/EA/解决方案团队；冲刺末统一协调。</text>
</svg>
