<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <rect width="1200" height="820" fill="#FFFFFF"/>

  <text x="40" y="36" font-size="19" font-weight="bold" fill="#1F4E79">图 9-2　EA 能力模型的分解</text>
  <text x="40" y="58" font-size="12" fill="#5A6B7B">按能力层级分解：通用业务能力、目的能力与基础能力</text>

  <!-- 通用业务能力 -->
  <rect x="40" y="84" width="1120" height="150" rx="6" fill="#1F6FA8"/>
  <text x="600" y="120" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">通用业务能力</text>
  <g font-size="15" fill="#12395C" text-anchor="middle">
    <rect x="44" y="138" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="144" y="181">领导力</text>

    <rect x="272" y="138" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="372" y="181">绩效管理</text>

    <rect x="500" y="138" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="600" y="181">人力资源管理</text>

    <rect x="728" y="138" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="828" y="181">组织模型</text>

    <rect x="956" y="138" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="1056" y="181">等</text>
  </g>

  <!-- 目的能力 -->
  <rect x="40" y="248" width="1120" height="356" rx="6" fill="#1F6FA8"/>
  <text x="600" y="284" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">目的能力</text>

  <!-- 第 1 列：支持战略 -->
  <rect x="64" y="304" width="252" height="282" fill="#E8B93A" stroke="#B8901F" stroke-width="1.2"/>
  <text x="190" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B2A1A">架构支持战略</text>
  <rect x="76" y="380" width="228" height="70" fill="#FFFFFF" stroke="#8A6B12" stroke-width="1"/>
  <text x="190" y="420" text-anchor="middle" font-size="13.5" fill="#1F3448">开发架构</text>
  <rect x="76" y="466" width="228" height="70" fill="#FFFFFF" stroke="#8A6B12" stroke-width="1"/>
  <text x="190" y="506" text-anchor="middle" font-size="13.5" fill="#1F3448">治理下级架构</text>

  <!-- 第 2 列：支持组合 -->
  <rect x="332" y="304" width="252" height="282" fill="#9CC57C" stroke="#62883F" stroke-width="1.2"/>
  <text x="458" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E2E17">架构支持组合</text>
  <rect x="344" y="380" width="228" height="70" fill="#FFFFFF" stroke="#4E6B32" stroke-width="1"/>
  <text x="458" y="420" text-anchor="middle" font-size="13" fill="#1F3448">开发架构（消费上级架构）</text>
  <rect x="344" y="466" width="228" height="70" fill="#FFFFFF" stroke="#4E6B32" stroke-width="1"/>
  <text x="458" y="506" text-anchor="middle" font-size="13.5" fill="#1F3448">治理下级架构</text>

  <!-- 第 3 列：支持项目 -->
  <rect x="600" y="304" width="252" height="282" fill="#F0A56B" stroke="#B86A2E" stroke-width="1.2"/>
  <text x="726" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="#3A2414">架构支持项目</text>
  <rect x="612" y="380" width="228" height="70" fill="#FFFFFF" stroke="#8C4F1F" stroke-width="1"/>
  <text x="726" y="420" text-anchor="middle" font-size="13" fill="#1F3448">开发架构（消费上级架构）</text>
  <rect x="612" y="466" width="228" height="70" fill="#FFFFFF" stroke="#8C4F1F" stroke-width="1"/>
  <text x="726" y="506" text-anchor="middle" font-size="13.5" fill="#1F3448">治理项目与设计</text>

  <!-- 第 4 列：支持解决方案交付 -->
  <rect x="868" y="304" width="252" height="282" fill="#C2185B" stroke="#85103E" stroke-width="1.2"/>
  <text x="994" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">架构支持解决方案交付</text>
  <rect x="880" y="380" width="228" height="70" fill="#FFFFFF" stroke="#85103E" stroke-width="1"/>
  <text x="994" y="420" text-anchor="middle" font-size="13" fill="#1F3448">开发架构（消费上级架构）</text>
  <rect x="880" y="466" width="228" height="70" fill="#FFFFFF" stroke="#85103E" stroke-width="1"/>
  <text x="994" y="506" text-anchor="middle" font-size="13.5" fill="#1F3448">支持采购</text>

  <!-- 基础能力 -->
  <rect x="40" y="620" width="1120" height="150" rx="6" fill="#1F6FA8"/>
  <text x="600" y="656" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">基础能力</text>
  <g font-size="13" fill="#12395C" text-anchor="middle">
    <rect x="44" y="674" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="144" y="708">架构内容</text>
    <text x="144" y="728">（模型）</text>

    <rect x="272" y="674" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="372" y="708">架构内容</text>
    <text x="372" y="728">（模板与存储库）</text>

    <rect x="500" y="674" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="600" y="718">治理</text>

    <rect x="728" y="674" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="828" y="718">流程集成</text>

    <rect x="956" y="674" width="200" height="72" fill="#FFFFFF" stroke="#12395C" stroke-width="1.2"/>
    <text x="1056" y="700" font-size="12.5">EA 技术</text>
    <text x="1056" y="720" font-size="11.5">（利益相关者、风险、</text>
    <text x="1056" y="737" font-size="11.5">权衡等）</text>
  </g>

  <text x="40" y="798" font-size="10.5" fill="#8A9BB0">© The Open Group</text>
</svg>
