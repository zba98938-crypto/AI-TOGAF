<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- 左侧分组标签 -->
  <g font-size="14" font-weight="bold" fill="#17334F" text-anchor="middle">
    <text x="28" y="282" transform="rotate(-90 28 282)">碳核算</text>
    <text x="28" y="487" transform="rotate(-90 28 487)">分析</text>
  </g>
  <g stroke="#5A6B7B" stroke-width="1.4" fill="none">
    <path d="M44 136 h-6 v292 h6"/>
    <path d="M44 428 h-6 v118 h6"/>
  </g>

  <!-- 表头：度量范围 -->
  <rect x="55" y="22" width="180" height="110" rx="16" fill="#FFFFFF" stroke="#17334F" stroke-width="2"/>
  <text x="145" y="66" font-size="15" font-weight="bold" fill="#17334F" text-anchor="middle">连续 2–3 年</text>
  <text x="145" y="94" font-size="15" font-weight="bold" fill="#17334F" text-anchor="middle">年度度量</text>

  <g font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="240" y="22" width="215" height="48" fill="#0B4A6F" stroke="#8FA3B8"/>
    <text x="347.5" y="52">组织自营的数据中心</text>
    <rect x="458" y="22" width="217" height="48" fill="#0B4A6F" stroke="#8FA3B8"/>
    <text x="566.5" y="52">公有云</text>
    <rect x="678" y="22" width="90" height="48" fill="#0B4A6F" stroke="#8FA3B8"/>
    <text x="723" y="52">分包商</text>
    <rect x="771" y="22" width="85" height="48" fill="#0B4A6F" stroke="#8FA3B8"/>
    <text x="813.5" y="52">公共网络</text>
    <rect x="859" y="22" width="176" height="48" fill="#0B4A6F" stroke="#8FA3B8"/>
    <text x="947" y="42" font-size="12">工作站/薪酬/</text>
    <text x="947" y="60" font-size="12">分包商</text>
    <rect x="1038" y="22" width="147" height="48" fill="#0B4A6F" stroke="#8FA3B8"/>
    <text x="1111.5" y="52">客户终端</text>
  </g>

  <!-- 表头：子项 -->
  <g font-size="10.5" fill="#17334F" text-anchor="middle">
    <rect x="240" y="70" width="71.7" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="275.8" y="105">数据中心#1</text>
    <rect x="311.7" y="70" width="71.6" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="347.5" y="105">数据中心#2</text>
    <rect x="383.3" y="70" width="71.7" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="419.2" y="105">……</text>

    <rect x="458" y="70" width="54.25" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="485.1" y="95">微软</text><text x="485.1" y="112">Office 365</text>
    <rect x="512.25" y="70" width="54.25" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="539.4" y="95">微软</text><text x="539.4" y="112">Azure</text>
    <rect x="566.5" y="70" width="54.25" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="593.6" y="105">AWS</text>
    <rect x="620.75" y="70" width="54.25" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="647.9" y="105">……</text>

    <rect x="678" y="70" width="90" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="723" y="95">营销活动、</text><text x="723" y="112">分包服务</text>
    <rect x="771" y="70" width="85" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="813.5" y="105">互联网</text>
    <rect x="859" y="70" width="176" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="947" y="89">计算机、电话、</text><text x="947" y="106">打印机、屏幕等</text>
    <rect x="1038" y="70" width="147" height="62" fill="#FFFFFF" stroke="#8FA3B8"/>
    <text x="1111.5" y="86">客户使用组织</text><text x="1111.5" y="102">数字服务所需</text><text x="1111.5" y="118">终端的百分比</text>
  </g>

  <!-- PUE 行 -->
  <rect x="55" y="136" width="180" height="42" fill="#0B4A6F" stroke="#8FA3B8"/>
  <text x="145" y="162" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PUE</text>
  <g font-size="12.5" fill="#17334F" text-anchor="middle">
    <rect x="240" y="136" width="71.7" height="42" fill="#FFFFFF" stroke="#8FA3B8"/><text x="275.8" y="162">1.5</text>
    <rect x="311.7" y="136" width="71.6" height="42" fill="#FFFFFF" stroke="#8FA3B8"/><text x="347.5" y="162">1.4</text>
    <rect x="383.3" y="136" width="71.7" height="42" fill="#FFFFFF" stroke="#8FA3B8"/><text x="419.2" y="162">……</text>
    <rect x="458" y="136" width="54.25" height="42" fill="#FFFFFF" stroke="#8FA3B8"/><text x="485.1" y="162">1.2</text>
    <rect x="512.25" y="136" width="54.25" height="42" fill="#FFFFFF" stroke="#8FA3B8"/><text x="539.4" y="162">……</text>
    <rect x="566.5" y="136" width="54.25" height="42" fill="#FFFFFF" stroke="#8FA3B8"/><text x="593.6" y="162">……</text>
    <rect x="620.75" y="136" width="54.25" height="42" fill="#FFFFFF" stroke="#8FA3B8"/><text x="647.9" y="162">……</text>
    <rect x="678" y="136" width="90" height="42" fill="#FFFFFF" stroke="#8FA3B8"/>
    <rect x="771" y="136" width="85" height="42" fill="#FFFFFF" stroke="#8FA3B8"/>
    <rect x="859" y="136" width="176" height="42" fill="#FFFFFF" stroke="#8FA3B8"/>
    <rect x="1038" y="136" width="147" height="42" fill="#FFFFFF" stroke="#8FA3B8"/>
  </g>

  <!-- 用电量行 -->
  <rect x="55" y="182" width="180" height="90" fill="#0B4A6F" stroke="#8FA3B8"/>
  <text x="145" y="232" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">用电量</text>
  <rect x="240" y="182" width="215" height="90" fill="#F5EE5A" stroke="#8FA3B8"/>
  <text x="347.5" y="220" font-size="12.5" fill="#17334F" text-anchor="middle">#kWh ×</text>
  <text x="347.5" y="240" font-size="12.5" fill="#17334F" text-anchor="middle">当地电力结构</text>
  <rect x="458" y="182" width="217" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="566.5" y="236" font-size="16" font-weight="bold" fill="#17334F" text-anchor="middle">MtCO₂e</text>
  <rect x="678" y="182" width="178" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="767" y="220" font-size="12" fill="#17334F" text-anchor="middle">用于识别的</text>
  <text x="767" y="240" font-size="12" fill="#17334F" text-anchor="middle">度量方法</text>
  <rect x="859" y="182" width="176" height="90" fill="#F5EE5A" stroke="#8FA3B8"/>
  <text x="947" y="220" font-size="12.5" fill="#17334F" text-anchor="middle">#kWh ×</text>
  <text x="947" y="240" font-size="12.5" fill="#17334F" text-anchor="middle">当地电力结构</text>
  <rect x="1038" y="182" width="147" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="1111.5" y="220" font-size="12" fill="#17334F" text-anchor="middle">#kWh ×</text>
  <text x="1111.5" y="240" font-size="12" fill="#17334F" text-anchor="middle">当地电力结构</text>

  <!-- 设备清单行 -->
  <rect x="55" y="276" width="180" height="90" fill="#0B4A6F" stroke="#8FA3B8"/>
  <text x="145" y="313" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">设备清单、</text>
  <text x="145" y="335" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">设备寿命</text>
  <rect x="240" y="276" width="215" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="347.5" y="312" font-size="11.5" fill="#17334F" text-anchor="middle">#物理服务器  #虚拟服务器</text>
  <text x="347.5" y="332" font-size="11.5" fill="#17334F" text-anchor="middle">#网络设备  #存储架……</text>
  <rect x="458" y="276" width="217" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="566.5" y="326" font-size="12.5" fill="#17334F" text-anchor="middle">#服务数量</text>
  <rect x="678" y="276" width="178" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="767" y="314" font-size="12" fill="#17334F" text-anchor="middle">用于识别的</text>
  <text x="767" y="334" font-size="12" fill="#17334F" text-anchor="middle">度量方法</text>
  <rect x="859" y="276" width="176" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="947" y="326" font-size="12.5" fill="#17334F" text-anchor="middle">#终端  #设备</text>
  <rect x="1038" y="276" width="147" height="90" fill="#A9C6E3" stroke="#8FA3B8"/>
  <text x="1111.5" y="326" font-size="12.5" fill="#17334F" text-anchor="middle">#终端  #设备</text>

  <!-- 总量行 -->
  <rect x="55" y="370" width="180" height="54" fill="#0B4A6F" stroke="#8FA3B8"/>
  <text x="145" y="393" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">年度 MtCO₂e</text>
  <text x="145" y="414" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">总量</text>
  <rect x="240" y="370" width="945" height="54" fill="#FFFFFF" stroke="#8FA3B8"/>
  <text x="712.5" y="393" font-size="12.5" fill="#17334F" text-anchor="middle">使用公开参考数据：ADEME 温室气体排放清单（bilan GES）、</text>
  <text x="712.5" y="414" font-size="12.5" fill="#17334F" text-anchor="middle">TSP REN，以及提供方公布的温室气体排放（GES）</text>

  <!-- 抵消行 -->
  <rect x="55" y="428" width="180" height="54" fill="#0B4A6F" stroke="#8FA3B8"/>
  <text x="145" y="461" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MtCO₂e 抵消</text>
  <rect x="240" y="428" width="945" height="54" fill="#FFFFFF" stroke="#8FA3B8"/>
  <text x="712.5" y="461" font-size="15" fill="#17334F" text-anchor="middle">抵消应单独计算</text>

  <!-- 存储行 -->
  <rect x="55" y="486" width="180" height="60" fill="#0B4A6F" stroke="#8FA3B8"/>
  <text x="145" y="512" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">存储容量</text>
  <text x="145" y="533" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">（TB）</text>
  <rect x="240" y="486" width="500" height="60" fill="#FFFFFF" stroke="#8FA3B8"/>
  <text x="490" y="523" font-size="15" fill="#17334F" text-anchor="middle"># 容量（TB）</text>
  <rect x="743" y="486" width="442" height="60" fill="#ECECEC" stroke="#8FA3B8"/>
  <text x="964" y="523" font-size="15" fill="#17334F" text-anchor="middle">不涉及</text>

  <!-- 图例 -->
  <rect x="500" y="565" width="480" height="105" rx="8" fill="#F7FBFD" stroke="#8FA3B8"/>
  <text x="518" y="588" font-size="14" font-weight="bold" fill="#17334F">图例</text>
  <rect x="570" y="598" width="38" height="18" fill="#F5EE5A" stroke="#B9A93C"/>
  <text x="618" y="612" font-size="11.5" fill="#17334F">范围 2：与用电相关的间接温室气体排放</text>
  <rect x="570" y="628" width="38" height="18" fill="#A9C6E3" stroke="#6E8296"/>
  <text x="618" y="642" font-size="11.5" fill="#17334F">范围 3：与服务、材料采购相关的间接温室气体排放</text>
</svg>
