<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">可能的治理层级</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="55" width="230" height="70" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="155" y="82" font-weight="bold">企业级治理</text><text x="155" y="102" font-size="10">战略、原则、组合投资</text><text x="155" y="118" font-size="10">跨企业冲突与例外</text>
<rect x="300" y="55" width="230" height="70" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="415" y="82" font-weight="bold">分段/组合级治理</text><text x="415" y="102" font-size="10">路线图、项目立项</text><text x="415" y="118" font-size="10">跨项目依赖与协同</text>
<rect x="560" y="55" width="260" height="70" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="690" y="82" font-weight="bold">项目/解决方案级治理</text><text x="690" y="102" font-size="10">设计合规、例外申请</text><text x="690" y="118" font-size="10">技术标准与架构契约</text>
</g>
<g stroke="#555" stroke-width="1.2" fill="none"><path d="M615,90 H735"/><path d="M565,90 H445"/><path d="M305,90 H185"/></g>
<text x="20" y="175" font-size="10.5" fill="#333">治理要点：</text>
<text x="20" y="200">• 目标架构、救济与强制执行的决策权属于干系人；EA 治理机构拥有流程与建议权</text>
<text x="20" y="223">• 每层应有明确的升级与救济机制，否则将失去控制或局部自治</text>
<text x="20" y="246">• 观察与度量应透明说明目的与缓解选项，以驱动正向行为</text>
<text x="20" y="275" font-size="10.5" fill="#666">治理不是“抓责任”，而是指导、控制与问责的结构化机制。</text>
</svg>
