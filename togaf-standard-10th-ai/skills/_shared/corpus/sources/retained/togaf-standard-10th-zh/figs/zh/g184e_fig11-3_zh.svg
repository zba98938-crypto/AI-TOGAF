<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Hiragino Sans GB','PingFang SC',sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>

  <text x="40" y="36" font-size="19" font-weight="bold" fill="#1F4E79">图 11-3　EA 能力模型示例（一）</text>
  <text x="40" y="58" font-size="12" fill="#5A6B7B">按能力层级划分：通用业务能力、目的能力与基础能力</text>

  <!-- 通用业务能力 -->
  <rect x="40" y="88" width="1120" height="90" rx="5" fill="#1F6FA8"/>
  <text x="600" y="143" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">通用业务能力</text>

  <!-- 目的能力 -->
  <rect x="40" y="198" width="1120" height="244" rx="5" fill="#1F6FA8"/>
  <text x="600" y="238" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">目的能力</text>

  <rect x="64" y="258" width="252" height="164" fill="#E8B93A" stroke="#B8901F" stroke-width="1.2"/>
  <text x="190" y="346" text-anchor="middle" font-size="17" font-weight="bold" fill="#2B2A1A">架构支持战略</text>

  <rect x="332" y="258" width="252" height="164" fill="#9CC57C" stroke="#62883F" stroke-width="1.2"/>
  <text x="458" y="346" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2E17">架构支持组合</text>

  <rect x="600" y="258" width="252" height="164" fill="#F0A56B" stroke="#B86A2E" stroke-width="1.2"/>
  <text x="726" y="346" text-anchor="middle" font-size="17" font-weight="bold" fill="#3A2414">架构支持项目</text>

  <rect x="868" y="258" width="252" height="164" fill="#C2185B" stroke="#85103E" stroke-width="1.2"/>
  <text x="994" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">架构支持</text>
  <text x="994" y="354" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">解决方案交付</text>
  <text x="994" y="380" text-anchor="middle" font-size="11.5" fill="#FBE4EE">（价值链、外包、云）</text>

  <!-- 基础能力 -->
  <rect x="40" y="462" width="1120" height="90" rx="5" fill="#1F6FA8"/>
  <text x="600" y="517" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">基础能力</text>

  <text x="40" y="594" font-size="10.5" fill="#8A9BB0">改编自《世界级企业架构》白皮书。　© The Open Group</text>
</svg>
