<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="420" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">BI 与分析能力——高层功能参考模型</text>
<g font-size="11.5" text-anchor="middle">
<rect x="40" y="50" width="190" height="60" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="135" y="74">定义战略与路线图</text><text x="135" y="92" font-size="10">Strategy &amp; Roadmaps</text>
<rect x="250" y="50" width="190" height="60" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="345" y="74">提供必要数据源</text><text x="345" y="92" font-size="10">Data Sources</text>
<rect x="460" y="50" width="220" height="60" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="570" y="74">设计与开发价值链条</text><text x="570" y="92" font-size="10">Value Chain (raw→business view)</text>
<rect x="700" y="50" width="180" height="60" rx="6" fill="#dfe8dc" stroke="#5f8f5f"/><text x="790" y="74">保护数据与合规</text><text x="790" y="92" font-size="10">Protect &amp; Compliance</text>
<rect x="40" y="130" width="190" height="60" rx="6" fill="#dfe8dc" stroke="#5f8f5f"/><text x="135" y="154">数据质量框架</text><text x="135" y="172" font-size="10">Data Quality</text>
<rect x="250" y="130" width="190" height="60" rx="6" fill="#dfe8dc" stroke="#5f8f5f"/><text x="345" y="154">元数据管理</text><text x="345" y="172" font-size="10">Metadata Management</text>
<rect x="460" y="130" width="220" height="60" rx="6" fill="#e8eef7" stroke="#5b7aa8"/><text x="570" y="154">运营平台</text><text x="570" y="172" font-size="10">Operate Platforms</text>
<rect x="700" y="130" width="180" height="60" rx="6" fill="#f2ecf7" stroke="#806a9e"/><text x="790" y="154">治理与度量</text><text x="790" y="172" font-size="10">Govern &amp; Measure</text>
<rect x="250" y="210" width="190" height="60" rx="6" fill="#f2ecf7" stroke="#806a9e"/><text x="345" y="234">沟通与培训</text><text x="345" y="252" font-size="10">Communicate &amp; Train</text>
</g>
<text x="20" y="310" font-size="10.5" fill="#666">应用层功能（对应表 2-2）：数据集成、数据存储、数据处理、信息报表与仪表盘、决策支持分析与可视化、</text>
<text x="20" y="330" font-size="10.5" fill="#666">管理、面向工程与数据管理的数据访问、开发、监控。</text>
<text x="20" y="365" font-size="10.5" fill="#666">业务功能支撑能力运转；应用功能以自动化方式实现数据采集、加工、服务与运维。</text>
</svg>
