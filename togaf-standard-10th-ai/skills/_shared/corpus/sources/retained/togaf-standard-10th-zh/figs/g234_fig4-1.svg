<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">组织内元数据来源示意</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="60" width="150" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="115" y="86">业务应用</text><text x="115" y="104" font-size="10">CRM / ERP / 计费</text>
<rect x="210" y="60" width="150" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="285" y="86">数据仓库</text><text x="285" y="104" font-size="10">历史数据 / 数据集市</text>
<rect x="380" y="60" width="150" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="455" y="86">数据湖 / 新平台</text><text x="455" y="104" font-size="10">原始与加工数据</text>
<rect x="550" y="60" width="150" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="625" y="86">接口与 API</text><text x="625" y="104" font-size="10">交换与集成</text>
<rect x="720" y="60" width="130" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="785" y="86">外部数据</text><text x="785" y="104" font-size="10">供应商 / 伙伴</text>
<rect x="330" y="200" width="220" height="60" rx="10" fill="#fdf3d8" stroke="#b09040"/><text x="440" y="226">元数据存储库</text><text x="440" y="244" font-size="10">业务/技术/运营元数据</text>
</g>
<g stroke="#888" stroke-width="1.1" stroke-dasharray="4 3">
<path d="M115,120 L400,200"/><path d="M285,120 V200"/><path d="M455,120 V200"/><path d="M625,120 L500,200"/><path d="M785,120 L520,200"/>
</g>
<text x="20" y="285" font-size="10.5" fill="#666">挑战：不同社区、不同流程与生命周期；需按业务目标逐步汇聚，而非一次性全量文档化。</text>
</svg>
