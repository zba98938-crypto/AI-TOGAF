<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="340" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">EA 全景的四个特征</text>
<g font-size="11" text-anchor="middle">
<rect x="30" y="55" width="190" height="90" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="125" y="82" font-weight="bold">广度 Breadth</text><text x="125" y="104" font-size="10">主题范围：领域、组织、举措</text><text x="125" y="122" font-size="10">最重要的范围维度之一</text>
<rect x="235" y="55" width="190" height="90" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="330" y="82" font-weight="bold">详细程度 Detail</text><text x="330" y="104" font-size="10">到回答当前问题所需即可</text><text x="330" y="122" font-size="10">细节越多，TTM 越长</text>
<rect x="440" y="55" width="190" height="90" rx="8" fill="#fdf3d8" stroke="#b09040"/><text x="535" y="82" font-weight="bold">时间 Time</text><text x="535" y="104" font-size="10">规划期：期望达到目标的时间</text><text x="535" y="122" font-size="10">过渡架构需遵循当期约束</text>
<rect x="645" y="55" width="190" height="90" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="740" y="82" font-weight="bold">时效 Recency</text><text x="740" y="104" font-size="10">架构会老化，需评审/重申</text><text x="740" y="122" font-size="10">状态与时序须自我标识</text>
</g>
<text x="20" y="190" font-size="10.5" fill="#333">架构项目只覆盖 EA 全景的特定部分（广度 × 时间 × 细节），并受更高层架构约束。</text>
<text x="20" y="218" font-size="10.5" fill="#333">四个状态：现状（基线）、目标（已批准）、过渡（部分实现）、候选（未批准）。</text>
<text x="20" y="248" font-size="10.5" fill="#333">关键实践：</text>
<text x="20" y="272">• 只采集当前决策所需信息，避免信息过载</text>
<text x="20" y="294">• 以差距、架构需求规格与控制作为实施者的核心输入</text>
<text x="20" y="316">• 干系人批准的是视图，不是无止境的架构描述</text>
</svg>
