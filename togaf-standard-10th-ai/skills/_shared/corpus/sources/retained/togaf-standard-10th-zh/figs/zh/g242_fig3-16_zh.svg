<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="Hiragino Sans GB, PingFang SC, sans-serif">
  <rect width="1200" height="730" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1F3864">图 3-16　可持续信息系统的治理原则</text>
  <text x="24" y="57" font-size="12.5" fill="#5A6B7B">公司架构原则示例：九条原则共同约束组织各层级的信息系统决策。</text>

  <!-- 第一行 -->
  <rect x="29" y="82" width="364" height="178" fill="#C3CCD6"/>
  <rect x="24" y="76" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="64" y="180" font-size="44" font-weight="bold" fill="#3A6EA5">1</text>
  <text x="120" y="171" font-size="15" fill="#1F3864">培训，内部与外部沟通</text>

  <rect x="423" y="82" width="364" height="178" fill="#C3CCD6"/>
  <rect x="418" y="76" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="458" y="180" font-size="44" font-weight="bold" fill="#3A6EA5">4</text>
  <text x="514" y="171" font-size="15" fill="#1F3864">使用可持续的共享数字服务</text>

  <rect x="817" y="82" width="364" height="178" fill="#C3CCD6"/>
  <rect x="812" y="76" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="852" y="180" font-size="44" font-weight="bold" fill="#3A6EA5">7</text>
  <text x="908" y="171" font-size="15" fill="#1F3864">优化资源使用、最小化污染</text>

  <!-- 第二行 -->
  <rect x="29" y="288" width="364" height="178" fill="#C3CCD6"/>
  <rect x="24" y="282" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="64" y="386" font-size="44" font-weight="bold" fill="#3A6EA5">2</text>
  <text x="120" y="367" font-size="15" fill="#1F3864">透明公开数字服务</text>
  <text x="120" y="391" font-size="15" fill="#1F3864">环境足迹的度量</text>

  <rect x="423" y="288" width="364" height="178" fill="#C3CCD6"/>
  <rect x="418" y="282" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="458" y="386" font-size="44" font-weight="bold" fill="#3A6EA5">5</text>
  <text x="514" y="377" font-size="15" fill="#1F3864">共享知识</text>

  <rect x="817" y="288" width="364" height="178" fill="#C3CCD6"/>
  <rect x="812" y="282" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="852" y="386" font-size="44" font-weight="bold" fill="#3A6EA5">8</text>
  <text x="908" y="367" font-size="15" fill="#1F3864">设计可维修、可复用、</text>
  <text x="908" y="391" font-size="15" fill="#1F3864">可回收的设备与服务</text>

  <!-- 第三行 -->
  <rect x="29" y="494" width="364" height="178" fill="#C3CCD6"/>
  <rect x="24" y="488" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="64" y="592" font-size="44" font-weight="bold" fill="#3A6EA5">3</text>
  <text x="120" y="583" font-size="15" fill="#1F3864">节制地使用服务与数字设备</text>

  <rect x="423" y="494" width="364" height="178" fill="#C3CCD6"/>
  <rect x="418" y="488" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="458" y="592" font-size="44" font-weight="bold" fill="#3A6EA5">6</text>
  <text x="514" y="573" font-size="15" fill="#1F3864">再利用、维修与回收</text>
  <text x="514" y="597" font-size="15" fill="#1F3864">使用过的设备</text>

  <rect x="817" y="494" width="364" height="178" fill="#C3CCD6"/>
  <rect x="812" y="488" width="364" height="178" fill="#F4F6F8" stroke="#C9D2DC"/>
  <text x="852" y="592" font-size="44" font-weight="bold" fill="#3A6EA5">9</text>
  <text x="908" y="583" font-size="15" fill="#1F3864">选择应用这些原则的提供方</text>

  <text x="24" y="704" font-size="11.5" fill="#6B7A88">来源：The Shift Project Lean-ICT 工作组。编号 1–9 沿用原图（按列排列：左列为 1–3，中列为 4–6，右列为 7–9）。</text>
</svg>
