<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" font-family="Hiragino Sans GB, sans-serif">
<rect width="820" height="210" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">本文档使用的 ArchiMate 元素</text>
<g font-size="11" text-anchor="middle">
<rect x="30" y="55" width="140" height="44" rx="20" fill="#fdf3d8" stroke="#b09040"/><text x="100" y="82">目标</text>
<rect x="190" y="55" width="150" height="44" rx="20" fill="#fdf3d8" stroke="#b09040"/><text x="265" y="82">需求</text>
<rect x="360" y="55" width="150" height="44" rx="20" fill="#f2ecf7" stroke="#806a9e"/><text x="435" y="82">业务角色</text>
<rect x="530" y="55" width="170" height="44" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="615" y="82">业务功能</text>
<rect x="30" y="120" width="180" height="44" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="120" y="147">业务协作</text>
<rect x="230" y="120" width="180" height="44" rx="6" fill="#dfe8dc" stroke="#5f8f5f"/><text x="320" y="147">应用功能</text>
</g>
<text x="20" y="196" font-size="10.5" fill="#666">动机（目标/需求）→ 业务角色与协作 → 业务功能 → 应用功能，逐层把“为何”落到“如何实现”。</text>
</svg>
