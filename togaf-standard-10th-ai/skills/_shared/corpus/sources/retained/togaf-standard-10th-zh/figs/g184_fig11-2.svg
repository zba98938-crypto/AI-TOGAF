<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="820" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">EA 价值驱动（示例）</text>
<g font-size="11" text-anchor="middle">
<rect x="320" y="50" width="180" height="45" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="410" y="77">EA 能力价值</text>
<rect x="40" y="130" width="170" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="125" y="154">更好的决策</text>
<text x="125" y="172" font-size="10">信息及时、可追溯</text>
<rect x="225" y="130" width="170" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="310" y="154">更快的交付</text>
<text x="310" y="172" font-size="10">复用、标准、护栏</text>
<rect x="410" y="130" width="170" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="495" y="154">更低的成本</text>
<text x="495" y="172" font-size="10">避免重复、减少返工</text>
<rect x="595" y="130" width="190" height="55" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="690" y="154">更低的风险</text>
<text x="690" y="172" font-size="10">合规、依赖、技术债务</text>
</g>
<g stroke="#888" stroke-width="1.1" fill="none"><path d="M380,95 L125,130"/><path d="M400,95 L310,130"/><path d="M430,95 L495,130"/><path d="M450,95 L690,130"/></g>
<text x="20" y="240" font-size="10.5" fill="#666">以时间线展示能力建设与价值释放（成熟度提升 → 决策质量 → 交付速度 → 成本与风险下降）。</text>
</svg>
