<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="320" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">业务周期与四种架构目的的对应</text>
<g font-size="10.5">
<rect x="30" y="55" width="200" height="60" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="130" y="80" text-anchor="middle" font-weight="bold">预算规划</text><text x="130" y="100" text-anchor="middle" font-size="10">支持战略的架构</text>
<rect x="240" y="55" width="200" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="340" y="80" text-anchor="middle" font-weight="bold">预算编制</text><text x="340" y="100" text-anchor="middle" font-size="10">支持组合的架构</text>
<rect x="450" y="55" width="200" height="60" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="550" y="80" text-anchor="middle" font-weight="bold">预算分配</text><text x="550" y="100" text-anchor="middle" font-size="10">支持项目的架构</text>
<rect x="660" y="55" width="190" height="60" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="755" y="80" text-anchor="middle" font-weight="bold">预算控制</text><text x="755" y="100" text-anchor="middle" font-size="10">支持解决方案交付</text>
</g>
<g stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#a)"><path d="M230,85 H240"/><path d="M440,85 H450"/><path d="M650,85 H660"/></g>
<text x="30" y="160" font-size="10.5" fill="#333">架构必须与业务周期同步：在决策前提供信息，而不是事后解释。</text>
<text x="30" y="190" font-size="10.5" fill="#333">常见失败模式：</text>
<text x="30" y="214">• 错过目的：架构与决策无关</text>
<text x="30" y="236">• 错过业务周期：决策已做、预算已定才交付架构</text>
<text x="30" y="258">• 不做架构：直接跳到实施，缺乏约束与依赖管理</text>
<text x="30" y="290" font-size="10.5" fill="#666">“跳到阶段 G”只在特殊情况下可行，且需明确风险与补偿控制。</text>
</svg>
