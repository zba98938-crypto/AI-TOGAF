  <!-- 图例 -->
  <g transform="translate(0,90)">
  <rect x="20" y="1150" width="500" height="280" rx="4" fill="#FBFCFD" stroke="#C3CED8"/>
  <text x="40" y="1176" font-size="13" font-weight="bold" fill="#1F4E79">图例</text>
  <g font-size="10.5" fill="#33475B">
