  <rect width="1200" height="1530" fill="#FFFFFF"/>
  <text x="40" y="32" font-size="19" font-weight="bold" fill="#1F4E79">图 5-1　TOGAF ADM 与 PMBOK 映射（高层）</text>
  <text x="40" y="54" font-size="12" fill="#5A6B7B">阶段 A 对应启动与规划过程组；阶段 B–F 对应执行、监控与阶段控制；阶段 F 收尾</text>

