    <text x="102" y="1276">阶段 B–F 控制与指导</text>
    <path d="M40,1300 C44,1322 70,1300 80,1320 C90,1340 110,1312 118,1330" fill="none" stroke="#D68910" stroke-width="2"/>
    <text x="132" y="1312">ADM 迭代（阶段 B–F 内循环）</text>
    <text x="40" y="1352" font-size="10" fill="#5A6B7B">本图为高层映射，部分流程作了归并；仅示主要交付物。</text>
    <text x="40" y="1372" font-size="10" fill="#5A6B7B">PMBOK 过程组：启动、规划、执行、监控、收尾。</text>
    <text x="40" y="1392" font-size="10" fill="#5A6B7B">阶段 B–F 的执行视为项目后续阶段，阶段末为重要里程碑。</text>
    <text x="40" y="1412" font-size="10" fill="#5A6B7B">阶段 F 最后一步采用“结束项目或阶段”流程。</text>
  </g>
  </g>
</svg>
