<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">传统阶段 vs 敏捷环境中的架构活动</text>
<g font-size="11">
<text x="30" y="60" font-weight="bold">传统</text>
<g fill="#e8eef7" stroke="#5b7aa8"><rect x="30" y="75" width="180" height="40"/><rect x="220" y="75" width="180" height="40"/><rect x="410" y="75" width="180" height="40"/><rect x="600" y="75" width="180" height="40"/></g>
<g text-anchor="middle" fill="#222"><text x="120" y="100">A 定义问题</text><text x="310" y="100">B/C/D 基线与目标</text><text x="500" y="100">E/F/G 部署目标</text><text x="690" y="100">H 管理变更</text></g>
<text x="30" y="160" font-weight="bold">敏捷</text>
<g fill="#e9f2e9" stroke="#5f8f5f"><rect x="30" y="175" width="180" height="40"/><rect x="220" y="175" width="180" height="40"/><rect x="410" y="175" width="180" height="40"/><rect x="600" y="175" width="180" height="40"/></g>
<g text-anchor="middle" fill="#222"><text x="120" y="200">A 持续细化</text><text x="310" y="200">B/C/D 并行扩展</text><text x="500" y="200">E/F/G 增量部署</text><text x="690" y="200">H 持续反馈</text></g>
<g stroke="#5f8f5f" stroke-width="1" stroke-dasharray="3 3"><path d="M120,215 V245"/><path d="M310,215 V245"/><path d="M500,215 V245"/><path d="M690,215 V245"/></g>
</g>
<text x="20" y="275" font-size="10.5" fill="#666">敏捷中活动持续并行、迭代推进；问题定义只需“足够”即可启动其他活动。</text>
</svg>
