<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#00A3C4"/>
    </marker>
    <marker id="darkArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>
  <rect x="14" y="14" width="1172" height="532" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.4" stroke-dasharray="7 5"/>

  <!-- 层级标签 -->
  <text x="52" y="220" transform="rotate(-90 52 220)" text-anchor="middle" font-size="18" font-weight="bold" letter-spacing="4" fill="#1F3864">元数据</text>
  <text x="52" y="440" transform="rotate(-90 52 440)" text-anchor="middle" font-size="18" font-weight="bold" letter-spacing="4" fill="#1F3864">数据</text>

  <!-- 元数据管理 -->
  <g fill="#00A3C4" stroke="#00758F" stroke-width="1">
    <circle cx="300" cy="36" r="7"/>
    <path d="M288,58 c0,-11 24,-11 24,0 v4 h-24 z"/>
    <circle cx="330" cy="36" r="7"/>
    <path d="M318,58 c0,-11 24,-11 24,0 v4 h-24 z"/>
    <circle cx="360" cy="36" r="7"/>
    <path d="M348,58 c0,-11 24,-11 24,0 v4 h-24 z"/>
  </g>
  <rect x="230" y="62" width="220" height="52" fill="#00A3C4" stroke="#00758F"/>
  <text x="340" y="94" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">元数据管理</text>

  <line x1="80" y1="122" x2="600" y2="122" stroke="#00A3C4" stroke-width="1.6"/>
  <line x1="80" y1="127" x2="600" y2="127" stroke="#00A3C4" stroke-width="1.6"/>

  <!-- 数据区域 -->
  <polygon points="145,155 575,155 540,440 175,440" fill="#C9CCCE"/>

  <rect x="183" y="170" width="38" height="250" rx="19" fill="#D98C8C" stroke="#B96B6B"/>
  <text x="202" y="295" transform="rotate(-90 202 295)" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">数据剖析</text>

  <!-- 结构化 -->
  <g>
    <path d="M287,203 v26 a38,9 0 0 0 76,0 v-26 z" fill="#4A4A4A" stroke="#2E2E2E"/>
    <ellipse cx="325" cy="203" rx="38" ry="9" fill="#6B6B6B" stroke="#2E2E2E"/>
  </g>
  <text x="380" y="207" font-size="14.5" font-weight="bold" fill="#1A1A1A">结构化数据</text>
  <text x="380" y="226" font-size="11.5" fill="#555555">关系数据库管理系统、元数据存储</text>

  <!-- 半结构化 -->
  <g>
    <rect x="300" y="274" width="58" height="12" rx="2" fill="#3F3F3F" stroke="#2E2E2E"/>
    <rect x="294" y="282" width="58" height="32" rx="2" fill="#4A4A4A" stroke="#2E2E2E"/>
  </g>
  <text x="380" y="292" font-size="14.5" font-weight="bold" fill="#1A1A1A">半结构化数据</text>
  <text x="380" y="311" font-size="11.5" fill="#555555">Parquet、Avro 等</text>

  <!-- 非结构化 -->
  <g>
    <path d="M305,360 h44 l12,12 v34 h-56 z" fill="#4A4A4A" stroke="#2E2E2E"/>
    <path d="M349,360 v12 h12" fill="#6B6B6B" stroke="#2E2E2E"/>
  </g>
  <text x="380" y="376" font-size="14.5" font-weight="bold" fill="#1A1A1A">非结构化数据</text>
  <text x="380" y="395" font-size="11.5" fill="#555555">PDF、DOCX、JPG、AVI 等</text>

  <!-- 数据剖析连接线 -->
  <g stroke="#333333" stroke-width="1.3">
    <line x1="221" y1="209" x2="287" y2="209"/>
    <line x1="221" y1="295" x2="294" y2="295"/>
    <line x1="221" y1="380" x2="305" y2="380"/>
  </g>
  <g stroke="#5A5A5A" stroke-width="1.6" fill="none" marker-end="url(#darkArrow)">
    <line x1="325" y1="360" x2="325" y2="318"/>
    <line x1="325" y1="274" x2="325" y2="235"/>
  </g>
  <g stroke="#9AA5B1" stroke-width="1">
    <line x1="245" y1="250" x2="568" y2="250"/>
    <line x1="245" y1="254" x2="568" y2="254"/>
    <line x1="240" y1="335" x2="562" y2="335"/>
    <line x1="240" y1="339" x2="562" y2="339"/>
  </g>

  <!-- 元数据采集箭头 -->
  <g stroke="#00A3C4" stroke-width="2.4" fill="none" marker-end="url(#cyanArrow)">
    <line x1="202" y1="168" x2="282" y2="116"/>
    <line x1="325" y1="194" x2="350" y2="116"/>
  </g>

  <!-- 说明框 -->
  <rect x="630" y="158" width="522" height="88" fill="#FAFBFC" stroke="#8A94A6"/>
  <text x="646" y="182" font-size="12.5" fill="#1A1A1A">
    <tspan x="646" dy="0">结构化数据：可以很容易地从数据库字典、技术元数据存储、数据</tspan>
    <tspan x="646" dy="19">集成存储库中收集；收集数据模式本身无需访问数据。</tspan>
  </text>
  <line x1="566" y1="214" x2="630" y2="202" stroke="#8A94A6" stroke-width="1"/>

  <rect x="630" y="266" width="522" height="70" fill="#FAFBFC" stroke="#8A94A6"/>
  <text x="646" y="290" font-size="12.5" fill="#1A1A1A">
    <tspan x="646" dy="0">半结构化文件带有结构，但模式稳定性没有保证——每个文件</tspan>
    <tspan x="646" dy="19">可能有自己的结构。</tspan>
  </text>
  <line x1="566" y1="300" x2="630" y2="300" stroke="#8A94A6" stroke-width="1"/>

  <rect x="630" y="352" width="522" height="104" fill="#FAFBFC" stroke="#8A94A6"/>
  <text x="646" y="376" font-size="12.5" fill="#1A1A1A">
    <tspan x="646" dy="0">非结构化数据：无法管理自己不知道的内容。分析与治理前，</tspan>
    <tspan x="646" dy="19">必须提取最低限度结构（如图像中的形状、文档中的电子邮件</tspan>
    <tspan x="646" dy="19">地址）；这需要扫描数据内容，海量文件时计算量很大。</tspan>
  </text>
  <line x1="566" y1="386" x2="630" y2="394" stroke="#8A94A6" stroke-width="1"/>
</svg>
