<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="360" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">TOGAF 企业元模型（核心实体与关系，示意）</text>
<g font-size="11" text-anchor="middle">
<rect x="30" y="50" width="150" height="40" fill="#fdf3d8" stroke="#b09040"/><text x="105" y="75">驱动因素</text>
<rect x="200" y="50" width="150" height="40" fill="#fdf3d8" stroke="#b09040"/><text x="275" y="75">目标 / 目的</text>
<rect x="370" y="50" width="150" height="40" fill="#fdf3d8" stroke="#b09040"/><text x="445" y="75">原则 / 约束</text>
<rect x="540" y="50" width="150" height="40" fill="#fdf3d8" stroke="#b09040"/><text x="615" y="75">需求</text>
<rect x="710" y="50" width="140" height="40" fill="#fdf3d8" stroke="#b09040"/><text x="780" y="75">工作包</text>
<rect x="30" y="130" width="150" height="40" fill="#e9f2e9" stroke="#5f8f5f"/><text x="105" y="155">组织单元</text>
<rect x="200" y="130" width="150" height="40" fill="#e9f2e9" stroke="#5f8f5f"/><text x="275" y="155">参与者</text>
<rect x="370" y="130" width="150" height="40" fill="#e9f2e9" stroke="#5f8f5f"/><text x="445" y="155">业务服务</text>
<rect x="540" y="130" width="150" height="40" fill="#e9f2e9" stroke="#5f8f5f"/><text x="615" y="155">业务流程</text>
<rect x="710" y="130" width="140" height="40" fill="#e9f2e9" stroke="#5f8f5f"/><text x="780" y="155">业务能力</text>
<rect x="30" y="210" width="150" height="40" fill="#eef3f8" stroke="#5b7aa8"/><text x="105" y="235">应用组件</text>
<rect x="200" y="210" width="150" height="40" fill="#eef3f8" stroke="#5b7aa8"/><text x="275" y="235">数据实体</text>
<rect x="370" y="210" width="150" height="40" fill="#eef3f8" stroke="#5b7aa8"/><text x="445" y="235">技术服务</text>
<rect x="540" y="210" width="150" height="40" fill="#eef3f8" stroke="#5b7aa8"/><text x="615" y="235">逻辑/物理组件</text>
