<g stroke="#888" stroke-width="1" fill="none">
<path d="M180,70 H200"/><path d="M350,70 H370"/><path d="M520,70 H540"/><path d="M690,70 H710"/>
<path d="M105,90 V130"/><path d="M275,90 V130"/><path d="M445,90 V130"/><path d="M615,90 V130"/>
<path d="M105,170 V210"/><path d="M275,170 V210"/><path d="M445,170 V210"/>
</g>
<text x="20" y="300" font-size="10.5" fill="#666">上层：动机与需求；中层：业务架构实体；下层：应用、数据与技术实体。</text>
<text x="20" y="322" font-size="10.5" fill="#666">ABB 基于这些实体创建；SBB 实现为物理/运营组件并记录于解决方案全景。</text>
