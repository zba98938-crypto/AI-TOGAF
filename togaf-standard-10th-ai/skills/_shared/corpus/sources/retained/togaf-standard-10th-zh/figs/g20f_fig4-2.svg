<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="260" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">过渡架构：从一个稳定状态到下一个稳定状态</text>
<g font-size="11" text-anchor="middle">
<rect x="30" y="90" width="150" height="60" rx="6" fill="#f7f7f7" stroke="#777"/><text x="105" y="116">基线架构</text><text x="105" y="134" font-size="10">当前状态</text>
<rect x="230" y="90" width="150" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="305" y="110">过渡架构 1</text><text x="305" y="128" font-size="10">能力增量集 A</text><text x="305" y="144" font-size="10">稳定运行</text>
<rect x="430" y="90" width="150" height="60" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="505" y="110">过渡架构 2</text><text x="505" y="128" font-size="10">能力增量集 B</text><text x="505" y="144" font-size="10">稳定运行</text>
<rect x="630" y="90" width="170" height="60" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="715" y="116">目标架构</text><text x="715" y="134" font-size="10">期望终态</text>
</g>
<g stroke="#555" stroke-width="1.3" fill="none"><path d="M180,120 H230"/><path d="M380,120 H430"/><path d="M580,120 H630"/></g>
<text x="20" y="200" font-size="10.5" fill="#666">每个过渡架构在架构上具有重要意义，描述通往目标的路线图并确保实施后系统整体稳定。</text>
<text x="20" y="225" font-size="10.5" fill="#666">在敏捷中，能力增量通常通过冲刺实现；过渡架构与向利益相关者的业务价值发布相对应。</text>
</svg>
