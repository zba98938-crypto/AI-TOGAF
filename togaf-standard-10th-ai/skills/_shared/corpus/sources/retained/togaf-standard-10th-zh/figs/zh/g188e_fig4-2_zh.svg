    <text x="467" y="258" text-anchor="middle">设计并任命项目管理团队</text>
    <text x="610" y="258" font-size="9.5" fill="#5A6B7B">项目任务书：团队结构、角色描述</text>

    <rect x="352" y="278" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="298" text-anchor="middle">选择项目方法并汇编项目任务书</text>
    <text x="610" y="298" font-size="9.5" fill="#5A6B7B">项目任务书：项目方法</text>

    <rect x="352" y="318" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="338" text-anchor="middle">规划发起阶段</text>
    <text x="610" y="338" font-size="9.5" fill="#5A6B7B">发起阶段计划</text>
