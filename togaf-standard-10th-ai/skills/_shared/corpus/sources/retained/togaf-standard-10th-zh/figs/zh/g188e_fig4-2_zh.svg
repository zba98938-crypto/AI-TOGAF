    <text x="610" y="558" font-size="9.5" fill="#5A6B7B">PID：质量管理策略；质量登记册</text>

    <rect x="352" y="578" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="598" text-anchor="middle">编制配置管理策略</text>
    <text x="610" y="598" font-size="9" fill="#5A6B7B">PID：配置管理策略；配置项记录；问题登记册</text>

    <rect x="352" y="618" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="638" text-anchor="middle">编制沟通管理策略</text>
    <text x="610" y="638" font-size="9.5" fill="#5A6B7B">PID：沟通管理策略</text>

    <rect x="352" y="658" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="678" text-anchor="middle">建立项目控制</text>
    <text x="610" y="678" font-size="9.5" fill="#5A6B7B">PID：项目控制</text>

    <rect x="352" y="698" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="718" text-anchor="middle">创建项目计划</text>
    <text x="610" y="718" font-size="9.5" fill="#5A6B7B">PID：项目计划</text>

    <rect x="352" y="738" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="758" text-anchor="middle">细化商业论证</text>
    <text x="610" y="758" font-size="9.5" fill="#5A6B7B">PID：详细商业论证；收益评审计划</text>

    <rect x="352" y="778" width="230" height="30" rx="3" fill="#DCE9F5" stroke="#4A7EA8"/>
    <text x="467" y="798" text-anchor="middle">汇编项目启动文档</text>
    <text x="610" y="798" font-size="9.5" fill="#5A6B7B">项目启动文档（PID）</text>
