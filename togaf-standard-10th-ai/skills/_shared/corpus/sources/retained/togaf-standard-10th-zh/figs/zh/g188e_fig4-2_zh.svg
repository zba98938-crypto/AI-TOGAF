  <text x="620" y="110" text-anchor="middle" font-size="10" fill="#5A6B7B">主要交付物进入“项目任务书”</text>

  <g font-size="10.5" fill="#1F3448">
    <rect x="352" y="118" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <text x="467" y="138" text-anchor="middle">任命执行发起人与项目经理</text>
    <text x="610" y="138" font-size="9.5" fill="#5A6B7B">项目任务书：团队角色描述</text>

