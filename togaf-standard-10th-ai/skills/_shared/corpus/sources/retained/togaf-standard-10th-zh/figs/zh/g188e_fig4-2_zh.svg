    <text x="188" y="210" text-anchor="middle" font-size="11.5" fill="#1F3448">识别利益相关者、</text>
    <text x="188" y="228" text-anchor="middle" font-size="11.5" fill="#1F3448">关注点与业务需求</text>
    <text x="188" y="246" text-anchor="middle" font-size="9.5" fill="#5A6B7B">结果用于项目控制</text>

    <!-- 3 -->
    <rect x="72" y="266" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <circle cx="54" cy="299" r="11" fill="#4A5A6A"/><text x="54" y="303" text-anchor="middle" font-size="10.5" fill="#FFFFFF">3</text>
    <text x="188" y="290" text-anchor="middle" font-size="11.5" fill="#1F3448">确认并细化业务目标、</text>
