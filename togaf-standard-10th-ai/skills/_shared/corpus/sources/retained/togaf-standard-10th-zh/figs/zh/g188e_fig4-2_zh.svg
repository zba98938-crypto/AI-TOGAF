    <circle cx="344" cy="793" r="9" fill="#1F4E79"/><text x="344" y="797">11</text>
  </g>
  <text x="620" y="860" text-anchor="middle" font-size="9.5" fill="#5A6B7B">经批准的架构工作说明书（SoAW）纳入项目启动文档（PID）</text>

