  <rect width="1200" height="1530" fill="#FFFFFF"/>
  <text x="40" y="32" font-size="19" font-weight="bold" fill="#1F4E79">图 4-2　TOGAF ADM 与 PRINCE2 映射（详细）</text>
  <text x="40" y="54" font-size="12" fill="#5A6B7B">阶段 A 全部任务、PRINCE2 项目启动与发起流程及其主要交付物；带圈数字表示对应关系</text>

  <!-- 左：ADM A -->
  <rect x="20" y="64" width="300" height="940" fill="#FAFBFC" stroke="#C3CED8"/>
  <rect x="20" y="64" width="300" height="34" fill="#1F4E79"/>
  <text x="170" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">TOGAF 9.1 ADM（阶段 A）</text>

  <g>
    <!-- 1 -->
    <rect x="72" y="106" width="232" height="66" rx="3" fill="#DCE9F5" stroke="#4A7EA8"/>
    <circle cx="54" cy="139" r="11" fill="#1F4E79"/><text x="54" y="143" text-anchor="middle" font-size="10.5" fill="#FFFFFF">1</text>
    <text x="188" y="130" text-anchor="middle" font-size="11.5" fill="#1F3448">建立项目</text>
    <text x="188" y="148" text-anchor="middle" font-size="9.5" fill="#5A6B7B">触发 PRINCE2 项目启动</text>

    <!-- 2 -->
    <rect x="72" y="186" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
