  <g font-size="9" fill="#FFFFFF" text-anchor="middle">
    <circle cx="344" cy="673" r="9" fill="#4A5A6A"/><text x="344" y="677">2</text>
    <circle cx="344" cy="713" r="9" fill="#4A5A6A"/><text x="344" y="717">8</text>
