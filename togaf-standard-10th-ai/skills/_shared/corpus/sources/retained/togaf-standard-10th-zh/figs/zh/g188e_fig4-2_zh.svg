    <circle cx="54" cy="379" r="11" fill="#4A5A6A"/><text x="54" y="383" text-anchor="middle" font-size="10.5" fill="#FFFFFF">4</text>
    <text x="188" y="384" text-anchor="middle" font-size="11.5" fill="#1F3448">评估业务能力</text>

    <!-- 5 -->
    <rect x="72" y="426" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <circle cx="54" cy="459" r="11" fill="#4A5A6A"/><text x="54" y="463" text-anchor="middle" font-size="10.5" fill="#FFFFFF">5</text>
    <text x="188" y="454" text-anchor="middle" font-size="11.5" fill="#1F3448">评估业务转型就绪度</text>
    <text x="188" y="472" text-anchor="middle" font-size="9.5" fill="#5A6B7B">产出能力评估</text>

    <!-- 6 -->
    <rect x="72" y="506" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <circle cx="54" cy="539" r="11" fill="#4A5A6A"/><text x="54" y="543" text-anchor="middle" font-size="10.5" fill="#FFFFFF">6</text>
    <text x="188" y="534" text-anchor="middle" font-size="11.5" fill="#1F3448">定义范围</text>
    <text x="188" y="552" text-anchor="middle" font-size="9.5" fill="#5A6B7B">影响细化商业论证</text>

    <!-- 7 -->
    <rect x="72" y="586" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <circle cx="54" cy="619" r="11" fill="#4A5A6A"/><text x="54" y="623" text-anchor="middle" font-size="10.5" fill="#FFFFFF">7</text>
    <text x="188" y="610" text-anchor="middle" font-size="11.5" fill="#1F3448">确认并细化架构原则</text>
    <text x="188" y="628" text-anchor="middle" font-size="11.5" fill="#1F3448">（含业务原则）</text>
    <text x="188" y="646" text-anchor="middle" font-size="9.5" fill="#5A6B7B">产出架构原则</text>

    <!-- 8 -->
    <rect x="72" y="666" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <circle cx="54" cy="699" r="11" fill="#4A5A6A"/><text x="54" y="703" text-anchor="middle" font-size="10.5" fill="#FFFFFF">8</text>
    <text x="188" y="690" text-anchor="middle" font-size="11.5" fill="#1F3448">制定架构愿景</text>
    <text x="188" y="708" text-anchor="middle" font-size="9.5" fill="#5A6B7B">产出定义文档草案与愿景</text>

    <!-- 9 -->
    <rect x="72" y="746" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <circle cx="54" cy="779" r="11" fill="#4A5A6A"/><text x="54" y="783" text-anchor="middle" font-size="10.5" fill="#FFFFFF">9</text>
    <text x="188" y="774" text-anchor="middle" font-size="11.5" fill="#1F3448">定义目标架构价值主张</text>
    <text x="188" y="792" text-anchor="middle" font-size="11.5" fill="#1F3448">与 KPI</text>

    <!-- 10 -->
    <rect x="72" y="826" width="232" height="66" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
    <circle cx="54" cy="859" r="11" fill="#4A5A6A"/><text x="54" y="863" text-anchor="middle" font-size="10.5" fill="#FFFFFF">10</text>
    <text x="188" y="854" text-anchor="middle" font-size="11.5" fill="#1F3448">识别业务转型风险</text>
    <text x="188" y="872" text-anchor="middle" font-size="11.5" fill="#1F3448">与缓解活动</text>
    <text x="188" y="890" text-anchor="middle" font-size="9.5" fill="#5A6B7B">产出沟通计划</text>

    <!-- 11 -->
    <rect x="72" y="906" width="232" height="66" rx="3" fill="#DCE9F5" stroke="#4A7EA8"/>
    <circle cx="54" cy="939" r="11" fill="#1F4E79"/><text x="54" y="943" text-anchor="middle" font-size="10" fill="#FFFFFF">11</text>
    <text x="188" y="930" text-anchor="middle" font-size="11.5" fill="#1F3448">编制架构工作说明书</text>
    <text x="188" y="948" text-anchor="middle" font-size="11.5" fill="#1F3448">并获得批准</text>
    <text x="188" y="966" text-anchor="middle" font-size="9.5" fill="#5A6B7B">SoAW 纳入 PID</text>
  </g>

  <!-- 中：PRINCE2 项目启动 -->
