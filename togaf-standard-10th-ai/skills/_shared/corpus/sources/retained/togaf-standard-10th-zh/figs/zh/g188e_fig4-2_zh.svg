    <text x="610" y="518" font-size="9.5" fill="#5A6B7B">PID：风险管理策略；风险登记册</text>

    <rect x="352" y="538" width="230" height="30" rx="3" fill="#E8F1F8" stroke="#8A9BB0"/>
