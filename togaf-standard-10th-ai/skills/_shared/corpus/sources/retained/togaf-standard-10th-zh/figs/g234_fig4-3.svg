<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="300" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">元数据质量保障的两种方法</text>
<g font-size="11.5">
<rect x="30" y="50" width="390" height="200" rx="8" fill="#eef3f8" stroke="#5b7aa8"/>
<text x="50" y="78" font-weight="bold">规范式（Normative）</text>
<text x="50" y="104">• 由少数人创建，发布后只读</text>
<text x="50" y="126">• 静态、变更少</text>
<text x="50" y="148">• 通过校验工作流管理生命周期</text>
<text x="50" y="170">• 保证精确、准确、完整、一致</text>
<text x="50" y="192">• 适合受监管约束、集中管理的元数据</text>
<rect x="450" y="50" width="400" height="200" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/>
<text x="470" y="78" font-weight="bold">协作式（Collaborative）</text>
<text x="470" y="104">• 多人创建、多人编辑</text>
<text x="470" y="126">• 动态、最终一致</text>
<text x="470" y="148">• 适合数据民主化场景</text>
<text x="470" y="170">• 需把技术元数据与业务元数据关联</text>
<text x="470" y="192">• 依赖社区治理与使用规范</text>
</g>
<text x="20" y="285" font-size="10.5" fill="#666">可按元数据范围分别采用两种方法：合规类用规范式，技术类用协作式。</text>
</svg>
