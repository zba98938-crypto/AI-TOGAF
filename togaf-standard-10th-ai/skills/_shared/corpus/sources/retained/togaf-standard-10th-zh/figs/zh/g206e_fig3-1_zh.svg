<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <title>图 3-1　标准组织架构图（中文重绘）</title>

  <text x="40" y="42" font-size="21" font-weight="bold" fill="#1F3864">标准组织架构图</text>
  <text x="40" y="64" font-size="12" fill="#5B6B7E">自上而下的正式汇报关系；每一层只表达一个上级。</text>

  <!-- 连接线 -->
  <g stroke="#1F3864" stroke-width="1.6" fill="none">
    <path d="M600 132 V160"/>
    <path d="M175 160 H1000"/>
    <path d="M175 160 V185"/>
    <path d="M450 160 V185"/>
    <path d="M725 160 V185"/>
    <path d="M1000 160 V185"/>
    <path d="M175 257 V275 H270 V521"/>
    <path d="M270 351 H250"/>
    <path d="M270 436 H250"/>
    <path d="M270 521 H250"/>
    <path d="M450 257 V275 H550 V576"/>
    <path d="M550 351 H530"/>
    <path d="M550 426 H530"/>
    <path d="M550 501 H530"/>
    <path d="M550 576 H530"/>
    <path d="M725 257 V275 H818 V521"/>
    <path d="M818 351 H800"/>
    <path d="M818 436 H800"/>
    <path d="M818 521 H800"/>
    <path d="M1000 257 V275 H1100 V521"/>
    <path d="M1100 351 H1085"/>
    <path d="M1100 436 H1085"/>
    <path d="M1100 521 H1085"/>
  </g>

  <!-- CEO -->
  <rect x="510" y="72" width="180" height="60" rx="9" fill="#8FA8BC" stroke="#1F3864" stroke-width="1.4"/>
  <text x="600" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#10233F">首席执行官（CEO）</text>

  <!-- 一级部门 -->
  <g fill="#AFC6D6" stroke="#1F3864" stroke-width="1.3">
    <rect x="60" y="185" width="230" height="72" rx="8"/>
    <rect x="335" y="185" width="230" height="72" rx="8"/>
    <rect x="610" y="185" width="230" height="72" rx="8"/>
    <rect x="885" y="185" width="230" height="72" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#10233F">
    <text x="175" y="226">工程负责人</text>
    <text x="450" y="226">供应链负责人</text>
    <text x="725" y="226">市场负责人</text>
    <text x="1000" y="226">财务与行政负责人</text>
  </g>

  <!-- 工程条线 -->
  <g fill="#C9D8E2" stroke="#1F3864" stroke-width="1.2">
    <rect x="40" y="320" width="210" height="62" rx="7"/>
    <rect x="40" y="405" width="210" height="62" rx="7"/>
    <rect x="40" y="490" width="210" height="62" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#10233F">
    <text x="145" y="356">用户体验</text>
    <text x="145" y="441">业务逻辑</text>
    <text x="145" y="518">行政（服务器、网络）</text>
  </g>

  <!-- 供应链条线 -->
  <g fill="#C9D8E2" stroke="#1F3864" stroke-width="1.2">
    <rect x="300" y="320" width="230" height="62" rx="7"/>
    <rect x="300" y="395" width="230" height="62" rx="7"/>
    <rect x="300" y="470" width="230" height="62" rx="7"/>
    <rect x="300" y="545" width="230" height="62" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#10233F">
    <text x="415" y="356">品类管理</text>
    <text x="415" y="431">采购</text>
    <text x="415" y="506">运输与物流</text>
    <text x="415" y="581">仓库</text>
  </g>

  <!-- 市场条线 -->
  <g fill="#C9D8E2" stroke="#1F3864" stroke-width="1.2">
    <rect x="585" y="320" width="215" height="62" rx="7"/>
    <rect x="585" y="405" width="215" height="62" rx="7"/>
    <rect x="585" y="490" width="215" height="62" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#10233F">
    <text x="692" y="356">数字营销</text>
    <text x="692" y="441">品牌营销</text>
    <text x="692" y="526">联盟营销</text>
  </g>

  <!-- 财务与行政条线 -->
  <g fill="#C9D8E2" stroke="#1F3864" stroke-width="1.2">
    <rect x="855" y="320" width="230" height="62" rx="7"/>
    <rect x="855" y="405" width="230" height="62" rx="7"/>
    <rect x="855" y="490" width="230" height="62" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#10233F">
    <text x="970" y="356">人力资源</text>
    <text x="970" y="441">财务</text>
    <text x="970" y="526">设施</text>
  </g>

  <g font-size="10.5" fill="#5B6B7E">
    <text x="40" y="638">注：方框表示组织单元，连线表示正式汇报关系。</text>
  </g>
</svg>
