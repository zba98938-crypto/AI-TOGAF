<text x="20" y="320" font-size="10.5" fill="#666">应用层功能：采集、治理、报表、参考数据管理、管理、元数据集成。</text>
<text x="20" y="345" font-size="10.5" fill="#666">业务功能产出并维护文档；应用功能提供采集、校验、发布与集成的自动化支撑。</text>
