<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="340" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">减少 ICT 环境足迹的架构杠杆</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="55" width="180" height="80" rx="8" fill="#eef3f8" stroke="#5b7aa8"/><text x="130" y="82" font-weight="bold">业务架构</text><text x="130" y="104" font-size="10">用途合理化</text><text x="130" y="120" font-size="10">流程去物质化</text>
<rect x="240" y="55" width="180" height="80" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/><text x="330" y="82" font-weight="bold">应用架构</text><text x="330" y="104" font-size="10">生态设计、复用</text><text x="330" y="120" font-size="10">轻量协议</text>
<rect x="440" y="55" width="180" height="80" rx="8" fill="#fdf3d8" stroke="#b09040"/><text x="530" y="82" font-weight="bold">数据架构</text><text x="530" y="104" font-size="10">减少数据量、保留期</text><text x="530" y="120" font-size="10">归档与删除</text>
<rect x="640" y="55" width="200" height="80" rx="8" fill="#f7efe4" stroke="#b07a55"/><text x="740" y="82" font-weight="bold">技术架构</text><text x="740" y="104" font-size="10">能效、PUE、可再生能源</text><text x="740" y="120" font-size="10">设备寿命与回收</text>
</g>
<rect x="40" y="175" width="800" height="50" rx="8" fill="#f2ecf7" stroke="#806a9e"/><text x="440" y="205" font-size="11.5" text-anchor="middle">统一核算：范围 1/2/3 温室气体、能源、水、电子废弃物与生物多样性</text>
<g font-size="10.5" fill="#333">
<text x="40" y="260">实施要点：</text>
<text x="40" y="285">• 以“用途 + 基础设施”双视角设定目标架构，避免只优化数据中心而忽略终端与网络</text>
<text x="40" y="308">• 将环境影响作为质量属性纳入架构原则、评审与供应商选择；以敏捷迭代持续改进</text>
</g>
</svg>
