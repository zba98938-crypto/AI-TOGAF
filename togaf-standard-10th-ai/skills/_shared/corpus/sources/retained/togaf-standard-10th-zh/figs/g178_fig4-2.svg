<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="230" fill="#fff"/>
<text x="20" y="30" font-size="14" font-weight="bold">招聘员工（Recruit Employee）</text>
<g font-size="14" text-anchor="middle">
<path d="M30,70 H170 L210,115 L170,160 H30 L70,115 Z" fill="#cfe0d6" stroke="#4f7f5f"/><text x="110" y="110">定义岗位</text><text x="110" y="128" font-size="11">Define Position</text>
<path d="M220,70 H360 L400,115 L360,160 H220 L260,115 Z" fill="#dbe8df" stroke="#4f7f5f"/><text x="300" y="110">发布职位</text><text x="300" y="128" font-size="11">Communicate Position</text>
<path d="M410,70 H550 L590,115 L550,160 H410 L450,115 Z" fill="#cfe0d6" stroke="#4f7f5f"/><text x="490" y="110">评估应聘</text><text x="490" y="128" font-size="11">Assess Responses</text>
<path d="M600,70 H740 L780,115 L740,160 H600 L640,115 Z" fill="#dbe8df" stroke="#4f7f5f"/><text x="680" y="110">面试候选人</text><text x="680" y="128" font-size="11">Interview Candidates</text>
<path d="M790,70 H880 L900,115 L880,160 H790 L810,115 Z" fill="#cfe0d6" stroke="#4f7f5f"/><text x="835" y="110">入职</text><text x="835" y="128" font-size="11">Onboard</text>
</g>
<text x="20" y="205" font-size="11" fill="#666">该价值流为内部触发：由招聘经理发起，终点是新员工顺利入职并产出绩效。</text>
</svg>
