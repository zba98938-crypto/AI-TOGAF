<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" font-family="Hiragino Sans GB, sans-serif">
<rect width="820" height="200" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">本文档使用的 ArchiMate 元素</text>
<g font-size="11.5" text-anchor="middle">
<rect x="30" y="60" width="150" height="46" rx="20" fill="#fdf3d8" stroke="#b09040"/><text x="105" y="88">目标 Goal</text>
<rect x="210" y="60" width="150" height="46" rx="20" fill="#fdf3d8" stroke="#b09040"/><text x="285" y="88">利益相关者</text>
<rect x="390" y="60" width="170" height="46" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="475" y="88">业务功能</text>
<rect x="590" y="60" width="170" height="46" rx="6" fill="#dfe8dc" stroke="#5f8f5f"/><text x="675" y="88">应用功能</text>
</g>
<text x="20" y="150" font-size="10.5" fill="#666">业务功能=基于选定标准的一组业务行为；应用功能=由应用组件执行的自动化行为；</text>
<text x="20" y="170" font-size="10.5" fill="#666">目标与利益相关者属于动机方面，用于表达能力“为何”存在及服务谁。</text>
</svg>
