<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="260" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">元数据需求收集的两条路径</text>
<g font-size="11">
<rect x="30" y="50" width="380" height="150" rx="8" fill="#eef3f8" stroke="#5b7aa8"/>
<text x="50" y="76" font-weight="bold">自上而下（合规 / 业务用例驱动）</text>
<text x="50" y="102">• 法规：GDPR、偿付能力 II、IFRS 17</text>
<text x="50" y="124">• 内部规则：数字可持续性、安全</text>
<text x="50" y="146">• 业务用例：客户交互数据支持向上销售</text>
<text x="50" y="172">→ 业务支持强，一致性由校验流程保障</text>
<rect x="440" y="50" width="390" height="150" rx="8" fill="#e9f2e9" stroke="#5f8f5f"/>
<text x="460" y="76" font-weight="bold">自下而上（数据问题 / 数据集驱动）</text>
<text x="460" y="102">• 数据集：为客户信息文件（CIF）建文档</text>
<text x="460" y="124">• 数据问题：开票频率错误引发投诉</text>
<text x="460" y="146">• 从现有资产或问题出发补充元数据</text>
<text x="460" y="172">→ 机会驱动，需先以实例证明价值</text>
</g>
<text x="20" y="240" font-size="10.5" fill="#666">两种路径都需明确元数据范围与期望质量水平，并纳入治理工作流。</text>
</svg>
