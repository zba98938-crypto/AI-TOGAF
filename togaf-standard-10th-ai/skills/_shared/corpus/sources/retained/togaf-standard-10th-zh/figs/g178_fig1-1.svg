<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" font-family="Hiragino Sans GB, sans-serif">
<rect width="900" height="230" fill="#fff"/>
<text x="20" y="30" font-size="14" font-weight="bold">获取零售产品（Acquire Retail Product）</text>
<g font-size="14" text-anchor="middle">
<path d="M30,70 H160 L200,115 L160,160 H30 L70,115 Z" fill="#c9d6e3" stroke="#5b7aa8"/><text x="105" y="110">广告渠道</text><text x="105" y="128" font-size="11">Advertise Channels</text>
<path d="M210,70 H340 L380,115 L340,160 H210 L250,115 Z" fill="#d5e0ea" stroke="#5b7aa8"/><text x="285" y="110">展示商品</text><text x="285" y="128" font-size="11">Display Merchandise</text>
<path d="M390,70 H520 L560,115 L520,160 H390 L430,115 Z" fill="#c9d6e3" stroke="#5b7aa8"/><text x="465" y="110">启用选择</text><text x="465" y="128" font-size="11">Enable Selection</text>
<path d="M570,70 H700 L740,115 L700,160 H570 L610,115 Z" fill="#d5e0ea" stroke="#5b7aa8"/><text x="645" y="110">处理付款</text><text x="645" y="128" font-size="11">Process Payment</text>
<path d="M750,70 H880 L900,115 L880,160 H750 L790,115 Z" fill="#c9d6e3" stroke="#5b7aa8"/><text x="815" y="110">交付商品</text><text x="815" y="128" font-size="11">Deliver Merchandise</text>
</g>
<text x="20" y="205" font-size="11" fill="#666">价值流阶段按顺序创造并累加利益相关者价值；外箭头表示端到端流向。</text>
</svg>
