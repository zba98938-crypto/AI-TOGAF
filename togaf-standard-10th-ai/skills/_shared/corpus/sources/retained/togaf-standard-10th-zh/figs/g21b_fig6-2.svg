<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="Hiragino Sans GB, sans-serif">
<rect width="860" height="280" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">C-MDM 数据交换类型概览（PoA → MDM → PoC）</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="60" width="180" height="70" rx="6" fill="#eef3f8" stroke="#5b7aa8"/><text x="130" y="88">采集点 PoA</text><text x="130" y="108" font-size="10">业务应用/渠道</text>
<rect x="340" y="60" width="180" height="70" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="430" y="88">C-MDM 系统</text><text x="430" y="108" font-size="10">主数据/质量/合并</text>
<rect x="640" y="60" width="180" height="70" rx="6" fill="#e9f2e9" stroke="#5f8f5f"/><text x="730" y="88">消费点 PoC</text><text x="730" y="108" font-size="10">报表/运营/分析</text>
</g>
<g stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#a)">
<path d="M220,95 H340"/><path d="M520,95 H640"/>
</g>
<g font-size="10" fill="#444"><text x="245" y="86">采集（批量/实时/接口）</text><text x="545" y="86">分发（同步/批量/服务）</text></g>
<text x="40" y="180" font-size="10.5" fill="#333">整合式：批量获取 + 批量消费；协作式：主源与副本源同步；集中式：MDM 作为唯一真相系统。</text>
<text x="40" y="210" font-size="10.5" fill="#333">模式按用途选择，可在路线图各阶段逐步实施；应用也可消费旧版本或保留自有真相版本（如保费计算年龄）。</text>
<text x="40" y="245" font-size="10.5" fill="#666">关键在于：采集与消费都应通过受治理的 C-MDM 服务，避免绕过质量与合规控制。</text>
</svg>
