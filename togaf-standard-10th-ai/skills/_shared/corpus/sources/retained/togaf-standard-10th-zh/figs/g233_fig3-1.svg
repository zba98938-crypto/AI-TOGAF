<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Hiragino Sans GB, sans-serif">
<rect width="880" height="380" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">业务能力规划使用的 ArchiMate 元素与关系</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="50" width="170" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="125" y="80">利益相关者</text>
<rect x="240" y="50" width="170" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="325" y="80">目标</text>
<rect x="440" y="50" width="170" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="525" y="80">成果</text>
<rect x="640" y="50" width="170" height="50" rx="6" fill="#fdf3d8" stroke="#b09040"/><text x="725" y="80">价值</text>
<rect x="40" y="140" width="170" height="50" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="125" y="170">价值流/阶段</text>
<rect x="240" y="140" width="170" height="50" rx="6" fill="#dce6f2" stroke="#5b7aa8"/><text x="325" y="170">业务能力</text>
<rect x="440" y="140" width="170" height="50" rx="6" fill="#dfe8dc" stroke="#5f8f5f"/><text x="525" y="170">业务角色</text>
<rect x="640" y="140" width="170" height="50" rx="6" fill="#dfe8dc" stroke="#5f8f5f"/><text x="725" y="170">业务事件</text>
<rect x="40" y="230" width="170" height="50" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="125" y="260">业务流程</text>
<rect x="240" y="230" width="170" height="50" rx="6" fill="#f7efe4" stroke="#b07a55"/><text x="325" y="260">应用组件</text>
<rect x="440" y="230" width="170" height="50" rx="6" fill="#f2ecf7" stroke="#806a9e"/><text x="525" y="260">业务对象/数据</text>
<rect x="640" y="230" width="170" height="50" rx="6" fill="#f2ecf7" stroke="#806a9e"/><text x="725" y="260">资源</text>
</g>
<g stroke="#666" stroke-width="1" fill="none">
<path d="M125,90 V140"/><path d="M325,90 V140"/><path d="M525,90 V140"/><path d="M725,90 V140"/>
<path d="M210,165 H240"/><path d="M410,165 H440"/><path d="M610,165 H640"/>
<path d="M325,190 V230"/><path d="M525,190 V230"/><path d="M725,190 V230"/>
</g>
<text x="20" y="330" font-size="10.5" fill="#666">能力被“实例化”时，加入角色、应用组件、业务对象、业务流程与资源；这些关系是价值流—能力映射的基础。</text>
</svg>
