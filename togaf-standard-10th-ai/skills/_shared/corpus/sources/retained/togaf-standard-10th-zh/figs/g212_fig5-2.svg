<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Hiragino Sans GB, sans-serif">
<rect width="820" height="420" fill="#fff"/>
<text x="20" y="26" font-size="13" font-weight="bold">ABCD 采用方法框架（普及度 × 速度）</text>
<g font-size="11">
<line x1="120" y1="350" x2="760" y2="350" stroke="#555" stroke-width="1.2"/>
<line x1="120" y1="350" x2="120" y2="60" stroke="#555" stroke-width="1.2"/>
<text x="720" y="375" font-size="10.5">普及度（广度）→</text>
<text x="40" y="210" font-size="10.5" transform="rotate(-90 40 210)">速度（时间）→</text>
<rect x="130" y="70" width="300" height="130" fill="#fdf3d8" stroke="#b09040"/><text x="280" y="115" text-anchor="middle" font-weight="bold">Avant-Garde（先锋式）</text><text x="280" y="135" text-anchor="middle" font-size="10">低普及、高速度</text><text x="280" y="158" text-anchor="middle" font-size="10">部分业务线先试，经验外溢</text>
<rect x="440" y="70" width="310" height="130" fill="#e9f2e9" stroke="#5f8f5f"/><text x="595" y="115" text-anchor="middle" font-weight="bold">Big-Bang（大爆炸式）</text><text x="595" y="135" text-anchor="middle" font-size="10">高普及、高速度</text><text x="595" y="158" text-anchor="middle" font-size="10">全企业一次性铺开</text>
<rect x="130" y="210" width="300" height="130" fill="#eef3f8" stroke="#5b7aa8"/><text x="280" y="255" text-anchor="middle" font-weight="bold">Cohesive（凝聚式）</text><text x="280" y="275" text-anchor="middle" font-size="10">高普及、低速度</text><text x="280" y="298" text-anchor="middle" font-size="10">共识驱动，全员同行</text>
<rect x="440" y="210" width="310" height="130" fill="#f2ecf7" stroke="#806a9e"/><text x="595" y="255" text-anchor="middle" font-weight="bold">Discreet（谨慎式）</text><text x="595" y="275" text-anchor="middle" font-size="10">低普及、低速度</text><text x="595" y="298" text-anchor="middle" font-size="10">小步稳进，逐步积累</text>
</g>
<text x="20" y="400" font-size="10.5" fill="#666">四个象限仅为方法类型，不代表优劣排序；选择需有清晰理由与论证。</text>
</svg>
